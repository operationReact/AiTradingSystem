name: trading_client
description: MintTick AI trading client for web, Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/audio/minttick-signature.wav

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  amplify_core: 2.16.0
  amplify_flutter: 2.16.0
  amplify_auth_cognito: 2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
