server:
  port: 8080
spring:
  application:
    name: ai-trading-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aitrading}
    username: ${SPRING_DATASOURCE_USERNAME:aitrading}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_locally}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ai-trading-system
app:
  trading-mode: ${TRADING_MODE:PAPER}
  security:
    # Operator key for protected /api calls. Empty value means every protected call is rejected (fail closed).
    api-key: ${APP_API_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  risk:
    default-capital: 80000
    risk-per-trade-percent: 0.25
    max-daily-drawdown-percent: 1.0
    max-open-positions: 3
    # Assumed flat per-side cost model for paper fills. Not an Angel One fee schedule.
    fee-rate: 0.0005
    slippage-rate: 0.001
    signal-max-age-minutes: 30
  market-data:
  strategy:
    # Deterministic SMA trend + prior-volume confirmation. All generated signals are paper candidates.
    fast-period: ${STRATEGY_FAST_PERIOD:5}
    slow-period: ${STRATEGY_SLOW_PERIOD:20}
    target-risk-reward: ${STRATEGY_TARGET_RISK_REWARD:2}
    stop-buffer-percent: ${STRATEGY_STOP_BUFFER_PERCENT:0.5}
    max-signal-age-minutes: ${STRATEGY_MAX_SIGNAL_AGE_MINUTES:1440}
  market-data:
    # Strict app-level cap; requests may be split into provider-supported chunks.
    max-range-days: 366
    # Bounds synchronous operator work; partial runs remain resumable.
    max-chunks-per-run: 5
  news:
    provider: ${NEWS_ANALYSIS_PROVIDER:NONE}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    claude-model: ${CLAUDE_MODEL:claude-haiku-5.5}
    gemini-api-key: ${GEMINI_API_KEY:}
    claude-api-key: ${ANTHROPIC_API_KEY:}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-attempts: 2
  providers:
    gemini-enabled: false
    angel-one:
      api-key: ${ANGELONE_API_KEY:}
      client-code: ${ANGELONE_CLIENT_CODE:}
      password: ${ANGELONE_PASSWORD:}
      totp-secret: ${ANGELONE_TOTP_SECRET:}
      base-url: ${ANGELONE_BASE_URL:https://apiconnect.angelone.in}
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      # Conservative local ceiling; the provider's own session lifetime is not verified in the SDK source.
      session-max-age-seconds: 21600
      login-min-interval-ms: 5000
      quote-min-interval-ms: 1000
      # Bounded wait used only for session recovery; normal requests remain fail-fast.
      session-retry-max-wait-ms: 6000
      # Angel One publishes a daily public instrument JSON file; never follow redirects or accept oversized input.
      instrument-master-url: ${ANGELONE_INSTRUMENT_MASTER_URL:https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json}
      instrument-master-max-bytes: 52428800
      instrument-master-max-rows: 500000
      instrument-search-max-page-size: 100
      instrument-master-max-rejected-percent: 5
      instrument-master-min-retained-percent: 80
springdoc:
  swagger-ui:
    path: /swagger-ui.html