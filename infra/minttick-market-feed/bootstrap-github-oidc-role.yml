AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MintTick isolated read-only market-data Lambda Terraform deployer.
  Creates IAM deployment and fixed read-only invoke permissions. No running resources or broker secrets.
Resources:
  MintTickFeedGithubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: minttick-feed-github-deploy
      Description: Dev-branch GitHub OIDC can manage only MintTick read-only feed Lambda, its role, log group and separate S3 state.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: arn:aws:iam::098859530205:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": "repo:operationReact@215111824/AiTradingSystem@1433875172:ref:refs/heads/dev"
      Policies:
        - PolicyName: minttick-feed-terraform-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOnlyStateBucketMetadata
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: arn:aws:s3:::aitrading-paper-tfstate-098859530205-ap-south-1
                Condition:
                  StringLike:
                    "s3:prefix":
                      - "ai-trading/minttick-market-feed/*"
              - Sid: WriteOnlyDedicatedEncryptedState
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - arn:aws:s3:::aitrading-paper-tfstate-098859530205-ap-south-1/ai-trading/minttick-market-feed/terraform.tfstate
                  - arn:aws:s3:::aitrading-paper-tfstate-098859530205-ap-south-1/ai-trading/minttick-market-feed/terraform.tfstate.tflock
              - Sid: DeleteOnlyTransientStateLock
                Effect: Allow
                Action: s3:DeleteObject
                Resource: arn:aws:s3:::aitrading-paper-tfstate-098859530205-ap-south-1/ai-trading/minttick-market-feed/terraform.tfstate.tflock
              - Sid: ManageFeedLambdaOnly
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:ListVersionsByFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: arn:aws:lambda:ap-south-1:098859530205:function:minttick-dev-angelone-feed
              - Sid: ManageDedicatedFeedExecutionRoleOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRoleTags
                  - iam:DeleteRole
                Resource: arn:aws:iam::098859530205:role/minttick-dev-angelone-feed-lambda
              - Sid: PassOnlyFeedRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: arn:aws:iam::098859530205:role/minttick-dev-angelone-feed-lambda
                Condition:
                  StringEquals:
                    "iam:PassedToService": lambda.amazonaws.com
              - Sid: ManageFeedLogGroupOnly
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                # AWS logs tagging/creation can authorize against either the
                # exact log-group ARN or its canonical :* representation.
                # Scope both variants to this single MintTick feed log group.
                Resource:
                  - arn:aws:logs:ap-south-1:098859530205:log-group:/aws/lambda/minttick-dev-angelone-feed
                  - arn:aws:logs:ap-south-1:098859530205:log-group:/aws/lambda/minttick-dev-angelone-feed:*
              - Sid: ReadLogGroupMetadata
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
  MintTickFeedPaperInvokeOnly:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: minttick-invoke-read-only-feed-only
      Roles:
        - aitrading-paper-ec2-ssm
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: arn:aws:lambda:ap-south-1:098859530205:function:minttick-dev-angelone-feed
Outputs:
  RoleArn:
    Description: Set GitHub repository variable MINTTICK_FEED_DEPLOY_ROLE_ARN to this ARN.
    Value: !GetAtt MintTickFeedGithubRole.Arn
