# EC2 t4g.medium / Graviton PAPER-only localhost deployment.
# Compose runs on the existing encrypted persistent 35GiB EBS root volume.
# NO public listener, RDS, broker LIVE orders, remote research worker or SSH.
name: aitradingsystem-paper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 128
    environment:
      POSTGRES_DB: aitrading
      POSTGRES_USER: aitrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrading -d aitrading"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - paper_net

  backend:
    image: aitradingsystem-paper-backend-arm64:${RELEASE_SHA:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      TRADING_MODE: PAPER
      # Exact deployed commit; Mind progress evidence is only RUNTIME_VERIFIED on a known revision.
      APP_BUILD_REVISION: ${RELEASE_SHA:?required}
      # Preserve legacy owner Lambda reads, but authenticate live streams on
      # the registered EC2 Elastic IP using the four pre-existing allowlisted SSM String/SecureString parameters.
      # AWS role credentials come from the instance profile; no static AWS key
      # or broker credential is present in Compose or host runtime.env.
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-ANGEL_ONE}
      MARKET_DATA_LAMBDA_FUNCTION_NAME: ${MARKET_DATA_LAMBDA_FUNCTION_NAME:-}
      MINTTICK_ANGEL_ONE_SSM_STREAM_ENABLED: "true"
      # Opt-in only, enabled by a separate controlled deployment after market-hours verification.
      OWNER_FEED_ENABLED: ${OWNER_FEED_ENABLED:-false}
      OWNER_FEED_UNIVERSE_LIMIT: ${OWNER_FEED_UNIVERSE_LIMIT:-3000}
      OWNER_FEED_WS_TOKEN_CAP: ${OWNER_FEED_WS_TOKEN_CAP:-1000}
      OWNER_FEED_POLL_MS: ${OWNER_FEED_POLL_MS:-10000}
      # Independent, explicit opt-in. Requires OWNER_FEED_ENABLED=true plus
      # confirmed private historical API entitlement and one backend replica.
      # Merged code and a running quote feed do not authorize backfill.
      OWNER_HISTORY_BACKFILL_ENABLED: ${OWNER_HISTORY_BACKFILL_ENABLED:-false}
      # The owner-only private store is safe even when other customers exist.
      OWNER_PRIVATE_INTRADAY_ENABLED: ${OWNER_PRIVATE_INTRADAY_ENABLED:-false}
      OWNER_PRIVATE_INTRADAY_POLL_MS: ${OWNER_PRIVATE_INTRADAY_POLL_MS:-20000}
      OWNER_HISTORY_BACKFILL_POLL_MS: ${OWNER_HISTORY_BACKFILL_POLL_MS:-2000}
      # Actual registered EC2 EIP, host private IPv4 and host NIC MAC are sent
      # to Angel One in official REST login/profile request headers only.
      ANGELONE_CLIENT_PUBLIC_IP: "3.108.130.17"
      ANGELONE_CLIENT_LOCAL_IP: "10.87.0.10"
      ANGELONE_CLIENT_MAC_ADDRESS: ${ANGELONE_CLIENT_MAC_ADDRESS:-}
      # Exact Cognito owner-subject binding; not an API key or broker credential.
      MINTTICK_ANGEL_ONE_OWNER_SUB: ${MINTTICK_ANGEL_ONE_OWNER_SUB:-}
      # Upstox OAuth can read only three allowlisted SSM credentials via the
      # EC2 instance role after IAM review. Off by default. When enabled,
      # the backend ignores the legacy environment credentials entirely.
      # No broker secret is written to runtime.env, GitHub or Flutter.
      MINTTICK_UPSTOX_OAUTH_SSM_ENABLED: ${MINTTICK_UPSTOX_OAUTH_SSM_ENABLED:-false}
      # Owner-only individual-app TOTP login. No secrets in Compose.
      MINTTICK_UPSTOX_OWNER_TOTP_ENABLED: ${MINTTICK_UPSTOX_OWNER_TOTP_ENABLED:-false}
      UPSTOX_CLIENT_ID: ${UPSTOX_CLIENT_ID:-}
      UPSTOX_CLIENT_SECRET: ${UPSTOX_CLIENT_SECRET:-}
      UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-}
      # Independent one-year read-only Analytics Token: fetched directly from SSM by
      # the backend instance role; no token is injected into Compose or Flutter.
      MINTTICK_UPSTOX_ANALYTICS_ENABLED: ${MINTTICK_UPSTOX_ANALYTICS_ENABLED:-false}
      MINTTICK_UPSTOX_ANALYTICS_PROBE_ENABLED: ${MINTTICK_UPSTOX_ANALYTICS_PROBE_ENABLED:-false}
      # F&O WebSocket and PAPER option premium engine are independently OFF by default.
      # A source read does not authorize data retention, PAPER use or real orders.
      MINTTICK_UPSTOX_FNO_V3_FEED_ENABLED: ${MINTTICK_UPSTOX_FNO_V3_FEED_ENABLED:-false}
      # Optional bounded market-hours V3 subscribe; server requires source and
      # verified customer display rights before any automatic connection.
      MINTTICK_UPSTOX_FNO_AUTO_MARKET_FEED_ENABLED: ${MINTTICK_UPSTOX_FNO_AUTO_MARKET_FEED_ENABLED:-false}
      # Documented Upstox Plus V3 5-connection tier is an account-level
      # entitlement; these switches are independently reviewed and OFF by
      # default. No automatic extra sockets, rights or real orders on deploy.
      MINTTICK_UPSTOX_FNO_PLUS_FULL_CAPACITY_VERIFIED: ${MINTTICK_UPSTOX_FNO_PLUS_FULL_CAPACITY_VERIFIED:-false}
      MINTTICK_UPSTOX_FNO_PLUS_MULTI_SOCKET_ENABLED: ${MINTTICK_UPSTOX_FNO_PLUS_MULTI_SOCKET_ENABLED:-false}
      # Operator source-verified read-only watchlist; no unreviewed keys.
      MINTTICK_UPSTOX_FNO_AUTO_EXPAND_WATCHLIST_ENABLED: ${MINTTICK_UPSTOX_FNO_AUTO_EXPAND_WATCHLIST_ENABLED:-false}
      MINTTICK_UPSTOX_FNO_AUTO_EXPAND_UNDERLYINGS: ${MINTTICK_UPSTOX_FNO_AUTO_EXPAND_UNDERLYINGS:-}
      MINTTICK_UPSTOX_FNO_PAPER_ENABLED: ${MINTTICK_UPSTOX_FNO_PAPER_ENABLED:-false}
      # Separate real-money execution switch. No merge/deploy ever grants LIVE
      # trading implicitly; each order additionally requires broker and owner gates.
      MINTTICK_UPSTOX_FNO_LIVE_ORDER_ENABLED: ${MINTTICK_UPSTOX_FNO_LIVE_ORDER_ENABLED:-false}
      # Contract identity/expiry metadata is independently gated; never grants quote rights.
      MINTTICK_UPSTOX_FNO_CONTRACT_DISCOVERY_VERIFIED: ${MINTTICK_UPSTOX_FNO_CONTRACT_DISCOVERY_VERIFIED:-false}
      # Customer F&O display usage rights are a separate source-license gate.
      MINTTICK_UPSTOX_FNO_DISPLAY_RIGHTS_VERIFIED: ${MINTTICK_UPSTOX_FNO_DISPLAY_RIGHTS_VERIFIED:-false}
      # Each read-only last-price path requires independent provider authorization.
      # Never infer either entitlement from general display, feed, PAPER or LIVE flags.
      # These values are opt-in and stay disabled unless owner/provider verification
      # has already installed the corresponding host-local permission.
      MINTTICK_UPSTOX_FNO_REST_LAST_PRICE_DISPLAY_RIGHTS_VERIFIED: ${MINTTICK_UPSTOX_FNO_REST_LAST_PRICE_DISPLAY_RIGHTS_VERIFIED:-false}
      MINTTICK_UPSTOX_FNO_RETAINED_DISPLAY_RIGHTS_VERIFIED: ${MINTTICK_UPSTOX_FNO_RETAINED_DISPLAY_RIGHTS_VERIFIED:-false}
      MINTTICK_UPSTOX_FNO_PAPER_USAGE_RIGHTS_VERIFIED: ${MINTTICK_UPSTOX_FNO_PAPER_USAGE_RIGHTS_VERIFIED:-false}
      # STR-176 signed private source intake remains disabled unless an
      # independently pinned reviewer key and signed packets are installed.
      # The directory is mounted read-only and only into the backend.
      MINTTICK_FNO_RESEARCH_PRIVATE_INTAKE_ENABLED: ${MINTTICK_FNO_RESEARCH_PRIVATE_INTAKE_ENABLED:-false}
      MINTTICK_FNO_RESEARCH_PRIVATE_INTAKE_DIRECTORY: /run/minttick-fno176-intake
      MINTTICK_FNO_RESEARCH_PRIVATE_INTAKE_REVIEWER_PUBLIC_KEY: ${MINTTICK_FNO_RESEARCH_PRIVATE_INTAKE_REVIEWER_PUBLIC_KEY:-}
      # Separate bounded read-only source health scheduler; off unless explicitly approved.
      MINTTICK_UPSTOX_PROGRESS_SOURCE_PROBE_ENABLED: ${MINTTICK_UPSTOX_PROGRESS_SOURCE_PROBE_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aitrading
      SPRING_DATASOURCE_USERNAME: aitrading
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATASOURCE_POOL_SIZE: "4"
      APP_API_KEY: ${APP_API_KEY:?required}
      APP_DEV_SESSION_BOOTSTRAP_ENABLED: "false"
      APP_SESSION_COOKIE_SECURE: "true"
      # Identity-provider integration. Values must be installed securely on
      # the running PAPER host from the isolated Cognito Terraform outputs.
      # No client secret, password, broker key or token is ever stored here.
      # Deployed dev pool/public app client, no secrets. Use the existing
      # host and database; never expose the full PAPER application publicly.
      MINTTICK_COGNITO_ENABLED: ${MINTTICK_COGNITO_ENABLED:-false}
      MINTTICK_COGNITO_REGION: ap-south-1
      MINTTICK_COGNITO_ISSUER: ${MINTTICK_COGNITO_ISSUER:-https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_jz2T8qbiY}
      MINTTICK_COGNITO_CLIENT_ID: ${MINTTICK_COGNITO_CLIENT_ID:-6jm18v2mdpcfraip92hrjhqjnd}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8088,https://www.minttick.com,https://minttick.com
      APP_SECURITY_TRUST_FORWARDED_FOR: "false"
      AI_RESEARCH_WORKER_CLIENT_ENABLED: "false"
      AI_RESEARCH_WORKER_READINESS_ENABLED: "false"
      OFFICIAL_SOURCE_SCHEDULER_ENABLED: "false"
      # News and AI paths remain off unless protected host-local runtime.env
      # explicitly opts in. Source policy separately gates ingest, retention,
      # display and Gemini transfer. Provider credentials stay backend-only.
      NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-false}
      NEWS_EVENT_LEDGER_ENABLED: ${NEWS_EVENT_LEDGER_ENABLED:-false}
      NEWS_SUMMARIZATION_ENABLED: ${NEWS_SUMMARIZATION_ENABLED:-false}
      NEWS_ANALYZER_BRIDGE_ENABLED: ${NEWS_ANALYZER_BRIDGE_ENABLED:-false}
      NEWS_ANALYSIS_SCHEDULER_ENABLED: ${NEWS_ANALYSIS_SCHEDULER_ENABLED:-false}
      NEWS_MIND_CONTEXT_ENABLED: ${NEWS_MIND_CONTEXT_ENABLED:-false}
      NEWS_ANALYZER_APPROVED_SOURCES: ${NEWS_ANALYZER_APPROVED_SOURCES:-}
      NEWS_ANALYSIS_PROVIDER: ${NEWS_ANALYSIS_PROVIDER:-NONE}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PAPER_INTRADAY_CLOSE_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1024m -XX:ActiveProcessorCount=2 -Djava.security.egd=file:/dev/./urandom"
    # Metadata-only owner-history counts and separately signed STR-176
    # packets. Raw SQLite/gzip history remains unmounted. Intake is read-only.
    volumes:
      - /opt/aitradingsystem-paper/monitor:/run/minttick-owner-history:ro
      - type: bind
        source: /opt/aitradingsystem-paper/fno176-attested-intake
        target: /run/minttick-fno176-intake
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - paper_net

  web:
    image: aitradingsystem-paper-web-arm64:${RELEASE_SHA:?required}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8080"
      # Private EC2 VPC IP only; SG accepts TCP 8081 solely from dedicated Lambda SG.
      # Trading backend remains bound only to 127.0.0.1:8080.
      - "10.87.0.10:8081:8080"
    networks:
      - paper_net

networks:
  paper_net:
    driver: bridge

volumes:
  postgres_data:
