# EC2 t4g.medium / Graviton PAPER-only localhost deployment.
# Compose runs on the existing encrypted persistent 35GiB EBS root volume.
# NO public listener, RDS, broker LIVE orders, remote research worker or SSH.
name: aitradingsystem-paper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 128
    environment:
      POSTGRES_DB: aitrading
      POSTGRES_USER: aitrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrading -d aitrading"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - paper_net

  backend:
    image: aitradingsystem-paper-backend-arm64:${RELEASE_SHA:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      TRADING_MODE: PAPER
      # Preserve legacy owner Lambda reads, but authenticate live streams on
      # the registered EC2 Elastic IP using the four pre-existing allowlisted SSM String/SecureString parameters.
      # AWS role credentials come from the instance profile; no static AWS key
      # or broker credential is present in Compose or host runtime.env.
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-ANGEL_ONE}
      MARKET_DATA_LAMBDA_FUNCTION_NAME: ${MARKET_DATA_LAMBDA_FUNCTION_NAME:-}
      MINTTICK_ANGEL_ONE_SSM_STREAM_ENABLED: "true"
      # Opt-in only, enabled by a separate controlled deployment after market-hours verification.
      OWNER_FEED_ENABLED: ${OWNER_FEED_ENABLED:-false}
      OWNER_FEED_UNIVERSE_LIMIT: ${OWNER_FEED_UNIVERSE_LIMIT:-3000}
      OWNER_FEED_WS_TOKEN_CAP: ${OWNER_FEED_WS_TOKEN_CAP:-1000}
      OWNER_FEED_POLL_MS: ${OWNER_FEED_POLL_MS:-10000}
      # Independent, explicit opt-in. Requires OWNER_FEED_ENABLED=true plus
      # confirmed private historical API entitlement and one backend replica.
      # Merged code and a running quote feed do not authorize backfill.
      OWNER_HISTORY_BACKFILL_ENABLED: ${OWNER_HISTORY_BACKFILL_ENABLED:-false}
      OWNER_HISTORY_BACKFILL_POLL_MS: ${OWNER_HISTORY_BACKFILL_POLL_MS:-2000}
      # Actual registered EC2 EIP, host private IPv4 and host NIC MAC are sent
      # to Angel One in official REST login/profile request headers only.
      ANGELONE_CLIENT_PUBLIC_IP: "3.108.130.17"
      ANGELONE_CLIENT_LOCAL_IP: "10.87.0.10"
      ANGELONE_CLIENT_MAC_ADDRESS: ${ANGELONE_CLIENT_MAC_ADDRESS:-}
      # Exact Cognito owner-subject binding; not an API key or broker credential.
      MINTTICK_ANGEL_ONE_OWNER_SUB: ${MINTTICK_ANGEL_ONE_OWNER_SUB:-}
      # Upstox app-owned OAuth credentials are injected only from protected host runtime.env.
      # These are never compiled into the Flutter client or CI release artifacts.
      UPSTOX_CLIENT_ID: ${UPSTOX_CLIENT_ID:-}
      UPSTOX_CLIENT_SECRET: ${UPSTOX_CLIENT_SECRET:-}
      UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-}
      # Independent one-year read-only Analytics Token: fetched directly from SSM by
      # the backend instance role; no token is injected into Compose or Flutter.
      MINTTICK_UPSTOX_ANALYTICS_ENABLED: ${MINTTICK_UPSTOX_ANALYTICS_ENABLED:-false}
      MINTTICK_UPSTOX_ANALYTICS_PROBE_ENABLED: ${MINTTICK_UPSTOX_ANALYTICS_PROBE_ENABLED:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aitrading
      SPRING_DATASOURCE_USERNAME: aitrading
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATASOURCE_POOL_SIZE: "4"
      APP_API_KEY: ${APP_API_KEY:?required}
      APP_DEV_SESSION_BOOTSTRAP_ENABLED: "false"
      APP_SESSION_COOKIE_SECURE: "true"
      # Identity-provider integration. Values must be installed securely on
      # the running PAPER host from the isolated Cognito Terraform outputs.
      # No client secret, password, broker key or token is ever stored here.
      # Deployed dev pool/public app client, no secrets. Use the existing
      # host and database; never expose the full PAPER application publicly.
      MINTTICK_COGNITO_ENABLED: ${MINTTICK_COGNITO_ENABLED:-false}
      MINTTICK_COGNITO_REGION: ap-south-1
      MINTTICK_COGNITO_ISSUER: ${MINTTICK_COGNITO_ISSUER:-https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_jz2T8qbiY}
      MINTTICK_COGNITO_CLIENT_ID: ${MINTTICK_COGNITO_CLIENT_ID:-6jm18v2mdpcfraip92hrjhqjnd}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8088,https://www.minttick.com,https://minttick.com
      APP_SECURITY_TRUST_FORWARDED_FOR: "false"
      AI_RESEARCH_WORKER_CLIENT_ENABLED: "false"
      AI_RESEARCH_WORKER_READINESS_ENABLED: "false"
      OFFICIAL_SOURCE_SCHEDULER_ENABLED: "false"
      NEWS_INGESTION_ENABLED: "false"
      PAPER_INTRADAY_CLOSE_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1024m -XX:ActiveProcessorCount=2 -Djava.security.egd=file:/dev/./urandom"
    # Metadata-only, root-published sanitized counts. The raw root-only
    # SQLite and gzip candle archive must NEVER be mounted in this container.
    volumes:
      - /opt/aitradingsystem-paper/monitor:/run/minttick-owner-history:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - paper_net

  web:
    image: aitradingsystem-paper-web-arm64:${RELEASE_SHA:?required}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8080"
      # Private EC2 VPC IP only; SG accepts TCP 8081 solely from dedicated Lambda SG.
      # Trading backend remains bound only to 127.0.0.1:8080.
      - "10.87.0.10:8081:8080"
    networks:
      - paper_net

networks:
  paper_net:
    driver: bridge

volumes:
  postgres_data:
