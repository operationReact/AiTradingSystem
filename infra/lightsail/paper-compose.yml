# Single-VM INTERNAL-only PAPER acceptance stack. Never bind :5432/:8090 or
# app HTTP to a public interface. Public HTTPS requires a separate reviewed gate.
name: aitradingsystem-paper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 128
    environment:
      POSTGRES_DB: aitrading
      POSTGRES_USER: aitrading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrading -d aitrading"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - paper_net

  backend:
    image: aitradingsystem-paper-backend:${RELEASE_SHA:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      TRADING_MODE: PAPER
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aitrading
      SPRING_DATASOURCE_USERNAME: aitrading
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATASOURCE_POOL_SIZE: "4"
      APP_API_KEY: ${APP_API_KEY:?required}
      APP_DEV_SESSION_BOOTSTRAP_ENABLED: "false"
      APP_SESSION_COOKIE_SECURE: "true"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8088
      APP_SECURITY_TRUST_FORWARDED_FOR: "false"
      AI_RESEARCH_WORKER_CLIENT_ENABLED: "false"
      AI_RESEARCH_WORKER_READINESS_ENABLED: "false"
      OFFICIAL_SOURCE_SCHEDULER_ENABLED: "false"
      NEWS_INGESTION_ENABLED: "false"
      PAPER_INTRADAY_CLOSE_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1024m -XX:ActiveProcessorCount=2 -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - paper_net

  web:
    image: aitradingsystem-paper-web:${RELEASE_SHA:?required}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - paper_net

networks:
  paper_net:
    driver: bridge

volumes:
  postgres_data:
