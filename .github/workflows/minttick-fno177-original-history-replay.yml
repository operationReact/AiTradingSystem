name: MintTick F&O - STR-177 original-source mean reversion replay

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno177-original-history-replay.yml'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno177VerifiedHistoricalReplayService.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/FnoFuturesMeanReversionV1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/FnoFuturesMeanReversionV1Test.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno177VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java'
      - 'docs/architecture/fno-str177-original-replay.md'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno177-original-history-replay.yml'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno177VerifiedHistoricalReplayService.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/FnoFuturesMeanReversionV1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/FnoFuturesMeanReversionV1Test.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno177VerifiedHistoricalReplayServiceTest.java'
permissions:
  contents: read
jobs:
  str177-asof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run original-vs-future-timestamp and ten-session typed Java evaluator tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            '-Dtest=Fno177VerifiedHistoricalReplayServiceTest,FnoFuturesMeanReversionV1Test,FnoVerifiedCompletedOhlcvOiStoreTest' test
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.Fno177VerifiedHistoricalReplayServiceTest.xml
      - name: Verify no future-known source, unverifiable quote, or broker order action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/main/java/in/aitradingsystem/tradingrooms/Fno177VerifiedHistoricalReplayService.java')
          s=p.read_text()
          for v in ('readExactReplayContract(', 'FnoFuturesMeanReversionV1.evaluate(',
                    'oiFirstAvailableAt()', 'ohlcvFirstAvailableAt()',
                    'originalOhlcvDigest()', 'originalOiDigest()',
                    'ORIGINAL_SOURCE_EVALUATOR_RESEARCH_ONLY',
                    'false,false,false,false'):
              assert v in s,v
          for forbidden in ('placeOrder','submitOrder','APPROVE_ALL',
                            'MINTTICK_UPSTOX_FNO_LIVE_ORDER_ENABLED',
                            'market_candle','fno_closing_snapshot'):
              assert forbidden not in s,forbidden
          PY
      - name: State market-data acceptance boundary accurately
        if: always()
        shell: bash
        run: |
          echo 'STR-177 original PostgreSQL V102 rights-joined source adapter: synthetic CI proof only.'
          echo 'No real host V102 eligible rows, actual after-cost OOS E2E or broker order verified.'
