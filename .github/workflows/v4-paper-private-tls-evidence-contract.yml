name: V87 PAPER backend and dormant TLS operator evidence correlation contract

on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/v4_operator_evidence_correlation.py'
      - 'scripts/tests/test_v4_operator_evidence_correlation.py'
      - 'scripts/tests/test_v4_operator_evidence_correlation_policy.py'
      - '.github/workflows/v4-paper-private-tls-evidence-correlation.yml'
      - '.github/workflows/v4-paper-private-tls-evidence-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/v4_operator_evidence_correlation.py'
      - 'scripts/tests/test_v4_operator_evidence_correlation.py'
      - 'scripts/tests/test_v4_operator_evidence_correlation_policy.py'
      - '.github/workflows/v4-paper-private-tls-evidence-correlation.yml'
      - '.github/workflows/v4-paper-private-tls-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Reject forged, stale and mixed-commit PAPER/TLS operator evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic GitHub run origin/commit/time/trading negative cases
        run: python3 -m unittest discover -v -s scripts/tests -p test_v4_operator_evidence_correlation.py
      - name: Verify read-only GitHub artifact-only manual permissions
        run: python3 -m unittest discover -v -s scripts/tests -p test_v4_operator_evidence_correlation_policy.py

# No AWS credentials, no market requests, no real model or trading output.
