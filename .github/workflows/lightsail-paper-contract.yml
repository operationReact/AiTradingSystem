name: Lightsail PAPER 4GB IaC safety (offline, no AWS)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/lightsail/**'
      - 'scripts/tests/test_lightsail_paper_bootstrap.py'
      - 'scripts/tests/test_lightsail_paper_rollout.py'
      - 'scripts/tests/test_lightsail_paper_requests.py'
      - 'apps/trading_client/Dockerfile.lightsail-paper'
      - 'apps/trading_client/deploy/nginx.lightsail-paper.conf'
      - '.github/workflows/lightsail-paper-bootstrap.yml'
      - '.github/workflows/lightsail-paper-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/lightsail/**'
      - 'scripts/tests/test_lightsail_paper_bootstrap.py'
      - '.github/workflows/lightsail-paper-bootstrap.yml'
      - '.github/workflows/lightsail-paper-contract.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated scoped OIDC and $24/4GB plan contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s scripts/tests -p test_lightsail_paper_bootstrap.py
          python3 -m unittest discover -v -s scripts/tests -p test_lightsail_paper_rollout.py
          python3 -m unittest discover -v -s scripts/tests -p test_lightsail_paper_requests.py
          python3 -m py_compile infra/lightsail/verify_plan.py infra/lightsail/prepare_ssh.py infra/lightsail/verify_request.py
          bash -n infra/lightsail/user-data.sh infra/lightsail/run_paper.sh
          RELEASE_SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            POSTGRES_PASSWORD=dummy APP_API_KEY=dummy \
            docker compose -f infra/lightsail/paper-compose.yml config --quiet
      - name: Verify no AWS access can occur in this offline job
        run: |
          set -euo pipefail
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          echo 'PAPER Lightsail bootstrap source validated; no instance created'
