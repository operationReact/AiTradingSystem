name: Repair UI review source

on:
  push:
    branches: [ui/post-login-mock-review]
    paths:
      - 'apps/trading_client/tool/add_improvement_analysis.py'
      - 'apps/trading_client/tool/fix_improvement_step_title.py'
      - '.github/workflows/repair-ui-review-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/post-login-mock-review

      - name: Apply additive decision-audit patch
        working-directory: apps/trading_client
        run: |
          python3 tool/add_improvement_analysis.py
          python3 tool/fix_improvement_step_title.py

      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'Source already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/trading_client/lib/src/presentation/review/mock_transparency_journey.dart
          git commit -m 'Complete post-trade improvement analysis navigation'
          git push origin HEAD:ui/post-login-mock-review
