name: Wire transparency completion

on:
  push:
    branches: [ui/post-login-mock-review]
    paths:
      - 'apps/trading_client/tool/add_transparency_completion.py'
      - '.github/workflows/repair-ui-review-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/post-login-mock-review

      - name: Wire final transparency completion surfaces
        working-directory: apps/trading_client
        run: python3 tool/add_transparency_completion.py

      - name: Commit source wiring
        run: |
          if git diff --quiet; then
            echo 'Transparency completion is already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/trading_client/lib/src/presentation/review/mock_review_app.dart \
                  apps/trading_client/lib/src/presentation/review/mock_trade_intelligence_report.dart
          git commit -m 'Wire Transparency 360 into review app'
          git push origin HEAD:ui/post-login-mock-review
