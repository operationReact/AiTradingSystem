name: Repair UI review source

on:
  push:
    branches: [ui/post-login-mock-review]
    paths:
      - 'apps/trading_client/tool/add_trade_intelligence_report.py'
      - 'apps/trading_client/tool/fix_trade_intelligence_model.py'
      - 'apps/trading_client/tool/fix_trade_intelligence_layout.py'
      - 'apps/trading_client/tool/enhance_trade_intelligence_transparency.py'
      - 'apps/trading_client/tool/fix_trade_intelligence_tabs.py'
      - 'apps/trading_client/tool/add_transparency_completion.py'
      - '.github/workflows/repair-ui-review-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/post-login-mock-review

      - name: Wire persistent trade intelligence report
        working-directory: apps/trading_client
        run: |
          python3 tool/add_trade_intelligence_report.py
          python3 tool/fix_trade_intelligence_model.py
          python3 tool/fix_trade_intelligence_layout.py
          python3 tool/enhance_trade_intelligence_transparency.py
          python3 tool/fix_trade_intelligence_tabs.py
          python3 tool/add_transparency_completion.py

      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'Source already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/trading_client/lib/src/presentation/review/mock_review_app.dart \
                  apps/trading_client/lib/src/presentation/review/mock_trade_journey.dart \
                  apps/trading_client/lib/src/presentation/review/mock_trade_intelligence_model.dart \
                  apps/trading_client/lib/src/presentation/review/mock_trade_intelligence_report.dart
          git commit -m 'Finalize complete trading transparency UI'
          git push origin HEAD:ui/post-login-mock-review
