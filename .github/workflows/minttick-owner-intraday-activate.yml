name: MintTick PAPER - activate private 5m and 1H source-backed collector
on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/enable_owner_intraday_history.sh'
      - '.github/workflows/minttick-owner-intraday-activate.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/activate-owner-intraday-history.json'
permissions:
  contents: read
concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify locked down source-only activation
        run: |
          set -euo pipefail
          bash -n infra/ec2-paper/enable_owner_intraday_history.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path("infra/ec2-paper/enable_owner_intraday_history.sh").read_text()
          assert 500 < len(text) < 7000
          assert 'OWNER_PRIVATE_INTRADAY_ENABLED=true' in text
          assert 'OWNER_FEED_ENABLED=true' in text
          assert 'INTRADAY_ACTIVATION_BLOCKED: SHARED_COLLECTOR_ACTIVE' in text
          assert 'INTRADAY_ACTIVATION_BLOCKED: PRIVATE_STORAGE_MISSING' in text
          assert 'INTRADAY_PRIVATE_STORAGE: VERIFIED' in text
          # SSM runs a stdin-streamed bash script: Docker exec must never drain it.
          assert 'exec -T postgres' in text
          assert '</dev/null 2>/dev/null)' in text
          assert "TRADING_MODE: PAPER" in text
          assert "rollback" in text
          assert "BACKEND_HEALTH: PASS" in text
          for forbidden in ('placeOrder', 'TRADING_MODE=LIVE', 'USER_LIVE', 'put-parameter', 'update-function-code'):
              assert forbidden not in text
          PY
  activate:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-09c01b470fb39b85a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate exact one-file owner approved activation
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/ec2-paper/requests/activate-owner-intraday-history.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('infra/ec2-paper/requests/activate-owner-intraday-history.json').read_text())
          assert v=={
            'application':'MintTick','environment':'paper',
            'aws_account':'098859530205','region':'ap-south-1',
            'instance_id':'i-09c01b470fb39b85a',
            'operation':'activate-private-owner-5m-1h-ingestion',
            'authorization':'USER_APPROVED_INTRADAY_INGESTION_2026-11-20',
            'trading_permission_change':False,
            'private_owner_only':True
          }
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-owner-intraday-20261120
      - name: Confirm exact instance and online SSM agent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'infra/ec2-paper')
          import verify_ssm_release
          verify_ssm_release.verify_aws()
          PY
      - name: Enable only source-backed owner intraday jobs on EC2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,gzip,json
          from pathlib import Path
          body=Path('infra/ec2-paper/enable_owner_intraday_history.sh').read_bytes()
          assert 500 < len(body) < 7000
          payload=base64.b64encode(gzip.compress(body,mtime=0)).decode()
          command="printf '%s' '"+payload+"' | base64 -d | gzip -dc | bash"
          assert len(command) < 3600, 'SSM command must fit its bounded transport'
          path=Path(os.environ['RUNNER_TEMP'])/'intraday-activation.json'
          path.write_text(json.dumps({'commands':[command]}))
          path.chmod(0o600)
          PY
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" --timeout-seconds 240 \
            --parameters "file://$RUNNER_TEMP/intraday-activation.json" \
            --comment 'MintTick owner-only historical 5m and 1H ingestion activation; no trading permission change' \
            --query Command.CommandId --output text)"
          rm -f "$RUNNER_TEMP/intraday-activation.json"
          for attempt in $(seq 1 50); do
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --output json \
              > "$RUNNER_TEMP/intraday-activation-result.json" 2>/dev/null || true
            status="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
            d=json.loads((Path(os.environ['RUNNER_TEMP'])/'intraday-activation-result.json').read_text())
          except (OSError,ValueError):
            print('PENDING');raise SystemExit
          state=d.get('Status','Pending')
          out=d.get('StandardOutputContent','')
          if not isinstance(out,str):out=''
          allowed={
            'OWNER_FEED_NOT_ACTIVE','OWNER_SUB_NOT_CONFIGURED',
            'BACKEND_FEED_NOT_ACTIVE','CUSTOMER_ISOLATION_UNVERIFIED',
            'OWNER_ISOLATION_DATABASE_UNAVAILABLE','MULTIPLE_ACTIVE_CUSTOMERS',
            'PRIVATE_STORAGE_UNAVAILABLE','PRIVATE_STORAGE_MISSING',
            'SHARED_COLLECTOR_ACTIVE',
            'CONTAINER_START_FAILED','BACKEND_NOT_READY',
            'HOST_IDENTITY','PRIVATE_FILES','OWNER_FEED','BACKEND_CONTAINER',
            'OWNER_ISOLATION','OWNER_PRIVATE_STORAGE','HOST_STAGING','RUNTIME_UPDATE',
            'BACKEND_RECREATE','BACKEND_HEALTH'}
          found=re.search(r'(?m)^INTRADAY_ACTIVATION_BLOCKED: ([A-Z_]+)$',out)
          reason=found.group(1) if found and found.group(1) in allowed else 'UNKNOWN'
          if reason=='UNKNOWN':
            # No raw stdout/stderr or command bodies may leave SSM.
            code=d.get('ResponseCode')
            code=str(code) if type(code) is int and -1 <= code <= 255 else 'NA'
            started='YES' if 'INTRADAY_ACTIVATION_STAGE: STARTED' in out else 'NO'
            stdout='YES' if out.strip() else 'NO'
            stderr='YES' if str(d.get('StandardErrorContent') or '').strip() else 'NO'
            markers=re.findall(r'INTRADAY_ACTIVATION_STAGE: ([A-Z_]+)',out)
            stages={'STARTED','HOST_IDENTITY','PRIVATE_FILES','OWNER_FEED',
                    'BACKEND_CONTAINER','OWNER_ISOLATION','HOST_STAGING',
                    'RUNTIME_UPDATE','BACKEND_RECREATE','BACKEND_HEALTH'}
            last=markers[-1] if markers and markers[-1] in stages else 'UNAVAILABLE'
            reason=f'UNKNOWN_RC{code}_LAST{last}_START{started}_OUT{stdout}_ERR{stderr}'
          complete=(state=='Success' and
                    'INTRADAY_ACTIVATION: ENABLED' in out and
                    'INTRADAY_BACKEND_HEALTH: PASS' in out and
                    'INTRADAY_ORDER_RIGHTS_CHANGED: FALSE' in out)
          if complete: print('ENABLED_AND_HEALTHY')
          elif state in ('Success','Failed','TimedOut','Cancelled'): print('BLOCKED_'+reason)
          else: print('PENDING')
          PY
          )"
            if [[ "$status" == ENABLED_AND_HEALTHY ]]; then
              echo 'PASS: private owner 5m/1H background collector activated and backend healthy'
              exit 0
            fi
            if [[ "$status" == BLOCKED_* ]]; then
              echo "BLOCKED: $status" >&2
              exit 2
            fi
            sleep 5
          done
          echo 'BLOCKED: private intraday activation not verified in bounded time' >&2
          exit 2
