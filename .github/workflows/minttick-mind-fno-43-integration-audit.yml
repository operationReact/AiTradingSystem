permissions:
  contents: read

concurrency:
  group: minttick-fno43-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fno-43-research-evaluator-evidence:
    name: Verify all 43 F&O evaluators and audited JUnit results (NO broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source/manifest audit contract tests (zero network)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_fno_strategy_e2e_audit.py' -v
      - name: Set up isolated Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Execute exactly the 43 manifest-attested strategy test classes
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          test_list=$(python3 ../scripts/fno_strategy_e2e_audit.py --list-tests)
          test "$(printf '%s\n' "$test_list" | tr ',' '\n' | wc -l)" -eq 43
          mvn --batch-mode --no-transfer-progress "-Dtest=$test_list" test
      - name: Validate read-only 43-strategy runtime readiness coverage and role contract
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=Fno43StrategyReadinessServiceTest' test
      - name: Validate STR-173 source adapter and rights-attested snapshot SQL
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoFuturesResearchServiceTest,FnoClosingSnapshotStoreTest' test
