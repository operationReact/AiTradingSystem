          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('artifacts/fno43-evaluator-validation.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## F&O 43-strategy research integration evidence\n\n')
              if not path.is_file():
                  f.write('FAILED: audit report absent; no source or execution readiness may be inferred.\n')
              else:
                  a=json.loads(path.read_text())
                  s=a['summary']
                  f.write(f"Manifest coverage: **{s['implemented']}/43**; executed JUnit files: "
                          f"**{s['junitEvidenceComplete']}/43**; JUnit cases: **{s['executedJunitCases']}**.\n\n")
