      - 'backend/src/main/resources/db/migration/V105__fno_verified_expiry_basis_pair_evidence.sql'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedExpiryBasisPairStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedExpiryBasisPairStoreTest.java'
