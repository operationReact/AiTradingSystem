      - 'backend/src/main/resources/db/migration/V101__fno_cash_futures_feasibility_evidence.sql'
      - 'backend/src/main/resources/db/migration/V102__fno_verified_completed_ohlcv_oi_session.sql'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStoreTest.java'
      - 'backend/src/main/resources/db/migration/V103__fno_index_hedge_research_evidence.sql'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoIndexHedgeResearchStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoIndexHedgeResearchStoreTest.java'
      - 'backend/src/main/resources/db/migration/V104__fno_verified_intraday_liquidity_evidence.sql'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedIntradayLiquidityStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedIntradayLiquidityStoreTest.java'
      - 'backend/src/main/resources/db/migration/V105__fno_verified_expiry_basis_pair_evidence.sql'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedExpiryBasisPairStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedExpiryBasisPairStoreTest.java'
      - 'docs/strategies/FNO-43-runtime-readiness-observability.md'
      - 'backend/src/main/resources/mind/capability-manifest.v1.json'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno*V1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno*V1Test.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minttick-fno43-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fno-43-research-evaluator-evidence:
    name: Verify all 43 F&O evaluators and audited JUnit results (NO broker)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source/manifest audit contract tests (zero network)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_fno_strategy_e2e_audit.py' -v
      - name: Set up isolated Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Execute exactly the 43 manifest-attested strategy test classes
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          test_list=$(python3 ../scripts/fno_strategy_e2e_audit.py --list-tests)
          test "$(printf '%s\n' "$test_list" | tr ',' '\n' | wc -l)" -eq 43
          mvn --batch-mode --no-transfer-progress "-Dtest=$test_list" test
      - name: Validate read-only 43-strategy runtime readiness coverage and role contract
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=Fno43StrategyReadinessServiceTest' test
      - name: Validate STR-173 source adapter and rights-attested snapshot SQL
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoFuturesResearchServiceTest,FnoClosingSnapshotStoreTest' test
      - name: Validate STR-174 verified final-price/OI source and strict as-of SQL
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoVerifiedFinalPriceOiSessionStoreTest' test
      - name: Validate STR-175 broker account depth, capital and cost evidence without orders
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoCashFuturesFeasibilityStoreTest' test
      - name: Validate STR-176 completed futures OHLCV and finalized OI source receipts
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoVerifiedCompletedOhlcvOiStoreTest' test
      - name: Validate STR-178 private beta, margin, risk and independently entitled futures depth
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoIndexHedgeResearchStoreTest' test
      - name: Validate STR-179 original-time quote OI volume source evidence and three independent rights
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoVerifiedIntradayLiquidityStoreTest' test
      - name: Validate STR-180 dual exchange close calendars and three independent source/carry rights
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress '-Dtest=FnoVerifiedExpiryBasisPairStoreTest' test
      - name: Produce machine-verifiable report; never promote fixtures to real-data readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fno_strategy_e2e_audit.py \
            --surefire-dir backend/target/surefire-reports \
            --require-surefire \
            --report artifacts/fno43-evaluator-validation.json
      - name: Summary with explicit real-data and trade-access blockers
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('artifacts/fno43-evaluator-validation.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## F&O 43-strategy research integration evidence\n\n')
              if not path.is_file():
                  f.write('FAILED: audit report absent; no source or execution readiness may be inferred.\n')
              else:
                  a=json.loads(path.read_text())
                  s=a['summary']
                  f.write(f"Manifest coverage: **{s['implemented']}/43**; executed JUnit files: "
                          f"**{s['junitEvidenceComplete']}/43**; JUnit cases: **{s['executedJunitCases']}**.\n\n")
                  f.write(f"Real-source E2E: **{s['realDataE2EValidated']}/43**. ")
                  f.write(f"PAPER: **{s['paperTradingValidated']}/43**; ")
                  f.write(f"LIVE: **{s['liveTradingValidated']}/43**.\n\n")
                  f.write('This check has NO exchange/broker data and must never authorize orders.\n')
          PY
      - name: Publish falsifiable per-strategy evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minttick-fno43-research-evidence
          path: |
            artifacts/fno43-evaluator-validation.json
            backend/target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.Fno*V1Test.xml
          if-no-files-found: warn
          retention-days: 14

# This validates deterministic evaluator research and test evidence.
# Real NSE provider rights, original-time replay, broker-book reconciliation,
# PAPER and LIVE integration remain separate auditable stages.
