name: Mind controlled PAPER verification cycle

# One controlled PAPER-only Mind cycle per reviewed one-file request commit on dev. It never runs
# on pull requests and never on a schedule, so it cannot repeat on its own. Secrets exist only in
# this trusted dev run. No LIVE broker, IAM, F&O permission or trading-mode change is made.
on:
  push:
    branches: [dev]
    paths:
      - 'infra/minttick-domain/requests/mind-paper-verification-cycle.json'

permissions:
  contents: read

concurrency:
  group: mind-paper-verification-cycle-dev
  cancel-in-progress: false

jobs:
  paper-cycle:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: https://api.minttick.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require exact one-file, owner-approved request
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/minttick-domain/requests/mind-paper-verification-cycle.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("infra/minttick-domain/requests/mind-paper-verification-cycle.json").read_text())
          expected = {
            "application": "MintTick",
            "environment": "dev",
            "operation": "run-one-controlled-paper-mind-cycle",
            "account_scope": "dedicated-verification-customer",
            "instrument_symbol": "RELIANCE-EQ",
            "exchange": "NSE",
            "interval": "FIVE_MINUTE",
            "idempotency_key": "mind-verify-paper-cycle-2026-11-17-02",
            "max_new_orders": 1,
            "authorization": "USER_APPROVED_PAPER_MIND_VERIFICATION_CYCLE_2026-11-17",
          }
          assert actual == expected, "Unexpected verification request"
          print("PASS: exact owner-approved PAPER verification request")
          PY

      - name: Mint per-run verification token (never printed)
        env:
          VERIFY_USERNAME: ${{ secrets.MINDTICK_VERIFY_USERNAME }}
          VERIFY_PASSWORD: ${{ secrets.MINDTICK_VERIFY_PASSWORD }}
          VERIFY_NEW_PASSWORD: ${{ secrets.MINDTICK_VERIFY_NEW_PASSWORD }}
          VERIFY_CLIENT_ID: ${{ vars.MINDTICK_VERIFY_COGNITO_CLIENT_ID }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$VERIFY_USERNAME" ] || [ -z "$VERIFY_PASSWORD" ] || [ -z "$VERIFY_CLIENT_ID" ]; then
            echo "AUTHENTICATED_RUNTIME_NOT_VERIFIED: verification secrets are not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$VERIFY_PASSWORD" > "$RUNNER_TEMP/verify_password"
          printf '%s' "$VERIFY_NEW_PASSWORD" > "$RUNNER_TEMP/verify_new_password"
          python3 scripts/mind/mint_verify_token.py "$VERIFY_CLIENT_ID" "$VERIFY_USERNAME" \
            "$RUNNER_TEMP/verify_password" "$RUNNER_TEMP/verify_new_password" "$RUNNER_TEMP/paper_cycle_token"
          rm -f "$RUNNER_TEMP/verify_password" "$RUNNER_TEMP/verify_new_password"
          test -s "$RUNNER_TEMP/paper_cycle_token" || { echo "FAIL: no token minted"; exit 1; }
          echo "PASS: per-run access token minted"

      - name: Provision verification customer (idempotent)
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/paper_cycle_token")"
          echo "::add-mask::$token"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
            -H "Authorization: Bearer $token" "$BASE/api/auth/cognito/provision")"
          if [ "$code" = 200 ] || [ "$code" = 201 ]; then echo "PASS provision -> $code"; else echo "FAIL provision -> $code"; exit 1; fi

      - name: Run one controlled PAPER cycle with isolation, budget and idempotency gates
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/mind/paper_verification_cycle.py "$BASE" "$RUNNER_TEMP/paper_cycle_token" \
            infra/minttick-domain/requests/mind-paper-verification-cycle.json "$RUNNER_TEMP/paper_cycle_summary.json"
          rm -f "$RUNNER_TEMP/paper_cycle_token"
          echo "### Controlled PAPER verification cycle" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/paper_cycle_summary.json'));print('- outcome:',d['outcome']);print('- new orders:',d['newOrders']);print('- stages:',', '.join(d['stages']))" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the redacted cycle summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mind-paper-verification-cycle-${{ github.sha }}
          path: ${{ runner.temp }}/paper_cycle_summary.json
          if-no-files-found: ignore
          retention-days: 30
