name: Phase 8 - Completion gate
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/phase8-completion-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Prove isolated PostgreSQL PAPER operator journey and Phase 8 regressions
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Dtest=Phase8ExitGateIT,Phase8ApiContractIT,AnalyticsServicesIT,PerformanceAggregationServiceIT,PerformanceDrawdownTest,AuditQueryServiceIT,AuditCsvTest,OperationalHealthServiceTest,OperationalEvidenceIT,NotificationServiceIT,BacktestFailureNotificationTest test
      - name: Upload exit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p08-completion-evidence
          path: backend/target/surefire-reports
          retention-days: 14
