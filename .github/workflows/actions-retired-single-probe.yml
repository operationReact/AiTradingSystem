name: Actions maintenance - remove one proven retired diagnosis history

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/actions-retired-single-probe.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup-one:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Confirm exact obsolete, absent-from-both-branches workflow and one completed run
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            if(owner !== 'operationReact' || repo !== 'AiTradingSystem')
              throw Error('Wrong repository; no action');
            const target='.github/workflows/paper-ec2-dnf-package-diagnosis-once.yml';
            for (const ref of ['main','dev']) {
              try {
                await github.rest.repos.getContent({owner,repo,path:target,ref});
                throw Error('Ref '+ref+' STILL CONTAINS '+target+' — refuse deletion');
              } catch (e) {
                if(e.status!==404) throw e;
              }
            }
            const workflows=await github.paginate(github.rest.actions.listRepoWorkflows,
              {owner,repo,per_page:100});
            const matching=workflows.filter(w=>w.path===target);
            if(matching.length!==1) throw Error('Workflow registry not exactly one retired target');
            const w=matching[0];
            if(!['active','deleted','disabled_manually'].includes(w.state))
              throw Error('Unexpected workflow registry state: '+w.state);
            const runs=await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner,repo,workflow_id:w.id,per_page:100});
            if(runs.length!==1 || runs[0].status!=='completed' ||
               runs[0].path!==target)
              throw Error('Expected exactly one completed run from retired diagnosis; no deletion');
            const record={workflow_id:w.id,path:target,workflow_name:w.name,
              registry_state:w.state,run_id:runs[0].id,run_url:runs[0].html_url,
              run_sha:runs[0].head_sha,run_status:runs[0].status,
              run_conclusion:runs[0].conclusion};
            core.info('READONLY preflight passed: '+JSON.stringify(record));
            core.exportVariable('RETIRED_WORKFLOW_ID',String(w.id));
            core.exportVariable('RETIRED_RUN_ID',String(runs[0].id));

      - name: Disable only exact retired one-shot diagnosis workflow
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const wId=Number(process.env.RETIRED_WORKFLOW_ID);
            if(!Number.isInteger(wId) || wId<=0) throw Error('No validated workflow ID');
            const w=(await github.rest.actions.getWorkflow({owner,repo,workflow_id:wId})).data;
            if(w.path!=='.github/workflows/paper-ec2-dnf-package-diagnosis-once.yml')
              throw Error('Registry drifted; no change');
            if(w.state==='active') {
              await github.rest.actions.disableWorkflow({owner,repo,workflow_id:wId});
              core.info('Disabled exact obsolete one-shot diagnosis workflow');
            } else if(!['deleted','disabled_manually'].includes(w.state)) {
              throw Error('Cannot safely disable unexpected state '+w.state);
            }

      - name: Delete only its one historical completed run
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const wId=Number(process.env.RETIRED_WORKFLOW_ID),
                  runId=Number(process.env.RETIRED_RUN_ID);
            if(!Number.isSafeInteger(wId)||!Number.isSafeInteger(runId)||runId<=0)
              throw Error('Invalid exact reviewed run ID');
            const w=(await github.rest.actions.getWorkflow({owner,repo,workflow_id:wId})).data;
            if(w.path!=='.github/workflows/paper-ec2-dnf-package-diagnosis-once.yml'
               || w.state==='active')
              throw Error('Refuse to delete run on an active or wrong workflow');
            const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:runId})).data;
            if(run.workflow_id!==wId || run.status!=='completed' ||
               run.path!==w.path)
              throw Error('Run ID drifted; no deletion');
            await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:runId});
            const remaining=await github.paginate(github.rest.actions.listWorkflowRuns,
              {owner,repo,workflow_id:wId,per_page:100});
            if(remaining.length) throw Error('Target still has '+remaining.length+' runs');
            core.info('PASS: Single obsolete workflow disabled; its only historical run deleted');
            core.info('No active PAPER controls or deployment/CI runs were modified');
# This is a one-time GitHub history operation, no AWS/EC2 calls, no code deletion.
