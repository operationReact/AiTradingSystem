name: Flutter delivery policy (not platform acceptance)
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed policy
        run: python scripts/test_flutter_delivery.py
      - name: Test PWA cache and offline safety policy
        run: python scripts/test_pwa_cache_policy.py
      - name: Test Android physical-device acceptance harness
        run: python scripts/test_android_device_acceptance.py
      - name: Enforce target and changed-code boundaries
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            python scripts/check_flutter_delivery.py --base-sha "$PR_BASE_SHA"
          else
            python scripts/check_flutter_delivery.py
          fi
