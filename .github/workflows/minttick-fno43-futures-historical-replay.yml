name: MintTick F&O - all 43 typed structural historical replay coverage

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno43-futures-historical-replay.yml'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/FnoFuturesHistoricalReplayBridgeV1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/FnoFuturesHistoricalReplayBridgeV1Test.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno176VerifiedHistoricalReplayService.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno176VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno43HistoricalReplayDispatchV1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno43HistoricalReplayDispatchV1Test.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno179VerifiedHistoricalReplayService.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno180VerifiedHistoricalReplayService.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno179VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno180VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayController.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayControllerTest.java'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStoreTest.java'
      - 'docs/architecture/fno-43-historical-e2e-evidence.md'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno43-futures-historical-replay.yml'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/FnoFuturesHistoricalReplayBridgeV1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/FnoFuturesHistoricalReplayBridgeV1Test.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno176VerifiedHistoricalReplayService.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno176VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno43HistoricalReplayDispatchV1.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno43HistoricalReplayDispatchV1Test.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno179VerifiedHistoricalReplayService.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno180VerifiedHistoricalReplayService.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno179VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno180VerifiedHistoricalReplayServiceTest.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayController.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayControllerTest.java'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStoreTest.java'

permissions:
  contents: read

jobs:
  structural-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Execute actual STR-173 and STR-176 evaluator replay fixture with fail-closed rights/as-of
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            '-Dtest=Fno43HistoricalReplayDispatchV1Test,FnoFuturesHistoricalReplayBridgeV1Test,Fno176VerifiedHistoricalReplayServiceTest,Fno179VerifiedHistoricalReplayServiceTest,Fno180VerifiedHistoricalReplayServiceTest,AdminFno43HistoricalReplayControllerTest,FnoContractLiquidityGateV1Test,FnoExpiryBasisReversionV1Test,FnoVerifiedCompletedOhlcvOiStoreTest,FnoFuturesOpenInterestTrendV1Test,FnoFuturesMomentumV1Test' test
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.FnoFuturesHistoricalReplayBridgeV1Test.xml
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.Fno176VerifiedHistoricalReplayServiceTest.xml
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.Fno43HistoricalReplayDispatchV1Test.xml
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.Fno179VerifiedHistoricalReplayServiceTest.xml
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.Fno180VerifiedHistoricalReplayServiceTest.xml
      - name: Assert structural proof cannot authorize trades or claim market E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/main/java/in/aitradingsystem/tradingrooms/FnoFuturesHistoricalReplayBridgeV1.java')
          x=p.read_text()
          for needed in ("FnoFuturesOpenInterestTrendV1.evaluate(",
                         "FnoFuturesMomentumV1.evaluate(",
                         "AFTER_COST_OOS_AND_INDEPENDENT_SOURCE_PROOF_MISSING",
                         "sourceFirstKnownAt()", "oiFirstKnownAt()",
                         "EVALUATOR_REPLAY_RESEARCH_ONLY_NOT_E2E"):
              assert needed in x,needed
          for forbidden in ("placeOrder", "submitOrder", "aws ssm",
                            "MINTTICK_UPSTOX_FNO_LIVE_ORDER_ENABLED"):
              assert forbidden not in x,forbidden
          PY
      - name: Verify all 43 actual strategy entrypoints match manifest class paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path('backend/src/main/resources/mind/capability-manifest.v1.json').read_text())
          items=[x for x in manifest['items']
                 if re.fullmatch(r'strategy\.STR-\d{3}',x.get('id',''))
                 and 170<=int(x['id'].split('-')[-1])<=212]
          source=Path('backend/src/main/java/in/aitradingsystem/tradingrooms/Fno43HistoricalReplayDispatchV1.java').read_text()
          assert len(items)==43
          assert len(re.findall(r'case "strategy\.STR-\d{3}" ->',source))==43
          assert len(re.findall(r'\.evaluate\(',source))==43
          for item in items:
              cls=Path(next(e['path'] for e in item['evidence'] if e['kind']=='SOURCE')).stem
              assert 'case "'+item['id']+'" ->' in source,item['id']
              assert cls+'.evaluate(' in source,item['id']
              assert len(item['requiredInputs'])>=3
          assert 'INDEPENDENT_ORIGINAL_SOURCE_AND_AFTER_COST_OOS_NOT_PROVEN' in source
          PY
      - name: Report truthful fixture-only result
        if: always()
        shell: bash
        run: |
          echo '43/43 typed research evaluator paths; original V104 STR-179 and V105 STR-180 source adapters tested with FICTIONAL rows only.'
          echo 'Independently verified historical E2E: still 0/43.'
          echo 'No broker access, licensed original source fetch, PAPER ledger or LIVE orders.'
