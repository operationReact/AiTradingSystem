name: Upstox official SDK sandbox DNS-only check

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/upstox-sdk-sandbox-host-dns-once.yml']

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify one-time creation and resolve exact sandbox names
        run: |
          set -euo pipefail
          p=.github/workflows/upstox-sdk-sandbox-host-dns-once.yml
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$p")"
          python3 - <<'PY'
          import socket
          import ssl
          for host in ('sandbox.upstox.com', 'api-sandbox.upstox.com', 'api.upstox.com'):
              label = 'LEGACY' if host == 'sandbox.upstox.com' else ('SDK' if host == 'api-sandbox.upstox.com' else 'LIVE_CONTROL')
              try:
                  socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  print('DNS_' + label + ':OK')
              except OSError as exc:
                  print('DNS_' + label + ':' + type(exc).__name__)
                  continue
              try:
                  with socket.create_connection((host, 443), timeout=6) as sock:
                      with ssl.create_default_context().wrap_socket(sock, server_hostname=host) as secure:
                          print('TLS_' + label + ':OK')
              except (OSError, ssl.SSLError, TimeoutError) as exc:
                  print('TLS_' + label + ':' + type(exc).__name__)
          print('BROKER_REQUESTS:ZERO')
          PY
