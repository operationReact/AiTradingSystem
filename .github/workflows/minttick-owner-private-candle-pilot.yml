name: MintTick - owner personal private daily candle pilot

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-owner-private-candle-pilot.yml'
      - 'infra/ec2-paper/run_owner_personal_history.sh'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/owner-personal-history-download.json'

permissions:
  contents: read

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          bash -n infra/ec2-paper/run_owner_personal_history.sh
          python3 -m unittest discover -s scripts/tests -p test_owner_personal_angelone_history.py -v

  execute:
    name: One fixed-path private owner historical pilot on existing PAPER EC2
    needs: verify
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-09c01b470fb39b85a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact owner approval and only one changed file
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = \
            'infra/ec2-paper/requests/owner-personal-history-download.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('infra/ec2-paper/requests/owner-personal-history-download.json').read_text())
          assert d=={
            'application':'MintTick',
            'operation':'owner-personal-angelone-daily-history-pilot',
            'account':'098859530205',
            'region':'ap-south-1',
            'instance_id':'i-09c01b470fb39b85a',
            'from_date':'2006-11-10',
            'through_date':'2026-11-10',
            'max_equities':5,
            'max_provider_calls':20,
            'min_spacing_seconds':10,
            'private_ec2_only':True,
            'no_redistribution':True,
            'enable_trading':False,
          }
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-owner-personal
      - name: Validate fixed AWS account, EC2 host and running SSM target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'infra/ec2-paper')
          import verify_ssm_release
          verify_ssm_release.verify_aws()
          PY
      - name: Enforce encryption of existing EBS volumes before data retention
        run: |
          set -euo pipefail
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].BlockDeviceMappings[].Ebs.VolumeId' \
            --output text | tr '\t' '\n' > "$RUNNER_TEMP/personal-ebs.txt"
          test -s "$RUNNER_TEMP/personal-ebs.txt"
          n=0
          while read -r volume; do
            [[ "$volume" =~ ^vol-[0-9a-f]{8,17}$ ]]
            result="$(aws ec2 describe-volumes --volume-ids "$volume" \
              --query 'Volumes[0].Encrypted' --output text)"
            test "$result" = "True" || {
              echo 'Owner pilot blocked: EBS encryption is not verified'
              exit 2
            }
            n=$((n + 1))
            test "$n" -le 10
          done < "$RUNNER_TEMP/personal-ebs.txt"
          test "$n" -gt 0
          rm "$RUNNER_TEMP/personal-ebs.txt"
          echo 'Existing EBS storage encryption verified'
      - name: Invoke only installed SHA-reviewed, fixed-path owner collector
        run: |
          set -euo pipefail
          id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" --timeout-seconds 720 \
            --parameters '{"commands":["/opt/aitradingsystem-paper/run_owner_personal_history.sh"]}' \
            --comment 'MintTick personal trading only; five NSE equities maximum; no redistribution' \
            --query Command.CommandId --output text)"
          for attempt in $(seq 1 165); do
            aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --output json > "$RUNNER_TEMP/personal-history-status.json" 2>/dev/null || true
            status="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
              z=json.loads((Path(os.environ['RUNNER_TEMP'])/'personal-history-status.json').read_text())
          except (ValueError,OSError):
              print('PENDING');raise SystemExit
          if z.get('Status') not in ('Success','Failed','TimedOut','Cancelled'):
              print('PENDING');raise SystemExit
          output=z.get('StandardOutputContent','') or ''
          for line in output.splitlines():
              if len(line)>120: continue
              if re.fullmatch(r'PERSONAL_(?:STOCKS_SELECTED|PAGES_ALREADY_VERIFIED|PAGES_REMAINING|PAGES_STORED_TOTAL|ROWS_STORED_TOTAL|PAGES_DOWNLOADED_THIS_RUN|ROWS_DOWNLOADED_THIS_RUN): [0-9]{1,8}',line):
                  print(line)
              if re.fullmatch(r'PERSONAL_PAGE_[0-9]{1,2}: (?:RELIANCE-EQ|TCS-EQ|INFY-EQ|HDFCBANK-EQ|ICICIBANK-EQ) [0-9]{1,4} VALIDATED_ROWS',line):
                  print(line)
              if re.fullmatch(r'PERSONAL_DOWNLOAD_BLOCKED: [A-Z0-9_: ]{3,80}',line):
                  print(line)
          if z['Status']=='Success' and 'PERSONAL_GOLDEN_SOURCE_PUBLISHED: FALSE' in output:
              print('SUCCESS')
          else:
              print('FAILED')
          PY
          )"
            if [[ "$status" == *$'\nSUCCESS' ]]; then
              printf '%s\n' "$status"
              rm -f "$RUNNER_TEMP/personal-history-status.json"
              exit 0
            fi
            if [[ "$status" == *$'\nFAILED' ]]; then
              printf '%s\n' "$status"
              rm -f "$RUNNER_TEMP/personal-history-status.json"
              exit 2
            fi
            sleep 5
          done
          echo 'Owner pilot timed out; resumable private archive remains on host'
          rm -f "$RUNNER_TEMP/personal-history-status.json"
          exit 2
