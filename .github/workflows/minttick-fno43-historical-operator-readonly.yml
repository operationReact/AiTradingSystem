name: MintTick F&O - protected original-source historical evaluator GET

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno43-historical-operator-readonly.yml'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayController.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno176HistoricalEligibilityController.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/AdminFno176HistoricalEligibilityControllerTest.java'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStoreTest.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayControllerTest.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno183184VerifiedHistoricalReplayService.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno183184VerifiedHistoricalReplayServiceTest.java'
      - 'docs/architecture/fno-43-historical-operator-probe.md'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno43-historical-operator-readonly.yml'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayController.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno176HistoricalEligibilityController.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/AdminFno176HistoricalEligibilityControllerTest.java'
      - 'backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java'
      - 'backend/src/test/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStoreTest.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayControllerTest.java'
      - 'backend/src/main/java/in/aitradingsystem/tradingrooms/Fno183184VerifiedHistoricalReplayService.java'
      - 'backend/src/test/java/in/aitradingsystem/tradingrooms/Fno183184VerifiedHistoricalReplayServiceTest.java'
permissions:
  contents: read
jobs:
  verify-operator-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Validate private original V100/V102 read-only replay controls
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            '-Dtest=AdminFno43HistoricalReplayControllerTest,AdminFno176HistoricalEligibilityControllerTest,FnoVerifiedCompletedOhlcvOiStoreTest,Fno174VerifiedHistoricalReplayServiceTest,Fno176VerifiedHistoricalReplayServiceTest,Fno177VerifiedHistoricalReplayServiceTest,Fno181182VerifiedHistoricalReplayServiceTest,Fno183184VerifiedHistoricalReplayServiceTest' test
          test -s target/surefire-reports/TEST-in.aitradingsystem.tradingrooms.AdminFno43HistoricalReplayControllerTest.xml
      - name: Enforce GET with role only and no market-data or broker route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno43HistoricalReplayController.java')
          src=p.read_text()
          for mandatory in ('@PreAuthorize("hasAnyRole(', '@GetMapping("/historical-replay")',
                            '@GetMapping("/historical-debit-spread")',
                            'CacheControl.noStore()', 'Fno174VerifiedHistoricalReplayService',
                            'Fno176VerifiedHistoricalReplayService',
                            'Fno177VerifiedHistoricalReplayService',
                            'Fno181182VerifiedHistoricalReplayService',
                            'Fno183184VerifiedHistoricalReplayService'):
              assert mandatory in src,mandatory
          for forbidden in ('@PostMapping','submitOrder','placeOrder',
                            'return ResponseEntity.status(HttpStatus.ACCEPTED)',
                            'MINTTICK_UPSTOX_FNO_LIVE_ORDER_ENABLED'):
              assert forbidden not in src,forbidden
          # Both original one-contract and two-contract routes must keep
          # their four separate historical/PAPER/LIVE/order outcomes false.
          assert src.count('false,false,false,false') == 2
          assert src.count('ResponseEntity.ok().cacheControl(CacheControl.noStore())') == 2
          assert src.count('@PreAuthorize("hasAnyRole(\'ADMIN\', \'OPERATOR\')")') == 2
          PY
      - name: Ensure STR-176 original-source inventory never implies certification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ctl=Path('backend/src/main/java/in/aitradingsystem/tradingrooms/AdminFno176HistoricalEligibilityController.java').read_text()
          store=Path('backend/src/main/java/in/aitradingsystem/marketdata/FnoVerifiedCompletedOhlcvOiStore.java').read_text()
          for needed in ('@GetMapping("/str176-original-source")',
                         '@PreAuthorize("hasAnyRole(', 'CacheControl.noStore()',
                         'POTENTIAL_SOURCE_INPUT_ONLY_NOT_E2E',
                         'false,false'):
              assert needed in ctl,needed
          for needed in ("ohlcv_rights.receipt_status = 'VERIFIED'",
                         "oi_rights.receipt_status = 'VERIFIED'",
                         'cal.session_status = \'TRADING\'',
                         's.ohlcv_first_available_at <= ?',
                         's.oi_first_available_at <= ?',
                         'HAVING COUNT(DISTINCT session_date) >= 7'):
              assert needed in store,needed
          for forbidden in ('@PostMapping','submitOrder','placeOrder',
                            'get-parameter','MINTTICK_UPSTOX_FNO_LIVE_ORDER_ENABLED'):
              assert forbidden not in ctl,forbidden
          PY
      - name: Print honest read-only historical source evidence tier
        if: always()
        shell: bash
        run: |
          echo 'Protected admin GET invokes real source stores only when credentials and original research-use rights allow it.'
          echo 'Synthetic CI does not verify original host V100/V102 rows, OOS after-cost or broker orders.'
