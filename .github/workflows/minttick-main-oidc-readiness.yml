name: MintTick main production OIDC readiness
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/minttick-main-oidc-readiness.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/minttick-main-oidc-readiness.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate repository and branch context
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          test "$REPOSITORY" = operationReact/AiTradingSystem
          if [ "$EVENT" = pull_request ]; then
            test "$BASE_REF" = main
          else
            test "$REF" = refs/heads/main
          fi
  inspect:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify existing SSM role trusts the main branch
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          role-session-name: minttick-main-readiness-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ap-south-1
          retry-max-attempts: 2
      - name: Verify production account and exact running managed host
        run: |
          python3 - <<'PY'
          import json, subprocess
          def aws(*args):
              result = subprocess.run(["aws", *args, "--region", "ap-south-1", "--output", "json", "--no-cli-pager"], capture_output=True, text=True, timeout=30)
              if result.returncode:
                  raise SystemExit("MAIN_OIDC_READINESS_AWS_READ_FAILED")
              return json.loads(result.stdout)
          actor = aws("sts", "get-caller-identity")
          assert actor["Account"] == "098859530205"
          assert actor["Arn"].startswith("arn:aws:sts::098859530205:assumed-role/aitrading-paper-ec2-ssm-deploy/")
          nodes = aws("ssm", "describe-instance-information", "--filters", "Key=InstanceIds,Values=i-09c01b470fb39b85a")["InstanceInformationList"]
          assert len(nodes) == 1 and nodes[0]["InstanceId"] == "i-09c01b470fb39b85a"
          assert nodes[0]["PingStatus"] == "Online"
          print('{"mainOidcVerified":true,"exactHostSsmOnline":true,"hostMutationAttempted":false}')
          PY
      - name: Read sanitized news runtime flags from the exact backend container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, time
          region='ap-south-1'
          instance='i-09c01b470fb39b85a'
          marker='MINTTICK_NEWS_RUNTIME_FLAGS:'
          failure_marker='MINTTICK_NEWS_DIAGNOSTIC_FAILED:'
          remote = r'''set -eu
          stage=container_lookup
          trap 'echo "MINTTICK_NEWS_DIAGNOSTIC_FAILED:$stage"' ERR
          ids="$(docker ps --filter label=com.docker.compose.project=aitradingsystem-paper --filter label=com.docker.compose.service=backend --format '{{.ID}}')"
          test -n "$ids" && test "$(echo "$ids" | wc -l)" -eq 1
          stage=container_inspect
          docker inspect --format '{{json .Config.Env}}' "$ids" | python3 -c 'import json,sys; rows=json.load(sys.stdin); e={}; [(e.__setitem__(x.split("=",1)[0],x.split("=",1)[1])) for x in rows if "=" in x]; keys=("NEWS_INGESTION_ENABLED","NEWS_ANALYSIS_PROVIDER","NEWS_ANALYSIS_SCHEDULER_ENABLED","NEWS_ANALYZER_BRIDGE_ENABLED","NEWS_ANALYZER_APPROVED_SOURCES","GEMINI_MODEL"); out={"flags":{k:e.get(k,"<unset>") for k in keys},"geminiApiKeyPresent":bool(e.get("GEMINI_API_KEY",""))}; print("MINTTICK_NEWS_RUNTIME_FLAGS:"+json.dumps(out,sort_keys=True))'
          stage=complete
          '''
          def aws(*args):
              p=subprocess.run(['aws',*args,'--region',region,'--output','json','--no-cli-pager'],capture_output=True,text=True,timeout=35)
              if p.returncode: raise SystemExit('NEWS_RUNTIME_AWS_READ_FAILED')
              return json.loads(p.stdout)
          sent=aws('ssm','send-command','--document-name','AWS-RunShellScript','--instance-ids',instance,'--timeout-seconds','45','--comment','MintTick sanitized read-only news runtime configuration','--parameters',json.dumps({'commands':[remote]}))
          command_id=sent.get('Command',{}).get('CommandId','')
          if not re.fullmatch(r'[0-9a-f-]{36}',command_id): raise SystemExit('NEWS_RUNTIME_SSM_COMMAND_INVALID')
          for _ in range(30):
              time.sleep(2)
              result=aws('ssm','get-command-invocation','--command-id',command_id,'--instance-id',instance)
              state=result.get('Status')
              if state=='Success':
                  lines=(result.get('StandardOutputContent') or '').splitlines()
                  matches=[x[len(marker):] for x in lines if x.startswith(marker)]
                  if len(matches)!=1: raise SystemExit('NEWS_RUNTIME_RECEIPT_INVALID')
                  receipt=json.loads(matches[0])
                  if set(receipt)!={'flags','geminiApiKeyPresent'} or set(receipt['flags'])!={'NEWS_INGESTION_ENABLED','NEWS_ANALYSIS_PROVIDER','NEWS_ANALYSIS_SCHEDULER_ENABLED','NEWS_ANALYZER_BRIDGE_ENABLED','NEWS_ANALYZER_APPROVED_SOURCES','GEMINI_MODEL'}:
                      raise SystemExit('NEWS_RUNTIME_RECEIPT_INVALID')
                  print(json.dumps({'instanceId':instance,'configurationMutationAttempted':False,**receipt},sort_keys=True))
                  break
              if state not in {'Pending','InProgress','Delayed'}:
                  details=result.get('StatusDetails','')
                  safe_details=details if details in {'Failed','Delivery Timed Out','Execution Timed Out','Undeliverable','Terminated','Cancelled'} else 'Other'
                  output=(result.get('StandardOutputContent') or '').splitlines()
                  failed=[x[len(failure_marker):] for x in output if x.startswith(failure_marker)]
                  safe_stage=failed[-1] if failed and failed[-1] in {'container_lookup','container_inspect','complete'} else 'no_stage_receipt'
                  raise SystemExit('NEWS_RUNTIME_SSM_READ_FAILED:'+str(state)+':'+safe_details+':'+safe_stage)
          else: raise SystemExit('NEWS_RUNTIME_SSM_READ_TIMEOUT')
          PY
