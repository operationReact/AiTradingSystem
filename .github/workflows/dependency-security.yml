name: Dependency security review

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/pom.xml'
      - 'backend/src/**'
      - '.github/workflows/dependency-security.yml'
      - 'apps/trading_client/pubspec.yaml'
      - 'apps/trading_client/pubspec.lock'
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package backend dependency graph
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -DskipTests package 2>&1 | tee backend-build.log

      - name: Upload backend package failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-backend-build-log
          path: backend/backend-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Scan repository and packaged dependencies for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
