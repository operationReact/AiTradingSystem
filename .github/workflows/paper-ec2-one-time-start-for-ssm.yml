name: PAPER EC2 - one-time approved start for SSM deployment session

# One-time start when merged to main; future operator control remains separate.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-ec2-one-time-start-for-ssm.yml'

permissions:
  contents: read
  id-token: write

# Same serialization as the normal manual lifecycle and dev SSM deployment.
concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  start:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assume exact-one-instance main-only PAPER control role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-manual-control
          role-session-name: paper-ssm-session-start-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ap-south-1

      - name: Start existing PAPER host only; require nightly shutdown
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/ec2-paper/control_paper_host.py start

# No new infrastructure, no IAM changes, no public ingress, no LIVE trades.
# Nightly scheduled stop 22:00 Asia/Kolkata remains enabled.
