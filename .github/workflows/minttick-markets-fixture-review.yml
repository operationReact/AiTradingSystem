name: MintTick Markets UI screenshot fixtures (NOT LIVE)

on:
  push:
    branches:
      - feature/minttick-real-widget-markets-visual-review-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-real-market-widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/trading_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build isolated market review target (not production main.dart)
        run: flutter build web --release --no-wasm-dry-run -t tool/markets_review_main.dart
      - name: Capture actual Flutter Markets widgets using browser
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.github/scripts"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          cd "$GITHUB_WORKSPACE/apps/trading_client"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node "$GITHUB_WORKSPACE/.github/scripts/minttick_fixture_capture.cjs"
      - name: Upload read-only visual evidence (synthetic values)
        uses: actions/upload-artifact@v4
        with:
          name: minttick-actual-markets-widget-fixtures
          path: apps/trading_client/fixture-captures/*.png
          if-no-files-found: error
          retention-days: 7
