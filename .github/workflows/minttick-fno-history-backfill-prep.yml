name: MintTick F&O history backfill preparation - offline contract
on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/fno_history_backfill.py'
      - 'infra/ec2-paper/fno_history_progress_snapshot.py'
      - 'scripts/tests/test_fno_history_progress_snapshot.py'
      - 'infra/ec2-paper/upstox_fno_backfill_adapters.py'
      - 'scripts/tests/test_upstox_fno_backfill_adapters.py'
      - 'scripts/tests/test_fno_history_backfill.py'
      - 'infra/ec2-paper/FNO_HISTORY_BACKFILL_PREPARATION.md'
      - '.github/workflows/minttick-fno-history-backfill-prep.yml'

permissions:
  contents: read

jobs:
  offline-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test restart-safe checkpoint, rates, rights, no-data-storage progress
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile infra/ec2-paper/fno_history_backfill.py
          python3 -m unittest discover -s scripts/tests -p 'test_fno_history_backfill.py' -v
          python3 -m py_compile infra/ec2-paper/upstox_fno_backfill_adapters.py
          python3 -m unittest discover -s scripts/tests -p 'test_upstox_fno_backfill_adapters.py' -v
          python3 -m py_compile infra/ec2-paper/fno_history_progress_snapshot.py
          python3 -m unittest discover -s scripts/tests -p 'test_fno_history_progress_snapshot.py' -v
          python3 - <<'PY'
          from pathlib import Path
          p=Path('infra/ec2-paper/fno_history_backfill.py').read_text()
          assert 'FNO_DATA_RETENTION_NOT_AUTHORIZED' in p
          assert 'BEGIN IMMEDIATE' in p and 'lease_until' in p
          assert 'idempotency_key' in p and 'retry_after_seconds' in p
          assert 'PREPARATION_ONLY' in p
          publisher=Path('infra/ec2-paper/fno_history_progress_snapshot.py').read_text()
          assert 'CURRENT_JOURNAL_BATCHES_ONLY' in publisher
          assert 'os.replace' in publisher and 'os.fchmod' in publisher
          assert 'retentionRightsVerified' in publisher and 'storageActive' in publisher
          for forbidden_publisher in ('placeOrder','submitOrder','get-parameter','api.upstox.com','TRADING_MODE=LIVE','if __name__ =='):
              assert forbidden_publisher not in publisher, forbidden_publisher
          assert 'api.upstox.com' not in p
          adapter=Path('infra/ec2-paper/upstox_fno_backfill_adapters.py').read_text()
          assert 'FNO_DATA_RETENTION_NOT_AUTHORIZED' in adapter
          assert 'MintTick-Upstox-ReadOnly-History/1.0' in adapter
          assert 'PRIMARY KEY(source, contract_key, interval, candle_ts)' in adapter
          assert 'ON CONFLICT' in adapter
          for forbidden_adapter in ('put-parameter','placeOrder','submitOrder','TRADING_MODE=LIVE','crontab','if __name__ =='):
              assert forbidden_adapter not in adapter, forbidden_adapter
          for forbidden in ('get-parameter','put-parameter', 'placeOrder',
                            'submitOrder', 'TRADING_MODE=LIVE',
                            'Authorization: Bearer', 'print(token)',
                            'schedule.every(', 'crontab'):
              assert forbidden not in p, forbidden
          PY

# No AWS login, SSM, Upstox calls, backend deployment, broker orders,
# market-data persistence or scheduled work. Only offline unit tests.
