name: Mind live edge verification

# Read-only. Runs on pushes to dev (the default branch is main, so dispatch
# from the API is not available). It sends no trading calls and writes nothing.
#
# Security model verified in infra/minttick-domain/bootstrap-account-api.yml:
# `ANY /api/customer/{proxy+}` is protected by the Cognito JWT authorizer at API
# Gateway, so an anonymous request is refused (401) before the account proxy
# routes it. Unknown customer routes therefore also return 401 anonymously. That
# is deliberate, because it does not reveal which routes exist. A 404 for an
# unknown route is only observable with a valid customer token.
#
# Authenticated checks need MINDTICK_VERIFY_CUSTOMER_TOKEN. Without it they are
# reported as AUTHENTICATED_RUNTIME_NOT_VERIFIED, never as passed. The token is
# never printed.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE: https://api.minttick.com
    steps:
      - name: Public readiness is healthy
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/actuator/health/readiness")"
          test "$code" = 200 || { echo "FAIL readiness $code"; exit 1; }
          echo "PASS readiness 200"

      - name: Anonymous customer Mind routes are refused by the gateway (401)
        run: |
          set -euo pipefail
          fail=0
          check() {
            local method="$1" path="$2" body="${3:-}" code
            if [ -n "$body" ]; then
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X "$method" -H 'content-type: application/json' -d "$body" "$BASE$path")"
            else
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X "$method" "$BASE$path")"
            fi
            if [ "$code" = 401 ]; then echo "PASS $method $path -> 401"; else echo "FAIL $method $path -> $code"; fail=1; fi
          }
          # Known protected routes.
          check GET /api/customer/mind/v1/progress
          check GET /api/customer/mind/v1/paper-portfolio
          check GET /api/customer/mind/v1/paper-journal
          check GET /api/customer/mind/v1/research-engines
          check GET /api/customer/mind/v1/decision-history
          check POST /api/customer/mind/v1/assistant/query '{"question":"status"}'
          # Unknown and trade-like customer routes are refused identically, so route names are not disclosed.
          check GET /api/customer/mind/v1/admin
          check GET /api/customer/mind/v1/orders
          exit $fail

      - name: Authenticated Mind reads and denials (per-run token, never printed)
        # The token is minted for this run only (Cognito access/ID tokens last 15 minutes). No long-lived
        # JWT is stored. The owner provisions the test customer, the password secret and the client id
        # variable (see docs). Missing pieces report AUTHENTICATED_RUNTIME_NOT_VERIFIED, never a pass.
        env:
          VERIFY_USERNAME: ${{ secrets.MINDTICK_VERIFY_USERNAME }}
          VERIFY_PASSWORD: ${{ secrets.MINDTICK_VERIFY_PASSWORD }}
          VERIFY_CLIENT_ID: ${{ vars.MINDTICK_VERIFY_COGNITO_CLIENT_ID }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$VERIFY_USERNAME" ] || [ -z "$VERIFY_PASSWORD" ] || [ -z "$VERIFY_CLIENT_ID" ]; then
            echo "AUTHENTICATED_RUNTIME_NOT_VERIFIED: the verification user, password secret or client id variable is not configured."
            echo "::warning title=Mind authenticated verification::AUTHENTICATED_RUNTIME_NOT_VERIFIED. Owner provisioning is required."
            {
              echo "### Mind live verification"
              echo "- Anonymous gateway refusal: checked in the previous step"
              echo "- Authenticated reads and denials: AUTHENTICATED_RUNTIME_NOT_VERIFIED"
              echo "- Deployed backend and account-edge revision: not verified by this workflow"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Mint a fresh ID token for this run. The password is passed through a file, never argv or logs.
          umask 077
          printf '%s' "$VERIFY_PASSWORD" > "$RUNNER_TEMP/verify_password"
          python3 - "$VERIFY_CLIENT_ID" "$VERIFY_USERNAME" "$RUNNER_TEMP/verify_password" > "$RUNNER_TEMP/verify_token" <<'PY'
          import json, sys, urllib.request
          client_id, username, pw_file = sys.argv[1], sys.argv[2], sys.argv[3]
          password = open(pw_file).read()
          body = json.dumps({"AuthFlow": "USER_PASSWORD_AUTH", "ClientId": client_id,
                             "AuthParameters": {"USERNAME": username, "PASSWORD": password}}).encode()
          req = urllib.request.Request("https://cognito-idp.ap-south-1.amazonaws.com/", data=body, method="POST",
                                       headers={"X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
                                                "Content-Type": "application/x-amz-json-1.1"})
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  result = json.load(resp)
          except Exception:
              print("", end="")
              sys.exit(2)
          token = result.get("AuthenticationResult", {}).get("IdToken", "")
          if not token:
              sys.exit(3)
          print(token, end="")
          PY
          rm -f "$RUNNER_TEMP/verify_password"
          token="$(cat "$RUNNER_TEMP/verify_token")"
          rm -f "$RUNNER_TEMP/verify_token"
          if [ -z "$token" ]; then
            echo "FAIL: could not mint a verification token from Cognito for this run."
            exit 1
          fi
          echo "::add-mask::$token"
          auth=(-H "Authorization: Bearer $token")
          fail=0
          for path in /api/customer/mind/v1/progress /api/customer/mind/v1/paper-portfolio /api/customer/mind/v1/paper-journal /api/customer/mind/v1/research-engines /api/customer/mind/v1/decision-history; do
            code="$(curl -sS -o /tmp/body.json -w '%{http_code}' --max-time 20 "${auth[@]}" "https://api.minttick.com$path")"
            if [ "$code" != 200 ] || ! python3 -c "import json;d=json.load(open('/tmp/body.json'));assert isinstance(d,dict)"; then
              echo "FAIL authenticated $path -> $code"; fail=1; continue
            fi
            echo "PASS authenticated $path -> 200 JSON object"
          done
          for path in /api/customer/mind/v1/admin /api/customer/mind/v1/orders; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${auth[@]}" "https://api.minttick.com$path")"
            if [ "$code" = 404 ]; then echo "PASS authenticated $path -> 404"; else echo "FAIL authenticated $path -> $code"; fail=1; fi
          done
          exit $fail
