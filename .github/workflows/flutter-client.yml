name: Flutter client foundation and first slice

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/trading_client/**'
      - '.github/workflows/flutter-client.yml'
      - 'docs/flutter-delivery-gate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-web-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/trading_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Reconcile generated platform wrappers with pinned SDK
        run: flutter create --platforms=web,android,ios --project-name trading_client .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=/
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8080

  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/trading_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Reconcile generated iOS wrapper with pinned SDK
        run: flutter create --platforms=ios --project-name trading_client .
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign --dart-define=API_BASE_URL=http://127.0.0.1:8080
