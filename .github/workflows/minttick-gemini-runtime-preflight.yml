name: MintTick Gemini runtime preflight (no provider call)

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-gemini-runtime-preflight.yml'
      - 'infra/ec2-paper/gemini_runtime_preflight.py'
      - 'scripts/tests/test_gemini_runtime_preflight.py'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/gemini-runtime-preflight.json'

permissions:
  contents: read

concurrency:
  group: minttick-gemini-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test sanitized runtime inspection and fail-closed receipt parsing
        run: python3 -m unittest discover -s scripts/tests -p test_gemini_runtime_preflight.py -v

  inspect:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Only the real host inspection enters the lifecycle queue. PR validation
    # must not supersede a deployment waiting/running in that shared group.
    concurrency:
      group: aitrading-paper-ec2-manual-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact one-file read-only request
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/ec2-paper/requests/gemini-runtime-preflight.json'
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'infra/ec2-paper')
          from gemini_runtime_preflight import REQUEST, expected_request
          assert not REQUEST.is_symlink() and REQUEST.is_file() and REQUEST.stat().st_size < 1500
          assert json.loads(REQUEST.read_text()) == expected_request()
          PY
      - name: Reuse existing one-host SSM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-gemini-readonly-preflight
      - name: Inspect running backend binding and admin access without a model call
        env:
          AWS_REGION: ap-south-1
        run: python3 infra/ec2-paper/gemini_runtime_preflight.py runner
      - name: Record whether the existing Gemini repository secret is accessible
        env:
          REPOSITORY_GEMINI_SECRET_ACCESSIBLE: ${{ secrets.GEMINI_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = os.environ['REPOSITORY_GEMINI_SECRET_ACCESSIBLE']
          assert value in ('true', 'false')
          path = Path('gemini-runtime-preflight.json')
          report = json.loads(path.read_text())
          report['repositoryGeminiSecretAccessible'] = value == 'true'
          path.write_text(json.dumps(report, indent=2) + '\n')
          print('Existing repository GEMINI_API_KEY accessible: ' + value)
          PY
      - name: Retain sanitized preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-runtime-preflight
          path: gemini-runtime-preflight.json
          if-no-files-found: ignore
          retention-days: 14
