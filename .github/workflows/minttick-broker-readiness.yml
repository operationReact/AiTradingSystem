name: MintTick - read-only broker and market feed readiness
on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/read_broker_readiness.sh'
      - '.github/workflows/minttick-broker-readiness.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/broker-readiness.json'
permissions:
  contents: read
concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash -n infra/ec2-paper/read_broker_readiness.sh
      - name: Compile embedded Python readiness parser
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path(".github/workflows/minttick-broker-readiness.yml").read_text()
          matches = re.findall(r"result=\"\\$\\(python3 - <<'PY'\\n(.*?)\\n          PY", source, re.S)
          assert len(matches) == 1, "Expected one bounded SSM output parser"
          code = "\\n".join(row[10:] for row in matches[0].splitlines())
          compile(code, "minttick-readiness-output-parser", "exec")
          PY

  inspect:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-09c01b470fb39b85a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact one-file read-only diagnostic request
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/ec2-paper/requests/broker-readiness.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('infra/ec2-paper/requests/broker-readiness.json').read_text())
          assert actual == {
              "application":"MintTick","environment":"paper",
              "aws_account":"098859530205","region":"ap-south-1",
              "instance_id":"i-09c01b470fb39b85a",
              "operation":"read-only-broker-readiness"
          }
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-broker-readiness-${{ github.run_id }}
      - name: Verify existing exact PAPER EC2 identity, SSM and cost stop
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'infra/ec2-paper')
          import verify_ssm_release
          verify_ssm_release.verify_aws()
          PY
      - name: Read approved broker readiness only; never print secret values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          script=Path("infra/ec2-paper/read_broker_readiness.sh").read_bytes()
          assert 100 < len(script) < 12000
          command="printf '%s' '"+base64.b64encode(script).decode()+"' | base64 -d | bash"
          p=Path(os.environ["RUNNER_TEMP"])/"broker-readiness.json"
          p.write_text(json.dumps({"commands":[command]}))
          p.chmod(0o600)
          PY
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript             --instance-ids "$INSTANCE_ID"             --parameters "file://$RUNNER_TEMP/broker-readiness.json"             --comment 'MintTick read-only broker configuration status'             --query Command.CommandId --output text)"
          rm -f "$RUNNER_TEMP/broker-readiness.json"
          for attempt in $(seq 1 35); do
            aws ssm get-command-invocation --command-id "$command_id"               --instance-id "$INSTANCE_ID" --output json > "$RUNNER_TEMP/status.json" 2>/dev/null || true
            result="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
              d=json.loads((Path(os.environ["RUNNER_TEMP"])/"status.json").read_text())
          except (ValueError,OSError):
              print("PENDING");raise SystemExit
          status=d.get("Status","PENDING")
          if status=="Success":
              expected={
                "MINTTICK_OWNER_BINDING": {"PRESENT","MISSING"},
                "MINTTICK_PRIVATE_FEED_MODE": {"ENABLED","NOT_ENABLED"},
                "MINTTICK_UPSTOX_SERVER_CONFIG": {"PRESENT","NOT_CONFIGURED"},
                "MINTTICK_PRIVATE_FEED_LAMBDA": {"READY","NOT_CONFIRMED"},
                "MINTTICK_MARKET_CATALOGUE": {"READY","EMPTY","UNAVAILABLE"},
                "MINTTICK_HOST_FEED_PREREQUISITES": {"READY","COMPOSE_ENV_MISSING","COMPOSE_ENV_PERMISSIONS","COMPOSE_FILE_MISSING","INSTALLED_COMPOSE_OUTDATED","DOCKER_MISSING"},
                "MINTTICK_PRIVATE_FEED_DIAGNOSTIC": {"READY","CREDENTIALS_NOT_CONFIGURED","SSM_UNAVAILABLE","INVALID_TOTP_CONFIGURATION","INTERNAL_FAILURE","UNEXPECTED_RESPONSE","INVALID_RESPONSE","INVOKE_ACCESS_DENIED","FUNCTION_NOT_FOUND","THROTTLED","INVOCATION_TIMEOUT","INVOCATION_FAILED"},
              }
              for line in d.get("StandardOutputContent","").splitlines():
                  if ":" in line:
                      k,v=map(str.strip,line.split(":",1))
                      if k in expected and v in expected[k]:
                          print(k+": "+v)
                      if k=="MINTTICK_CASH_EQUITY_INSTRUMENTS":
                          if re.fullmatch(r"[0-9]{1,6}",v):
                              print(k+": "+v)
                      if k=="MINTTICK_PRIVATE_FEED_UNAVAILABLE_FIELDS":
                          fields=v.split(",")
                          allowed={"api_key","client_code","pin","totp_secret"}
                          if fields and len(fields)<=4 and len(set(fields))==len(fields) and set(fields).issubset(allowed):
                              print(k+": "+",".join(fields))
              print("SUCCESS")
          else:
              print(status)
          PY
          )"
            if [[ "$result" == *SUCCESS ]]; then
              printf '%s\n' "$result"
              echo 'Read-only readiness inventory complete'
              exit 0
            fi
            case "$result" in Failed|TimedOut|Cancelled) echo 'Read-only SSM inventory failed' >&2; exit 1;; esac
            sleep 6
          done
          echo 'Read-only readiness inventory was not completed' >&2
          exit 1
