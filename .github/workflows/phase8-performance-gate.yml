name: Phase 8 - Daily performance regression
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/main/java/in/aitradingsystem/analytics/**'
      - 'backend/src/test/java/in/aitradingsystem/analytics/**'
      - 'backend/src/main/resources/db/migration/V34__daily_performance_materialization.sql'
      - '.github/workflows/phase8-performance-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Prove ledger reconciliation, point-in-time valuation and replay
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Dtest=PerformanceAggregationServiceIT,PerformanceDrawdownTest test
      - name: Upload PostgreSQL performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p08-daily-performance-evidence
          path: backend/target/surefire-reports
          retention-days: 14
