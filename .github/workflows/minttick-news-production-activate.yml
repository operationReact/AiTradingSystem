name: MintTick production news activation (existing PAPER host)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/minttick-news-production-activate.yml'
      - 'infra/ec2-paper/news_runtime_activate.py'
      - 'infra/ec2-paper/requests/news-runtime-activate.json'
      - 'infra/ec2-paper/paper-compose.yml'
      - 'backend/src/main/java/in/aitradingsystem/security/SecurityConfig.java'
      - 'backend/src/main/java/in/aitradingsystem/news/policy/NewsSourcePolicyAdminController.java'
  push:
    branches: [main]
    paths: ['infra/ec2-paper/requests/news-runtime-activate.json']

permissions:
  contents: read

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate activation contract
        run: |
          set -euo pipefail
          python3 -m py_compile infra/ec2-paper/news_runtime_activate.py infra/ec2-paper/verify_ssm_release.py
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = infra/ec2-paper/requests/news-runtime-activate.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          expected={
            "kind":"minttick-news-runtime-activate-v1",
            "account":"098859530205",
            "region":"ap-south-1",
            "instance_id":"i-09c01b470fb39b85a",
            "environment":"PAPER",
            "operation":"activate",
            "source_ids":["nse-announcements","moneycontrol","economic-times","sebi"],
            "permitted_uses":["INGEST","RETAIN","DISPLAY","NLP_TRANSFER"],
            "reviewer_ref":"owner-attestation:2026-11-25",
            "terms_ref":"owner-attested-publisher-permissions:personal-noncommercial:2026-11-25",
            "content_ttl_days":30,
          }
          p=Path("infra/ec2-paper/requests/news-runtime-activate.json")
          assert p.is_file() and not p.is_symlink() and p.stat().st_size < 1500
          assert json.loads(p.read_text()) == expected
          PY
          fi
      - name: Compile backend and run news source, parser, and PostgreSQL policy tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify news integration contracts
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml -Dtest=NewsSourceRegistryTest,NewsSourceCoverageTest,NewsSourceHealthControllerTest,RssFeedParserTest,NewsIngestionJobTest,NewsIntelligenceAdminHealthControllerIT,NewsSourcePolicyIT test

  activate:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assume existing main OIDC SSM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-news-prod-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Activate attested news path on the exact PAPER host
        run: python3 infra/ec2-paper/news_runtime_activate.py runner
