name: MintTick - activate empty official cash equity catalogue on existing EC2

on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/activate_cash_equity_catalogue.sh'
      - '.github/workflows/minttick-catalogue-activate.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/activate-cash-equity-catalogue.json'

permissions:
  contents: read

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate existing-host market-only import contract
        run: |
          set -euo pipefail
          bash -n infra/ec2-paper/activate_cash_equity_catalogue.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path("infra/ec2-paper/activate_cash_equity_catalogue.sh").read_text()
          for required in (
              "TRADING_MODE: PAPER", "APP_API_KEY=", "ALREADY_ACTIVE",
              "http://127.0.0.1:8080/api/instruments/import",
              "instrument_catalogue_state", "MINTTICK_CASH_EQUITY_INSTRUMENTS",
              "10#$before > 0", "10#$after > 0"):
              assert required in text, f"Missing essential market-only guard: {required}"
          for forbidden in ("placeOrder", "place-order", "RunInstances",
              "start-instances", "stop-instances", "ANGELONE_PASSWORD",
              "UPSTOX_CLIENT_SECRET", "api.minttick.com/api/instruments/import"):
              assert forbidden not in text, f"Unsafe operation in import script: {forbidden}"
          assert len(text.encode()) < 12000, "SSM script exceeds reviewed size"
          PY
  activate:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-09c01b470fb39b85a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact one-file authenticated market catalogue activation
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/ec2-paper/requests/activate-cash-equity-catalogue.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("infra/ec2-paper/requests/activate-cash-equity-catalogue.json").read_text())
          assert actual=={
              "application":"MintTick", "environment":"paper",
              "aws_account":"098859530205", "region":"ap-south-1",
              "instance_id":"i-09c01b470fb39b85a",
              "operation":"activate-empty-cash-equity-catalogue",
              "authorization":"USER_APPROVED_MINTTICK_MARKET_DATA_REPAIR_2026-11-08",
          }, "Unapproved market catalogue request"
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-market-catalogue-${{ github.run_id }}
      - name: Verify exact running EC2, identity and nightly stop before SSM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"infra/ec2-paper")
          import verify_ssm_release
          verify_ssm_release.verify_aws()
          PY
      - name: Import official instruments through protected localhost operator API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          code=Path("infra/ec2-paper/activate_cash_equity_catalogue.sh").read_bytes()
          assert 100 < len(code) < 12000
          command="printf '%s' '"+base64.b64encode(code).decode()+"' | base64 -d | bash"
          target=Path(os.environ["RUNNER_TEMP"])/"catalogue-ssm.json"
          target.write_text(json.dumps({"commands":[command]}))
          target.chmod(0o600)
          PY
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "file://$RUNNER_TEMP/catalogue-ssm.json" \
            --comment 'MintTick official cash-equity catalogue activation, localhost only' \
            --query Command.CommandId --output text)"
          rm -f "$RUNNER_TEMP/catalogue-ssm.json"
          for attempt in $(seq 1 55); do
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --output json > "$RUNNER_TEMP/catalogue-result.json" 2>/dev/null || true
            state="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
              result=json.loads((Path(os.environ["RUNNER_TEMP"])/"catalogue-result.json").read_text())
          except (ValueError,OSError):
              print("Pending");raise SystemExit
          status=result.get("Status","Pending")
          if status=="Success":
              output=result.get("StandardOutputContent","")
              marker=re.search(r"(?m)^MINTTICK_CATALOGUE_IMPORT: (SUCCESS|ALREADY_ACTIVE)$",output)
              count=re.search(r"(?m)^MINTTICK_CASH_EQUITY_INSTRUMENTS: ([1-9][0-9]{0,5})$",output)
              if marker and count:
                  print("VERIFIED")
              else:
                  print("INVALID")
          else:
              print(status)
          PY
          )"
            if [[ "$state" == VERIFIED ]]; then
              echo 'PASS: official cash equity instrument catalogue is activated and non-empty'
              exit 0
            fi
            case "$state" in Failed|TimedOut|Cancelled|INVALID)
              echo 'BLOCKED: market catalogue activation was not verified on exact host' >&2
              exit 2;;
            esac
            sleep 6
          done
          echo 'BLOCKED: market catalogue activation timed out' >&2
          exit 2

# No AWS resource mutations, broker secrets, customer data or real-money order paths.
