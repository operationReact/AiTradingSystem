name: FNO futures instrument master schema verification (read-only, public file)

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/fno-futures-master-verify.yml'
      - 'backend/src/main/java/in/aitradingsystem/provider/upstox/UpstoxFuturesInstrumentMaster.java'
      - 'backend/src/test/java/in/aitradingsystem/provider/upstox/UpstoxFuturesInstrumentMasterLiveFileTest.java'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Download the published Upstox instrument master (public file, no credentials)
        run: |
          set -euo pipefail
          url=https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz
          curl -fsS -m 300 -o "$RUNNER_TEMP/complete.json.gz" "$url"
          test "$(head -c2 "$RUNNER_TEMP/complete.json.gz" | od -An -tx1 | tr -d ' ')" = "1f8b"
          echo "FNO_MASTER_DOWNLOAD_BYTES=$(wc -c < "$RUNNER_TEMP/complete.json.gz")"
          echo "FNO_MASTER_SHA256=$(sha256sum "$RUNNER_TEMP/complete.json.gz" | cut -d' ' -f1)"
          echo "FNO_INSTRUMENT_MASTER_GZ=$RUNNER_TEMP/complete.json.gz" >> "$GITHUB_ENV"
      - name: Verify parser against the real file
        working-directory: backend
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -Dtest=UpstoxFuturesInstrumentMasterLiveFileTest \
            -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee "$RUNNER_TEMP/verify.log"
          cat target/fno-master-facts.txt
