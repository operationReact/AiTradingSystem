name: MintTick - verified backend-connected Android release

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-connected-android.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/minttick-domain/requests/android-connected.json'

permissions:
  contents: read

concurrency:
  group: minttick-verified-connected-apk-dev
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify connected release retains all app security gates
        run: |
          set -euo pipefail
          test -f scripts/verify_minttick_live_api.py
          test -f .github/workflows/phase11-android-apk.yml
          python3 -m py_compile scripts/verify_minttick_live_api.py
          python3 - <<'PY'
          from pathlib import Path
          apk=Path(".github/workflows/phase11-android-apk.yml").read_text()
          client=Path("apps/trading_client/lib/src/presentation/welcome_page.dart").read_text()
          assert "workflow_dispatch:" in apk
          assert "Verify live HTTPS account API before packaging device APK" in apk
          assert "MINTTICK_AUTH_ONLY_TEST" in apk
          assert "MintTickCustomerAccountApi().provision()" in client
          assert "widget.provisionAccount" in client
          assert "MintTickIdentity.current.signIn" in client
          assert "flutter build apk --release" in apk
          assert "sha256sum" in apk
          # The dispatch workflow may ship only stable-signed APKs.
          gradle=Path("apps/trading_client/android/app/build.gradle.kts").read_text()
          assert "MINTTICK_REQUIRE_STABLE_SIGNING" in gradle
          assert 'signingConfigs.getByName("minttickRelease")' in gradle
          for marker in (
              "MINTTICK_ANDROID_KEYSTORE_BASE64",
              "secrets.MINTTICK_ANDROID_STORE_PASSWORD",
              "vars.MINTTICK_ANDROID_CERT_SHA256",
              "Confirm APK is signed by the pinned permanent certificate",
              "apksigner",
              "--build-number",
              "Build CI-only debug-signed APK without release credentials",
          ):
              assert marker in apk, f"Missing Android signing gate: {marker}"
          PY

  dispatch:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      API_BASE_URL: https://api.minttick.com
      COGNITO_POOL: ap-south-1_jz2T8qbiY
      COGNITO_CLIENT: 6jm18v2mdpcfraip92hrjhqjnd
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require only the explicitly approved connected APK release request
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "infra/minttick-domain/requests/android-connected.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("infra/minttick-domain/requests/android-connected.json").read_text())
          expected={
            "application":"MintTick",
            "environment":"dev",
            "operation":"build-connected-android",
            "api_base_url":"https://api.minttick.com",
            "public_api_ready":True,
            "cognito_pool":"ap-south-1_jz2T8qbiY",
            "authorization":"USER_APPROVED_MINTTICK_CONNECTED_APK_2026-11-07"
          }
          assert actual == expected, "Refusing unreviewed connected Android release request"
          PY
      - name: Test real TLS account API and reject unauthenticated app access
        run: |
          set -euo pipefail
          python3 scripts/verify_minttick_live_api.py
          code="$(curl --silent --show-error --location --max-time 15 \
            --output /dev/null --write-out '%{http_code}' "$API_BASE_URL/api/admin/users")"
          test "$code" = "404" || { echo "Blocked: admin API not isolated" >&2; exit 2; }
      - name: Dispatch existing signed-in, backend-connected Android APK workflow
        run: |
          set -euo pipefail
          gh workflow run phase11-android-apk.yml --repo operationReact/AiTradingSystem \
            --ref dev \
            -f api_base_url="$API_BASE_URL" \
            -f cognito_user_pool_id="$COGNITO_POOL" \
            -f cognito_client_id="$COGNITO_CLIENT"
          echo "Backend-connected APK build dispatched; workflow will independently reverify API and run Flutter analyze, test, release build and checksum."
