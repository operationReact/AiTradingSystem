name: Phase 8 - Operations regression
on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/main/java/in/aitradingsystem/notification/**'
      - 'backend/src/test/java/in/aitradingsystem/notification/**'
      - 'backend/src/main/java/in/aitradingsystem/operations/**'
      - 'backend/src/test/java/in/aitradingsystem/operations/**'
      - 'backend/src/main/java/in/aitradingsystem/audit/**'
      - 'backend/src/test/java/in/aitradingsystem/audit/**'
      - 'backend/src/main/java/in/aitradingsystem/api/OperationsController.java'
      - 'backend/src/main/java/in/aitradingsystem/api/AnalyticsController.java'
      - 'backend/src/main/java/in/aitradingsystem/api/AuditController.java'
      - 'backend/src/main/java/in/aitradingsystem/api/NotificationController.java'
      - 'backend/src/test/java/in/aitradingsystem/api/Phase8ApiContractIT.java'
      - 'backend/src/main/java/in/aitradingsystem/api/PaperBacktestController.java'
      - 'backend/src/main/resources/db/migration/V35__system_notifications.sql'
      - 'backend/src/main/resources/db/migration/V36__notification_source_projection.sql'
      - 'backend/src/main/resources/db/migration/V37__audit_actor_and_query_indexes.sql'
      - '.github/workflows/phase8-operations-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Prove notification persistence, deduplication, acknowledgement and source integration
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Dtest=Phase8ApiContractIT,AnalyticsServicesIT,PerformanceAggregationServiceIT,AuditQueryServiceIT,AuditCsvTest,BacktestFailureNotificationTest,OperationalHealthServiceTest,OperationalEvidenceIT,NotificationServiceIT,PaperReconciliationServiceIT,PaperTradeApiIT test
      - name: Upload operations evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p08-operations-evidence
          path: backend/target/surefire-reports
          retention-days: 14
