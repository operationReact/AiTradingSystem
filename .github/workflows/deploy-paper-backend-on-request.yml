name: Deploy PAPER backend to live AWS on request

on:
  push:
    branches: [dev]
    paths:
      - 'infra/paper-backend-deploy.request'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-paper-backend-on-request
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  LIVE_DOMAIN: maargglobal.com
  ECR_BACKEND: ai-trading-system-backend
  ECS_CLUSTER: ai-trading-system
  ECS_BACKEND_SERVICE: ai-trading-system-backend
  BACKEND_TASK_FAMILY: ai-trading-system-backend

jobs:
  deploy:
    name: Publish and deploy PAPER backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment intent
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/dev" || { echo "::error::Deployment is allowed only from dev"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "::error::Repository variable AWS_ROLE_ARN is required"; exit 1; }
          test "$AWS_REGION" = "us-east-1" || { echo "::error::Unexpected AWS region"; exit 1; }
          test "$LIVE_DOMAIN" = "maargglobal.com" || { echo "::error::Unexpected domain"; exit 1; }
          grep -qx 'deploy_backend=true' infra/paper-backend-deploy.request || { echo "::error::Explicit deploy_backend=true request is required"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-paper-backend-${{ github.run_id }}
          allowed-account-ids: '816344830716'
          action-timeout-s: 120

      - name: Verify existing backend service and PAPER task contract
        run: |
          set -euo pipefail
          aws ecs describe-clusters --clusters "$ECS_CLUSTER" --query 'clusters[0].status' --output text | grep -qx ACTIVE
          SERVICE_COUNT="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" --query 'length(services)' --output text)"
          test "$SERVICE_COUNT" = "1" || { echo "::error::Backend ECS service is missing"; exit 1; }
          aws ecs describe-task-definition --task-definition "$BACKEND_TASK_FAMILY" --query taskDefinition > /tmp/backend-task.json
          PAPER_MODE="$(jq -r '.containerDefinitions[] | select(.name == "backend") | .environment[]? | select(.name == "TRADING_MODE") | .value' /tmp/backend-task.json | tail -n 1)"
          test "$PAPER_MODE" = "PAPER" || { echo "::error::Backend task definition is not PAPER-only"; exit 1; }
          echo "Existing backend task contract is PAPER-only."

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "$ECR_BACKEND" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Backend image $IMAGE_TAG already exists; reusing immutable image."
          else
            docker build -f backend/Dockerfile -t "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG" backend
            docker push "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG"
          fi

      - name: Register backend task definition with current image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq --arg image "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG" '
            .containerDefinitions |= map(if .name == "backend" then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' /tmp/backend-task.json > /tmp/backend-task-new.json
          jq -e '.containerDefinitions[] | select(.name == "backend") | .environment[]? | select(.name == "TRADING_MODE" and .value == "PAPER")' /tmp/backend-task-new.json >/dev/null
          aws ecs register-task-definition --cli-input-json file:///tmp/backend-task-new.json > /tmp/backend-registered.json
          jq -r '.taskDefinition.taskDefinitionArn' /tmp/backend-registered.json

      - name: Deploy backend service
        run: |
          set -euo pipefail
          TASK_ARN="$(jq -r '.taskDefinition.taskDefinitionArn' /tmp/backend-registered.json)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$TASK_ARN" \
            --desired-count 1 \
            --force-new-deployment >/tmp/backend-service-update.json
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE"
          RUNNING="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" --query 'services[0].runningCount' --output text)"
          DESIRED="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" --query 'services[0].desiredCount' --output text)"
          test "$RUNNING" = "1" -a "$DESIRED" = "1" || { echo "::error::Backend service did not stabilize at 1/1"; exit 1; }
          echo "Backend ECS service is stable at 1/1."

      - name: Verify public PAPER backend health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            BODY="$(curl --fail --silent --show-error "https://$LIVE_DOMAIN/api/health" 2>/dev/null || true)"
            if [ -n "$BODY" ] && echo "$BODY" | jq -e '.status == "UP" and .mode == "PAPER"' >/dev/null 2>&1; then
              echo "PAPER backend health is UP at https://$LIVE_DOMAIN/api/health"
              echo "$BODY" | jq '{status,service,mode,timestamp}'
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public PAPER backend health verification failed"
          exit 1
