name: MintTick - owner private archive read-only audit

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-owner-private-archive-audit.yml'
      - 'infra/ec2-paper/owner_personal_angelone_history.py'
      - 'infra/ec2-paper/run_owner_personal_history.sh'
      - 'scripts/tests/test_owner_personal_angelone_history.py'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/owner-personal-history-audit.json'

permissions:
  contents: read

# Also serialize against the owner-only downloader. The host archive lock is
# the independent second line of protection against a concurrent writer.
concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false

jobs:
  offline-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the offline audit command and exact wrapper
        run: |
          set -euo pipefail
          bash -n infra/ec2-paper/run_owner_personal_history.sh
          python3 -m unittest discover -s scripts/tests -p test_owner_personal_angelone_history.py -v
          python3 - <<'PY'
          from pathlib import Path
          a=Path('infra/ec2-paper/owner_personal_angelone_history.py').read_text()
          b=Path('infra/ec2-paper/run_owner_personal_history.sh').read_text()
          assert 'def audit_private_archive(' in a
          assert 'if sys.argv[1:] == ["audit-only"]:' in a
          assert '"$root/run_owner_personal_history.sh"' not in b
          assert "['audit-only'] if mode=='audit-only'" in b
          PY

  audit:
    name: Owner-only no-provider archive checksum report (already-running EC2)
    needs: offline-check
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-09c01b470fb39b85a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require sole approved request and daylight-safe audit window
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = \
            'infra/ec2-paper/requests/owner-personal-history-audit.json'
          now="$(TZ=Asia/Kolkata date +%H%M)"
          test "$((10#$now))" -ge 900
          test "$((10#$now))" -le 2120
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('infra/ec2-paper/requests/owner-personal-history-audit.json')
          assert not p.is_symlink() and p.is_file() and p.stat().st_size <= 2048
          assert json.loads(p.read_text()) == {
            'application': 'MintTick',
            'operation': 'owner-personal-history-audit-only',
            'account': '098859530205',
            'region': 'ap-south-1',
            'instance_id': 'i-09c01b470fb39b85a',
            'max_provider_calls': 0,
            'read_only_archive': True,
            'private_ec2_only': True,
            'no_redistribution': True,
            'enable_trading': False,
          }
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-owner-archive-audit
      - name: Verify exact AWS identity, running host, online SSM and nightly stop
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'infra/ec2-paper')
          import verify_ssm_release
          verify_ssm_release.verify_aws()
          PY
      - name: Pin reviewed nonsecret source and form fixed audit-only SSM command
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          tar -cf "$RUNNER_TEMP/owner-audit-source.tar" -C infra/ec2-paper \
            probe_owner_angelone_auth.py \
            owner_personal_angelone_history.py \
            run_owner_personal_history.sh
          digest="$(sha256sum "$RUNNER_TEMP/owner-audit-source.tar" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          aws s3 cp "$RUNNER_TEMP/owner-audit-source.tar" \
            "s3://aitrading-paper-releases-098859530205/releases/$GITHUB_SHA/owner-personal/$digest/scripts.tar" \
            --region ap-south-1 --sse AES256 --no-progress --only-show-errors
          python3 - "$GITHUB_SHA" "$digest" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          sha,digest=sys.argv[1:]
          assert re.fullmatch(r'[a-f0-9]{40}',sha) and re.fullmatch(r'[a-f0-9]{64}',digest)
          script=r"""set -Eeuo pipefail
          umask 077
          test "$(id -u)" -eq 0
          test "$(uname -m)" = aarch64
          root=/opt/aitradingsystem-paper
          test -d "$root" && test ! -L "$root"
          work="$(mktemp -d "$root/.personal-audit.XXXXXXXX")"
          cleanup() { rm -rf -- "$work"; }
          trap cleanup EXIT
          chmod 0700 "$work"
          aws s3 cp 's3://aitrading-paper-releases-098859530205/releases/@@SHA@@/owner-personal/@@HASH@@/scripts.tar' "$work/scripts.tar" --region ap-south-1 --no-progress --only-show-errors
          printf '%s  %s\n' '@@HASH@@' "$work/scripts.tar" | sha256sum -c - >/dev/null
          files="$(tar -tf "$work/scripts.tar" | LC_ALL=C sort)"
          expected="$(printf 'probe_owner_angelone_auth.py\nowner_personal_angelone_history.py\nrun_owner_personal_history.sh\n' | LC_ALL=C sort)"
          test "$files" = "$expected"
          tar -xf "$work/scripts.tar" -C "$work"
          for file in probe_owner_angelone_auth.py owner_personal_angelone_history.py run_owner_personal_history.sh; do
            test -f "$work/$file" && test ! -L "$work/$file"
          done
          bash -n "$work/run_owner_personal_history.sh"
          python3 - "$work" <<'PYCHECK'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          a=(p/'probe_owner_angelone_auth.py').read_text()
          b=(p/'owner_personal_angelone_history.py').read_text()
          assert '\nif __name__ == "__main__":' in a
          merged=a.split('\nif __name__ == "__main__":',1)[0]+'\n'+b
          assert 'def audit_private_archive(' in merged
          compile(merged,'<owner-audit-review>','exec')
          PYCHECK
          install -o root -g root -m 0600 "$work/probe_owner_angelone_auth.py" "$root/probe_owner_angelone_auth.py"
          install -o root -g root -m 0600 "$work/owner_personal_angelone_history.py" "$root/owner_personal_angelone_history.py"
          install -o root -g root -m 0700 "$work/run_owner_personal_history.sh" "$root/run_owner_personal_history.sh"
          "$root/run_owner_personal_history.sh" audit-only"""
          script=script.replace('@@SHA@@',sha).replace('@@HASH@@',digest)
          p=Path(os.environ['RUNNER_TEMP'])/'owner-audit-ssm.json'
          p.write_text(json.dumps({'commands':[script]}))
          p.chmod(0o600)
          PY
          rm -f "$RUNNER_TEMP/owner-audit-source.tar"
      - name: Run one fixed no-network archive audit and print allowlisted totals only
        run: |
          set -euo pipefail
          id="$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" --timeout-seconds 240 \
            --parameters "file://$RUNNER_TEMP/owner-audit-ssm.json" \
            --comment 'MintTick owner-only offline archive checksum audit, no broker API' \
            --query Command.CommandId --output text)"
          rm -f "$RUNNER_TEMP/owner-audit-ssm.json"
          [[ "$id" =~ ^[0-9a-f-]{36}$ ]]
          for attempt in $(seq 1 120); do
            aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --output json > "$RUNNER_TEMP/owner-audit-status.json" 2>/dev/null || true
            summary="$(python3 - "$RUNNER_TEMP/owner-audit-status.json" <<'PY'
          import json,re,sys
          from pathlib import Path
          try:
              z=json.loads(Path(sys.argv[1]).read_text())
          except (OSError,ValueError):
              print('PENDING')
              raise SystemExit
          state=z.get('Status')
          if state not in ('Success','Failed','TimedOut','Cancelled'):
              print('PENDING')
              raise SystemExit
          if state != 'Success':
              print('AUDIT_FAILED')
              raise SystemExit
          lines=(z.get('StandardOutputContent') or '').splitlines()
          def read_unique(key,pattern):
              matches=[re.fullmatch(pattern,line) for line in lines if line.startswith(key)]
              if len(matches)!=1 or matches[0] is None:
                  raise ValueError
              return matches[0].group(1)
          try:
              pages=read_unique('PERSONAL_ARCHIVE_VERIFIED_PAGES:',r'PERSONAL_ARCHIVE_VERIFIED_PAGES: ([0-9]{1,12})')
              rows=read_unique('PERSONAL_ARCHIVE_VERIFIED_ROWS:',r'PERSONAL_ARCHIVE_VERIFIED_ROWS: ([0-9]{1,12})')
              assert lines.count('PERSONAL_ARCHIVE_API_CALLS: 0')==1
              assert lines.count('PERSONAL_ARCHIVE_AUDIT_STATUS: VERIFIED')==1
              assert lines.count('PERSONAL_GOLDEN_SOURCE_PUBLISHED: FALSE')==1
          except (ValueError,AssertionError):
              print('AUDIT_FAILED')
              raise SystemExit
          print('AUDIT_OK')
          print('PERSONAL_ARCHIVE_VERIFIED_PAGES: '+str(int(pages)))
          print('PERSONAL_ARCHIVE_VERIFIED_ROWS: '+str(int(rows)))
          print('PERSONAL_ARCHIVE_API_CALLS: 0')
          print('PERSONAL_ARCHIVE_AUDIT_STATUS: VERIFIED')
          PY
            )"
            rm -f "$RUNNER_TEMP/owner-audit-status.json"
            if [[ "$summary" == AUDIT_OK* ]]; then
              printf '%s\n' "$summary"
              exit 0
            fi
            if [[ "$summary" == AUDIT_FAILED* ]]; then
              echo 'Audit blocked: SSM or archive-integrity precondition failed'
              exit 2
            fi
            sleep 2
          done
          echo 'Audit timed out: no new candles requested; no new count confirmed'
          exit 2
