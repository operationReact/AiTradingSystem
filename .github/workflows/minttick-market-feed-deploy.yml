name: MintTick market feed - explicit plan or apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan previews IAM/costs; apply creates the on-demand feed Lambda'
        required: true
        type: choice
        default: plan
        options: [plan, apply]
  # A single reviewed, typed JSON request is the only non-interactive apply
  # entrypoint. The dev branch + dedicated broker-feed OIDC role still gate AWS.
  push:
    branches: [dev]
    paths:
      - 'infra/minttick-market-feed/requests/deploy.json'

permissions:
  id-token: write
  contents: read

concurrency:
  group: minttick-market-feed-terraform
  cancel-in-progress: false

jobs:
  terraform:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
      EXPECTED_ACCOUNT: "098859530205"
      TF_IN_AUTOMATION: "true"
      TF_VAR_ssm_customer_kms_key_arn: ${{ vars.MINTTICK_FEED_SSM_CUSTOM_KMS_KEY_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact one-file authorized private market-feed apply
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'operationReact/AiTradingSystem'
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/minttick-market-feed/requests/deploy.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path("infra/minttick-market-feed/requests/deploy.json").read_text())
          expected={
            "application":"MintTick",
            "aws_account":"098859530205",
            "region":"ap-south-1",
            "environment":"dev",
            "operation":"apply-read-only-owner-market-feed",
            "authorization":"USER_APPROVED_MINTTICK_PRIVATE_FEED_2026-11-07",
          }
          assert value==expected, "No exact owner-only read-only feed authorization"
          PY
      - name: Require separate read-only feed deployment role
        env:
          ROLE: arn:aws:iam::098859530205:role/minttick-feed-github-deploy
        run: |
          set -euo pipefail
          test "$ROLE" = "arn:aws:iam::098859530205:role/minttick-feed-github-deploy"
          test "$AWS_REGION" = "ap-south-1"
          test "$GITHUB_REF" = "refs/heads/dev"
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Authenticate through branch-restricted GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/minttick-feed-github-deploy
          aws-region: ap-south-1
          role-session-name: minttick-feed-${{ github.run_id }}
      - name: Check target account and offline Lambda tests
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          python3 -m unittest discover -s market-feed -p 'test_*.py' -v
      - name: Initialize isolated encrypted Terraform state
        working-directory: infra/minttick-market-feed
        run: terraform init -input=false -backend-config=backend.hcl
      - name: Recover only the partially created exact feed IAM role state
        working-directory: infra/minttick-market-feed
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          terraform state pull > "$RUNNER_TEMP/minttick-feed-state.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'minttick-feed-state.json').read_text())
          matches=[r for r in data.get('resources',[])
                   if r.get('mode')=='managed' and r.get('type')=='aws_iam_role' and r.get('name')=='feed']
          assert len(matches)<=1, 'BLOCKED: unexpected duplicate managed feed roles'
          tainted=False
          if matches:
              instances=matches[0].get('instances',[])
              assert len(instances)==1, 'BLOCKED: unexpected feed role state instances'
              instance=instances[0]
              attrs=instance.get('attributes') or {}
              assert attrs.get('name')=='minttick-dev-angelone-feed-lambda'
              assert attrs.get('arn')=='arn:aws:iam::098859530205:role/minttick-dev-angelone-feed-lambda'
              tainted=instance.get('status')=='tainted'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('feed_role_tainted='+str(tainted).lower()+'\n')
          print('PASS: examined exact isolated MintTick feed role state without exposing it')
          PY
          rm -f "$RUNNER_TEMP/minttick-feed-state.json"
        id: taint-check
      - name: Verify the exact Lambda-service trust before repairing state
        if: steps.taint-check.outputs.feed_role_tainted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          aws iam get-role --role-name minttick-dev-angelone-feed-lambda             --output json > "$RUNNER_TEMP/minttick-feed-role.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          role=json.loads((Path(os.environ['RUNNER_TEMP'])/'minttick-feed-role.json').read_text())['Role']
          assert role['Arn']=='arn:aws:iam::098859530205:role/minttick-dev-angelone-feed-lambda'
          document=role.get('AssumeRolePolicyDocument') or {}
          statements=document.get('Statement',[])
          if isinstance(statements,dict): statements=[statements]
          assert len(statements)==1
          policy=statements[0]
          assert policy.get('Effect')=='Allow' and policy.get('Action')=='sts:AssumeRole'
          assert policy.get('Principal',{}).get('Service')=='lambda.amazonaws.com'
          print('PASS: dedicated existing feed role is exclusively trusted by AWS Lambda')
          PY
          rm -f "$RUNNER_TEMP/minttick-feed-role.json"
      - name: Untaint verified partial feed role without deleting AWS resources
        if: steps.taint-check.outputs.feed_role_tainted == 'true'
        working-directory: infra/minttick-market-feed
        run: |
          set -euo pipefail
          terraform untaint -lock-timeout=90s aws_iam_role.feed
          echo 'PASS: only dedicated feed role state taint cleared; no AWS IAM mutation'
      - name: Inspect exact partial feed Lambda state without secrets
        id: lambda-state
        working-directory: infra/minttick-market-feed
        run: |
          set -euo pipefail
          umask 077
          terraform state pull > "$RUNNER_TEMP/feed-lambda-state.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"feed-lambda-state.json").read_text())
          resources=[r for r in data.get("resources",[])
             if r.get("mode")=="managed" and r.get("type")=="aws_lambda_function"
             and r.get("name")=="feed"]
          assert len(resources)<=1, "BLOCKED: unexpected duplicate managed feed Lambdas"
          present=False
          tainted=False
          if resources:
              instances=resources[0].get("instances",[])
              assert len(instances)==1, "BLOCKED: unexpected Lambda state instances"
              item=instances[0]
              attrs=item.get("attributes") or {}
              exact_name="minttick-dev-angelone-feed"
              exact_arn="arn:aws:lambda:ap-south-1:098859530205:function:minttick-dev-angelone-feed"
              assert attrs.get("function_name")==exact_name
              assert attrs.get("id")==exact_name
              tainted=item.get("status")=="tainted"
              # AWS can create the function successfully but Terraform marks
              # an incomplete post-create update as tainted before the ARN
              # attribute has been persisted. Accept only *that* state form.
              if attrs.get("arn")!=exact_arn:
                  assert tainted and not attrs.get("arn"), "BLOCKED: wrong Lambda ARN"
              present=True
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("tracked="+str(present).lower()+"\n")
              output.write("tainted="+str(tainted).lower()+"\n")
          print("PASS: checked state for only dedicated MintTick private feed Lambda")
          PY
          rm -f "$RUNNER_TEMP/feed-lambda-state.json"
      - name: Verify partial Lambda is the exact private read-only runtime
        id: lambda-identity
        run: |
          set -euo pipefail
          umask 077
          if aws lambda get-function-configuration --function-name minttick-dev-angelone-feed \
             --output json > "$RUNNER_TEMP/feed-lambda-identity.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          lam=json.loads((Path(os.environ["RUNNER_TEMP"])/"feed-lambda-identity.json").read_text())
          assert lam["FunctionName"]=="minttick-dev-angelone-feed"
          assert lam["FunctionArn"]=="arn:aws:lambda:ap-south-1:098859530205:function:minttick-dev-angelone-feed"
          assert lam["Role"]=="arn:aws:iam::098859530205:role/minttick-dev-angelone-feed-lambda"
          assert lam["Runtime"]=="python3.12"
          assert lam["Handler"]=="lambda_function.handler"
          assert lam["PackageType"]=="Zip"
          assert lam["Architectures"]==["arm64"]
          assert lam["MemorySize"]==256 and lam["Timeout"]==25
          assert not (lam.get("VpcConfig") or {}).get("VpcId")
          assert not lam.get("Layers")
          assert not (lam.get("Environment") or {}).get("Variables")
          print("PASS: exact IAM-only read-only Lambda runtime identity verified")
          PY
            echo 'existing=true' >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.lambda-state.outputs.tracked }}" = 'true' ]; then
              echo 'BLOCKED: previously managed Lambda is unexpectedly missing' >&2
              exit 2
            fi
            echo 'existing=false' >> "$GITHUB_OUTPUT"
            echo 'No prior Lambda exists; normal reviewed create plan will run'
          fi
          rm -f "$RUNNER_TEMP/feed-lambda-identity.json"
      - name: Import only an exact previously created feed Lambda into isolated state
        if: steps.lambda-state.outputs.tracked == 'false' && steps.lambda-identity.outputs.existing == 'true'
        working-directory: infra/minttick-market-feed
        run: |
          set -euo pipefail
          terraform import -lock-timeout=90s aws_lambda_function.feed minttick-dev-angelone-feed
          echo 'PASS: recovered only pre-existing dedicated feed Lambda Terraform state'
      - name: Untaint verified partial private feed Lambda without recreating it
        if: steps.lambda-state.outputs.tainted == 'true' && steps.lambda-identity.outputs.existing == 'true'
        working-directory: infra/minttick-market-feed
        run: |
          set -euo pipefail
          terraform untaint -lock-timeout=90s aws_lambda_function.feed
          echo 'PASS: cleared exact feed Lambda state taint; no AWS resource mutation'
      - name: Validate and plan exact market-feed resources
        working-directory: infra/minttick-market-feed
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -lock-timeout=90s -out="$RUNNER_TEMP/minttick-feed.tfplan"
          terraform show -no-color "$RUNNER_TEMP/minttick-feed.tfplan"
      - name: Reject surprise IAM and infrastructure plan changes
        working-directory: infra/minttick-market-feed
        run: |
          set -euo pipefail
          terraform show -json "$RUNNER_TEMP/minttick-feed.tfplan" > "$RUNNER_TEMP/feed-plan.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads((Path(os.environ['RUNNER_TEMP'])/'feed-plan.json').read_text())
          allowed={
            'aws_lambda_function.feed',
            'aws_iam_role.feed',
            'aws_iam_role_policy.read_only_ssm',
            'aws_cloudwatch_log_group.feed',
            'data.archive_file.read_only_feed',
          }
          for change in plan.get("resource_changes",[]):
              address=change.get("address")
              actions=change.get("change",{}).get("actions",[])
              if address not in allowed or actions not in (["no-op"],["create"],["update"],["read"]):
                  raise SystemExit("BLOCKED: feed plan contains unreviewed infrastructure change")
          print("PASS: plan contains only the four reviewed private read-only feed resources")
          PY
          rm -f "$RUNNER_TEMP/feed-plan.json"
      - name: Deploy only on explicit apply request
        if: inputs.operation == 'apply' || github.event_name == 'push'
        working-directory: infra/minttick-market-feed
        run: terraform apply -input=false "$RUNNER_TEMP/minttick-feed.tfplan"
      - name: Confirm dedicated private Lambda is deployed
        if: inputs.operation == 'apply' || github.event_name == 'push'
        run: |
          set -euo pipefail
          name="$(aws lambda get-function-configuration --function-name minttick-dev-angelone-feed --query FunctionName --output text)"
          test "$name" = minttick-dev-angelone-feed
          echo "PASS: dedicated read-only SSM-backed MintTick feed Lambda exists"
      - name: Delete transient plan
        if: always()
        run: rm -f "$RUNNER_TEMP/minttick-feed.tfplan"
