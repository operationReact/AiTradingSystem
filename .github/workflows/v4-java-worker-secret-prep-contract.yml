name: V82 isolated Java worker token and disabled transport contract

on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/terraform/main.tf'
      - 'infra/terraform/research-worker-java-secret-prep.tf'
      - 'scripts/tests/test_v4_java_worker_secret_prep.py'
      - '.github/workflows/v4-java-worker-secret-prep-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/terraform/main.tf'
      - 'infra/terraform/research-worker-java-secret-prep.tf'
      - 'scripts/tests/test_v4_java_worker_secret_prep.py'
      - '.github/workflows/v4-java-worker-secret-prep-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-secret-boundary:
    name: No shared frontend token, inference opt-in or plaintext credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate V82 isolated optional backend role and flags
        run: python3 -m unittest discover -v -s scripts/tests -p test_v4_java_worker_secret_prep.py

# No AWS secrets, workflow dispatch to ECS, model signals or real trading.
