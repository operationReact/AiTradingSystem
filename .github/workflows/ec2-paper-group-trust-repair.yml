name: EC2 PAPER v2 schedule-group trust repair and nightly stop (stopped host)

on:
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/finish-group-trust-v2.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aitrading-paper-ec2-scheduler-trust-v2
  cancel-in-progress: false

jobs:
  finish:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCOUNT: "098859530205"
      AWS_REGION: ap-south-1
      STATE_REGION: us-east-1
      APPROVAL_REQUEST: infra/ec2-paper/requests/finish-group-trust-v2.json
      INSTANCE_ID: i-09c01b470fb39b85a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate exact one-file approval and existing-host scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "operationReact/AiTradingSystem"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$AWS_ACCOUNT" = "098859530205"
          test "$AWS_REGION" = "ap-south-1"
          test "$INSTANCE_ID" = "i-09c01b470fb39b85a"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$APPROVAL_REQUEST"
          python3 infra/ec2-paper/verify_group_schedule_recovery.py request "$APPROVAL_REQUEST"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Assume narrowly restricted existing PAPER OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-provision
          role-session-name: finish-paper-stopped-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ap-south-1

      - name: Verify exact instance stopped, expected network and encrypted 35 GiB EBS
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT"
          aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0]' --output json > "$RUNNER_TEMP/existing-instance.json"
          python3 - "$RUNNER_TEMP/existing-instance.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          tags={t["Key"]:t["Value"] for t in x.get("Tags",[])}
          mappings=x.get("BlockDeviceMappings",[])
          if (x.get("InstanceId")!="i-09c01b470fb39b85a"
              or x.get("InstanceType")!="t4g.medium"
              or x.get("State",{}).get("Name")!="stopped"
              or x.get("VpcId")!="vpc-04712728d857bb782"
              or x.get("SubnetId")!="subnet-071ee24263e10fe7c"
              or x.get("MetadataOptions",{}).get("HttpTokens")!="required"
              or tags.get("Application")!="ai-trading-system"
              or tags.get("Environment")!="paper"
              or tags.get("Name")!="aitradingsystem-paper-ec2"
              or len(mappings)!=1 or not mappings[0].get("Ebs",{}).get("VolumeId")
              or mappings[0]["Ebs"].get("DeleteOnTermination") is not False):
              raise SystemExit("Existing stopped PAPER EC2 does not match immutable pilot scope")
          print("Existing stopped PAPER EC2 identity, network, IMDSv2 and persistent EBS mapping PASS")
          PY
          volume_id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["BlockDeviceMappings"][0]["Ebs"]["VolumeId"])' "$RUNNER_TEMP/existing-instance.json")"
          aws ec2 describe-volumes --region "$AWS_REGION" --volume-ids "$volume_id" \
            --query 'Volumes[0]' --output json > "$RUNNER_TEMP/existing-volume.json"
          python3 - "$RUNNER_TEMP/existing-volume.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          if (x.get("Size")!=35 or x.get("VolumeType")!="gp3"
              or x.get("Encrypted") is not True or x.get("State")!="in-use"
              or len(x.get("Attachments",[]))!=1
              or x["Attachments"][0].get("InstanceId")!="i-09c01b470fb39b85a"):
              raise SystemExit("Existing EBS encryption, 35 GiB, gp3 or attachment mismatch")
          print("Encrypted persistent 35 GiB gp3 volume attached to exact stopped PAPER EC2")
          PY
          shutdown="$(aws ec2 describe-instance-attribute --region "$AWS_REGION" \
            --instance-id "$INSTANCE_ID" --attribute instanceInitiatedShutdownBehavior \
            --query 'InstanceInitiatedShutdownBehavior.Value' --output text)"
          termination="$(aws ec2 describe-instance-attribute --region "$AWS_REGION" \
            --instance-id "$INSTANCE_ID" --attribute disableApiTermination \
            --query 'DisableApiTermination.Value' --output text)"
          test "$shutdown" = "stop"
          test "$termination" = "True"
          existing="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Application,Values=ai-trading-system \
                      Name=tag:Environment,Values=paper \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          test "$existing" = "$INSTANCE_ID" || {
            echo "::error::Multiple or different project instances present; no recovery"
            exit 1
          }
          echo "Exact stopped instance, shutdown behavior and termination protection verified"

      - name: Verify stop-only policy exists, old schedule-specific role trust and no schedule
        shell: bash
        run: |
          set -euo pipefail
          aws iam get-role --role-name aitrading-paper-daily-stop \
            --query 'Role.AssumeRolePolicyDocument' --output json > "$RUNNER_TEMP/old-stop-trust.json"
          aws iam get-role-policy --role-name aitrading-paper-daily-stop \
            --policy-name only-stop-aitrading-paper --query PolicyDocument \
            --output json > "$RUNNER_TEMP/existing-stop-policy.json"
          python3 - "$RUNNER_TEMP/old-stop-trust.json" "$RUNNER_TEMP/existing-stop-policy.json" <<'PY'
          import json,sys
          t=json.load(open(sys.argv[1],encoding="utf-8"))
          p=json.load(open(sys.argv[2],encoding="utf-8"))
          x=t.get("Statement",[])
          condition=x[0].get("Condition",{}) if len(x)==1 else {}
          if (len(x)!=1
              or x[0].get("Principal")!={"Service":"scheduler.amazonaws.com"}
              or x[0].get("Action")!="sts:AssumeRole"
              or condition!={"StringEquals":{"aws:SourceAccount":"098859530205"},"ArnEquals":{"aws:SourceArn":"arn:aws:scheduler:ap-south-1:098859530205:schedule/default/aitrading-paper-nightly-stop"}}):
              raise SystemExit("Existing stop role trust differs from audited previous failure")
          st=p.get("Statement",[])
          if (len(st)!=1 or st[0].get("Effect")!="Allow"
              or st[0].get("Action")!="ec2:StopInstances"
              or st[0].get("Resource")!="arn:aws:ec2:ap-south-1:098859530205:instance/i-09c01b470fb39b85a"
              or st[0].get("Condition",{}).get("StringEquals")!={"ec2:ResourceTag/Application":"ai-trading-system","ec2:ResourceTag/Environment":"paper"}):
              raise SystemExit("Existing role policy not restricted to stop only exact PAPER host")
          print("Exact prior trust and stop-only IAM policy independently verified")
          PY
          if aws scheduler get-schedule --region "$AWS_REGION" --name aitrading-paper-nightly-stop \
             > "$RUNNER_TEMP/schedule-existing.json" 2> "$RUNNER_TEMP/schedule-error.txt"; then
            echo "::error::Schedule already exists; no duplicate creation"
            exit 1
          elif ! grep -q 'ResourceNotFoundException' "$RUNNER_TEMP/schedule-error.txt"; then
            echo "::error::Unable to verify missing schedule"
            exit 1
          fi
          echo "One IAM trust repair and one schedule creation remain"

      - name: Lock and verify exact one IAM trust update and one new schedule plan
        working-directory: infra/ec2-paper
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/paper-group-trust-$GITHUB_RUN_ID"
          mkdir -m 0700 "$work"
          echo "PLAN_WORKDIR=$work" >> "$GITHUB_ENV"
          terraform fmt -check
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform validate -no-color
          terraform state list -no-color > "$work/state-addresses.txt"
          python3 verify_group_schedule_recovery.py state "$work/state-addresses.txt"
          # No pre-plan Terraform state writes, no targeting, no ignore-all.
          terraform plan -input=false -no-color -lock=true -lock-timeout=2m -refresh=true \
            -var="approve_paid_provision=PROVISION_PAPER_EC2_4GB" \
            -var="instance_type=t4g.medium" \
            -var="root_volume_gib=35" \
            -var="daily_stop_hour_ist=22" \
            -var="daily_stop_enabled=true" \
            -out="$work/approved.tfplan"
          terraform show -json "$work/approved.tfplan" > "$work/approved-plan.json"
          python3 verify_group_schedule_recovery.py plan "$work/approved-plan.json"
          echo "Only exact stop-role trust update and one stop schedule creation approved"

      - name: Apply exact reviewed role-trust and schedule saved Terraform plan
        working-directory: infra/ec2-paper
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PLAN_WORKDIR/approved.tfplan"
          python3 verify_group_schedule_recovery.py plan "$PLAN_WORKDIR/approved-plan.json"
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          terraform apply -input=false -no-color -lock=true -lock-timeout=2m \
            "$PLAN_WORKDIR/approved.tfplan"
          echo "Updated stop-role trust and created nightly schedule; EC2 was never started"

      - name: Verify actual IAM policy, EventBridge schedule, and EC2 still stopped
        shell: bash
        run: |
          set -euo pipefail
          aws iam get-role --role-name aitrading-paper-daily-stop \
            --query 'Role.AssumeRolePolicyDocument' --output json > "$PLAN_WORKDIR/new-stop-trust.json"
          aws iam get-role-policy --role-name aitrading-paper-daily-stop \
            --policy-name only-stop-aitrading-paper --query PolicyDocument \
            --output json > "$PLAN_WORKDIR/stop-iam.json"
          aws scheduler get-schedule --region "$AWS_REGION" --name aitrading-paper-nightly-stop \
            --query '{State:State,Expression:ScheduleExpression,Timezone:ScheduleExpressionTimezone,Target:Target}' \
            --output json > "$PLAN_WORKDIR/stop-schedule.json"
          python3 - "$PLAN_WORKDIR/new-stop-trust.json" "$PLAN_WORKDIR/stop-iam.json" "$PLAN_WORKDIR/stop-schedule.json" <<'PY'
          import json,sys
          trust=json.load(open(sys.argv[1],encoding="utf-8"))
          ts=trust.get("Statement",[])
          if (len(ts)!=1 or ts[0].get("Principal")!={"Service":"scheduler.amazonaws.com"}
              or ts[0].get("Action")!="sts:AssumeRole"
              or ts[0].get("Condition",{})!={"StringEquals":{"aws:SourceAccount":"098859530205","aws:SourceArn":"arn:aws:scheduler:ap-south-1:098859530205:schedule-group/default"}}):
              raise SystemExit("Actual corrected role trust must match default Scheduler group only")
          p=json.load(open(sys.argv[2],encoding="utf-8"))
          statement=p.get("Statement",[])
          if (len(statement)!=1 or statement[0].get("Effect")!="Allow"
              or statement[0].get("Action")!="ec2:StopInstances"
              or statement[0].get("Resource")!="arn:aws:ec2:ap-south-1:098859530205:instance/i-09c01b470fb39b85a"
              or statement[0].get("Condition",{}).get("StringEquals")!={"ec2:ResourceTag/Application":"ai-trading-system","ec2:ResourceTag/Environment":"paper"}):
              raise SystemExit("Actual IAM policy is not exact stop-only")
          s=json.load(open(sys.argv[3],encoding="utf-8"))
          t=s.get("Target",{})
          if (s.get("State")!="ENABLED"
              or s.get("Expression")!="cron(0 22 * * ? *)"
              or s.get("Timezone")!="Asia/Kolkata"
              or t.get("Arn")!="arn:aws:scheduler:::aws-sdk:ec2:stopInstances"
              or t.get("RoleArn")!="arn:aws:iam::098859530205:role/aitrading-paper-daily-stop"
              or json.loads(t.get("Input","null"))!={"InstanceIds":["i-09c01b470fb39b85a"]}):
              raise SystemExit("Actual nightly schedule does not stop exact PAPER instance")
          print("Actual AWS schedule-group trust, stop-only IAM and enabled 22:00 Asia/Kolkata schedule verified")
          PY
          state="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          test "$state" = "stopped" || {
            echo "::error::Existing PAPER host was started unexpectedly"
            exit 1
          }
          echo "PAPER EC2 remains stopped; zero application or broker execution"

      - name: Fail-safe stop exact PAPER instance if deployment fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test "$(aws sts get-caller-identity --query Account --output text)" != "$AWS_ACCOUNT"; then
            echo "::warning::No authenticated AWS role for emergency status check"
            exit 0
          fi
          state="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          if test "$state" = "running" || test "$state" = "pending"; then
            aws ec2 stop-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" >/dev/null
            echo "Fail-safe stop requested for exact PAPER instance"
          else
            echo "No compute action needed: exact host state $state"
          fi

      - name: Delete ephemeral Terraform plans, protected state inspection, and IAM observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${PLAN_WORKDIR:-}" && test -d "$PLAN_WORKDIR"; then
            rm -rf -- "$PLAN_WORKDIR"
          fi
          rm -f -- "$RUNNER_TEMP/existing-instance.json" "$RUNNER_TEMP/existing-volume.json" \
            "$RUNNER_TEMP/schedule-existing.json" "$RUNNER_TEMP/schedule-error.txt" \
            "$RUNNER_TEMP/stop-policy-existing.json" "$RUNNER_TEMP/policy-error.txt"

# Deliberately NO EC2 RunInstances, StartInstances or Terraform destroy.
# No application containers, LIVE orders, broker keys, Terraform state artifacts or public ingress.
