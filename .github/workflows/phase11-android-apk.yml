name: Phase 11 - Android APK delivery

on:
  push:
    branches: [dev]
    paths:
      - 'infra/minttick-domain/requests/android-cognito-test.json'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/trading_client/**'
      - '.github/workflows/phase11-android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS base URL reachable from the physical Android device (for example https://api.example.com)'
        required: true
        type: string
      cognito_user_pool_id:
        description: 'Cognito User Pool ID from the MintTick Terraform output (ap-south-1_...)'
        required: true
        type: string
      cognito_client_id:
        description: 'Cognito public Flutter app client ID; never a client secret'
        required: true
        type: string

concurrency:
  group: phase11-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/trading_client
    env:
      API_BASE_URL: ${{ github.event_name == 'push' && 'https://api.minttick.com' || (github.event_name == 'workflow_dispatch' && inputs.api_base_url || 'https://apk-ci.invalid') }}
      MINTTICK_COGNITO_USER_POOL_ID: ${{ github.event_name == 'push' && 'ap-south-1_jz2T8qbiY' || (github.event_name == 'workflow_dispatch' && inputs.cognito_user_pool_id || '') }}
      MINTTICK_COGNITO_CLIENT_ID: ${{ github.event_name == 'push' && '6jm18v2mdpcfraip92hrjhqjnd' || (github.event_name == 'workflow_dispatch' && inputs.cognito_client_id || '') }}
      MINTTICK_AUTH_ONLY_TEST: ${{ github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require exact reviewed Cognito-only one-file build request
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "operationReact/AiTradingSystem"
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/minttick-domain/requests/android-cognito-test.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          document=json.loads(Path('infra/minttick-domain/requests/android-cognito-test.json').read_text())
          expected={
              "application":"MintTick",
              "environment":"dev",
              "operation":"build-cognito-only-android-test",
              "public_api_ready":False,
              "cognito_pool":"ap-south-1_jz2T8qbiY",
              "authorization":"USER_APPROVED_ANDROID_COGNITO_TEST_2026-11-07"
          }
          assert document == expected, "Unexpected Android identity-only build request"
          source=Path('apps/trading_client/lib/src/presentation/welcome_page.dart').read_text()
          assert "MINTTICK_AUTH_ONLY_TEST" in source
          assert "pushNamedAndRemoveUntil('/auth-test'" in source
          assert "await MintTickCustomerAccountApi().provision()" in source
          status=Path('apps/trading_client/lib/src/presentation/cognito_test_page.dart').read_text()
          assert "Trading rooms and brokerage actions are unavailable" in status
          main=Path('apps/trading_client/lib/main.dart').read_text()
          assert "cognitoTestSession" in main
          PY
          echo "PASS: authenticated-only Android test gate, no fake customer dashboard"

      - name: Validate physical-device API endpoint
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          import re

          raw = os.environ['API_BASE_URL'].strip()
          parsed = urlparse(raw)
          blocked = {'localhost', '127.0.0.1', '0.0.0.0', '10.0.2.2', '::1'}
          if parsed.scheme != 'https' or not parsed.hostname:
              raise SystemExit('api_base_url must be an absolute HTTPS URL reachable from the Android phone')
          if parsed.hostname.lower() in blocked:
              raise SystemExit('api_base_url cannot target localhost or the Android-emulator host alias')
          pool = os.environ['MINTTICK_COGNITO_USER_POOL_ID'].strip()
          client = os.environ['MINTTICK_COGNITO_CLIENT_ID'].strip()
          if not re.fullmatch(r'ap-south-1_[A-Za-z0-9]+', pool):
              raise SystemExit('cognito_user_pool_id must be a Mumbai Cognito pool ID')
          if not re.fullmatch(r'[a-z0-9]{16,}', client):
              raise SystemExit('cognito_client_id must be a public Cognito app client ID')
          print(f'Validated physical-device endpoint: {parsed.scheme}://{parsed.hostname}')
          print('Validated public Cognito User Pool and client identifiers (no secrets)')
          PY

      - name: Verify live HTTPS account API before packaging device APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: python3 scripts/verify_minttick_live_api.py

      - name: Mark CI-only endpoint
        if: github.event_name == 'pull_request'
        run: echo 'PR validation builds the APK with a non-routable placeholder URL; it proves packaging only.'

      - name: Explicitly mark Cognito-only sideloadable test release
        if: github.event_name == 'push'
        run: echo 'Cognito is real. Customer backend activation is pending; this test never grants trading access.'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Restore modern Android v2 scaffold
        run: |
          flutter create --platforms=android --project-name trading_client --org in.aitradingsystem .
          test -f android/gradlew
          test -f android/settings.gradle.kts
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/kotlin/in/aitradingsystem/trading_client/MainActivity.kt
          grep -q 'android:value="2"' android/app/src/main/AndroidManifest.xml

      - name: Normalize generated Android Gradle compatibility
        run: |
          grep -q '^android.newDsl=' android/gradle.properties || echo 'android.newDsl=false' >> android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_path = Path('android/app/build.gradle.kts')
          gradle_text = gradle_path.read_text()
          updated, count = re.subn(
              r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*JavaVersion\.VERSION_17\.toString\(\)\s*\}\s*',
              '\n',
              gradle_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected generated kotlinOptions JVM target block was not found')

          modern_kotlin = '''\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n\n'''
          marker = 'flutter {'
          if marker not in updated:
              raise SystemExit('Expected generated Flutter Gradle block was not found')
          updated = updated.replace(marker, modern_kotlin + marker, 1)
          gradle_path.write_text(updated)
          # Cognito's AWS crypto dependency (Tink) references these runtime
          # annotation classes; R8 requires the types to be present. Never
          # disable shrinker checks or use blanket -dontwarn rules.
          updated = gradle_path.read_text()
          updated += '''
          dependencies {
              implementation("com.google.errorprone:error_prone_annotations:2.36.0")
              implementation("com.google.code.findbugs:jsr305:3.0.2")
          }
          '''
          gradle_path.write_text(updated)

          activity_path = Path('android/app/src/main/kotlin/in/aitradingsystem/trading_client/MainActivity.kt')
          activity_text = activity_path.read_text()
          expected = 'package in.aitradingsystem.trading_client'
          if expected not in activity_text:
              raise SystemExit('Expected generated MainActivity package declaration was not found')
          activity_path.write_text(activity_text.replace(expected, 'package `in`.aitradingsystem.trading_client', 1))

          # Flutter's generated release manifest may omit INTERNET permission.
          # A customer authentication APK cannot contact Cognito or MintTick without it.
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in manifest:
              root_close = manifest.find('>', manifest.find('<manifest'))
              if root_close == -1:
                  raise SystemExit('Generated Android manifest has no <manifest> root')
              manifest = manifest[:root_close + 1] + '\n    ' + permission + manifest[root_close + 1:]
              manifest_path.write_text(manifest)
          # The generated wrapper's default Gradle CDN redirects to GitHub Releases,
          # which has returned HTTP 504. Use Gradle's direct official CDN with
          # a checksum independently published at gradle.org/release-checksums/.
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_text = wrapper.read_text()
          expected = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip'
          direct = 'distributionUrl=https\\://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip'
          if expected not in wrapper_text:
              raise SystemExit('Unexpected generated Gradle version')
          if 'distributionSha256Sum=' in wrapper_text:
              raise SystemExit('Unexpected existing wrapper checksum')
          checksum = 'distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06'
          wrapper.write_text(wrapper_text.replace(expected, direct, 1).rstrip() + '\n' + checksum + '\n')
          PY
          grep -q '^android.newDsl=false$' android/gradle.properties
          grep -q 'compilerOptions' android/app/build.gradle.kts
          ! grep -q 'kotlinOptions' android/app/build.gradle.kts
          grep -q 'package `in`\.aitradingsystem\.trading_client' android/app/src/main/kotlin/in/aitradingsystem/trading_client/MainActivity.kt
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -Fq 'downloads.gradle.org/distributions/gradle-9.3.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06' android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build sideloadable release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MINTTICK_COGNITO_REGION=ap-south-1 \
            --dart-define=MINTTICK_COGNITO_USER_POOL_ID="$MINTTICK_COGNITO_USER_POOL_ID" \
            --dart-define=MINTTICK_COGNITO_CLIENT_ID="$MINTTICK_COGNITO_CLIENT_ID" \
            --dart-define=MINTTICK_AUTH_ONLY_TEST="$MINTTICK_AUTH_ONLY_TEST"

      - name: Record APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'MintTick-Cognito-Android-Test' || 'ai-trading-android' }}-${{ github.sha }}${{ github.event_name == 'pull_request' && '-ci-validation-only' || '' }}
          path: |
            apps/trading_client/build/app/outputs/flutter-apk/app-release.apk
            apps/trading_client/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
 android/gradle.properties
          grep -q 'compilerOptions' android/app/build.gradle.kts
          ! grep -q 'kotlinOptions' android/app/build.gradle.kts
          grep -q 'package `in`\.aitradingsystem\.trading_client' android/app/src/main/kotlin/in/aitradingsystem/trading_client/MainActivity.kt
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build sideloadable release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MINTTICK_COGNITO_REGION=ap-south-1 \
            --dart-define=MINTTICK_COGNITO_USER_POOL_ID="$MINTTICK_COGNITO_USER_POOL_ID" \
            --dart-define=MINTTICK_COGNITO_CLIENT_ID="$MINTTICK_COGNITO_CLIENT_ID" \
            --dart-define=MINTTICK_AUTH_ONLY_TEST="$MINTTICK_AUTH_ONLY_TEST"

      - name: Record APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'MintTick-Cognito-Android-Test' || 'ai-trading-android' }}-${{ github.sha }}${{ github.event_name == 'pull_request' && '-ci-validation-only' || '' }}
          path: |
            apps/trading_client/build/app/outputs/flutter-apk/app-release.apk
            apps/trading_client/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
