name: Phase 3 - Backtest Studio completion gate

on:
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/in/aitradingsystem/backtest/**'
      - 'backend/src/main/java/in/aitradingsystem/api/PaperBacktestController.java'
      - 'backend/src/test/java/in/aitradingsystem/backtest/**'
      - '.github/workflows/phase3-backtest-gate.yml'
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/in/aitradingsystem/backtest/**'
      - 'backend/src/main/java/in/aitradingsystem/api/PaperBacktestController.java'
      - 'backend/src/test/java/in/aitradingsystem/backtest/**'
      - '.github/workflows/phase3-backtest-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-phase-evidence:
    name: P3 backend persistence + leakage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Backtest Studio API persistence and leakage regression tests
        run: mvn -B -Dtest=BacktestStudioApiIT,LookAheadBiasRegressionTest test

  browser-e2e:
    name: E2E-P3 Pro + Clear responsive browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Install pinned gate-only Playwright and axe tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Start Vite test server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ats-vite.log 2>&1 &
          echo $! > /tmp/ats-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/backtesting >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ats-vite.log
          exit 1
      - name: Run E2E-P3 config→run→result→compare
        run: npx playwright test e2e/backtest-studio.spec.mjs --reporter=line
      - name: Upload P3 screenshot/test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03-backtest-studio-e2e-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
