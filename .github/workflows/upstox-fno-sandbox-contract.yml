name: Upstox F&O sandbox-only order lifecycle contract

on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/upstox_fno_sandbox_lifecycle.py'
      - 'scripts/upstox_fno_sandbox_ssm.py'
      - 'scripts/tests/test_upstox_fno_sandbox_lifecycle.py'
      - 'scripts/tests/test_upstox_fno_sandbox_ssm.py'
      - '.github/workflows/upstox-fno-sandbox-contract.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Only SANDBOX_ONLY authorizes the non-funded provider test'
        required: true
        type: choice
        options: [DO_NOT_EXECUTE, SANDBOX_ONLY]
      instrument_key:
        description: 'Source-verified NSE_FO sandbox instrument key'
        required: true
        type: string
      quantity:
        description: 'Broker units, not lots'
        required: true
        type: number
      price:
        description: 'Positive LIMIT order price aligned to contract tick'
        required: true
        type: string
      tick:
        description: 'Contract minimum tick, e.g. 0.05'
        required: true
        type: string

permissions:
  contents: read

jobs:
  local-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run zero-network sandbox contract tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upstox_fno_sandbox_lifecycle.py scripts/upstox_fno_sandbox_ssm.py
          python3 -m unittest discover -s scripts/tests -p 'test_upstox_fno_sandbox*.py' -v
          python3 scripts/upstox_fno_sandbox_lifecycle.py

  provider-sandbox:
    # Deliberately manual, non-funded test. No push or PR event can reach Upstox.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.confirmation == 'SANDBOX_ONLY'
    needs: local-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No job environment override: the dedicated IAM role is locked to the
    # customized dev-ref GitHub OIDC subject (verified in run 45198291007).
    # Manual dispatch still requires SANDBOX_ONLY, the dev branch, sandbox
    # token IAM role, and the separate local-contract prerequisite.
    permissions:
      contents: read
      id-token: write
    env:
      SANDBOX_CONFIRMATION: ${{ inputs.confirmation }}
      SANDBOX_INSTRUMENT_KEY: ${{ inputs.instrument_key }}
      SANDBOX_QUANTITY: ${{ inputs.quantity }}
      SANDBOX_PRICE: ${{ inputs.price }}
      SANDBOX_TICK: ${{ inputs.tick }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assume dedicated least-privilege sandbox SSM reader role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/minttick-upstox-sandbox-ssm-reader
          aws-region: ap-south-1
          role-session-name: upstox-sandbox-${{ github.run_id }}
      - name: Read exact SecureString in memory and test sandbox orders
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 scripts/upstox_fno_sandbox_ssm.py \
            --instrument-key "$SANDBOX_INSTRUMENT_KEY" \
            --quantity "$SANDBOX_QUANTITY" \
            --price "$SANDBOX_PRICE" \
            --tick "$SANDBOX_TICK"
