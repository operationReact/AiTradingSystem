name: Provision live AWS infrastructure

on:
  push:
    branches: [dev]
    paths:
      - 'infra/live-bootstrap.request'
  workflow_dispatch:
    inputs:
      enable_https:
        description: 'Enable HTTPS after Route 53 nameservers are delegated'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-live-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  LIVE_DOMAIN: maargglobal.com
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  provision:
    name: Terraform apply live infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve provisioning mode
        id: mode
        env:
          DISPATCH_HTTPS: ${{ github.event.inputs.enable_https }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ENABLE_HTTPS="${DISPATCH_HTTPS}"
          else
            ENABLE_HTTPS="$(sed -n 's/^enable_https=//p' infra/live-bootstrap.request | tail -n 1)"
          fi
          test "$ENABLE_HTTPS" = "true" -o "$ENABLE_HTTPS" = "false" || { echo "::error::enable_https must be true or false"; exit 1; }
          echo "enable_https=$ENABLE_HTTPS" >> "$GITHUB_OUTPUT"
          echo "Provisioning live domain $LIVE_DOMAIN in $AWS_REGION with enable_https=$ENABLE_HTTPS"
      - name: Validate existing GitHub OIDC deployment role
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN" || { echo "::error::Repository variable AWS_ROLE_ARN is required"; exit 1; }
          test "$LIVE_DOMAIN" = "maargglobal.com" || { echo "::error::Unexpected live domain"; exit 1; }
          test "$AWS_REGION" = "us-east-1" || { echo "::error::Live AWS region must be us-east-1"; exit 1; }
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-live-infra-${{ github.run_id }}
          allowed-account-ids: '816344830716'
          action-timeout-s: 120
      - name: Discover AWS account
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
      - name: Ensure ECS service-linked role
        run: |
          set -euo pipefail
          if aws iam get-role --role-name AWSServiceRoleForECS >/dev/null 2>&1; then
            echo "AWSServiceRoleForECS already exists"
          else
            echo "Creating AWSServiceRoleForECS"
            aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/dev/null
          fi
          for attempt in {1..12}; do
            if aws iam get-role --role-name AWSServiceRoleForECS >/dev/null 2>&1; then
              echo "AWSServiceRoleForECS is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::AWSServiceRoleForECS was not available after creation"
          exit 1
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Use pre-provisioned remote state bucket
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          STATE_BUCKET="aitradingsystem-tfstate-${ACCOUNT_ID}-${AWS_REGION}"
          echo "STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"
          echo "Using pre-provisioned Terraform state bucket: $STATE_BUCKET"
      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=live/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform validate
      - name: Terraform plan
        working-directory: infra/terraform
        env:
          ENABLE_HTTPS: ${{ steps.mode.outputs.enable_https }}
        run: |
          set -euo pipefail
          terraform plan \
            -var="aws_region=${AWS_REGION}" \
            -var="domain_name=${LIVE_DOMAIN}" \
            -var="enable_https=${ENABLE_HTTPS}" \
            -out=tfplan
      - name: Terraform apply reviewed plan
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan
      - name: Publish infrastructure outputs
        working-directory: infra/terraform
        run: |
          APP_URL="$(terraform output -raw application_url)"
          echo "Application URL: $APP_URL"
          echo "Route 53 nameservers:"
          terraform output -json route53_nameservers | jq -r '.[]'
          echo '### Live infrastructure outputs' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "**Application URL:** $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**Route 53 nameservers:**' >> "$GITHUB_STEP_SUMMARY"
          terraform output -json route53_nameservers | jq -r '.[] | "- `\(.)`"' >> "$GITHUB_STEP_SUMMARY"
