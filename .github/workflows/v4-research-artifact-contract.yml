name: V4 research artifact Java-Python contract (synthetic, not runtime acceptance)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/main/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/main/java/in/aitradingsystem/api/Research*'
      - 'backend/src/main/resources/db/migration/V6*'
      - 'backend/src/test/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/test/java/in/aitradingsystem/api/Research*'
      - 'intelligence/src/aitrading_intelligence/**'
      - 'intelligence/tests/**'
      - 'intelligence/pyproject.toml'
      - 'intelligence/scripts/build_v4_synthetic_worker_manifest.py'
      - '.github/workflows/v4-research-artifact-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/main/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/main/java/in/aitradingsystem/api/Research*'
      - 'backend/src/main/resources/db/migration/V6*'
      - 'backend/src/test/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/test/java/in/aitradingsystem/api/Research*'
      - 'intelligence/src/aitrading_intelligence/**'
      - 'intelligence/tests/**'
      - 'intelligence/pyproject.toml'
      - 'intelligence/scripts/build_v4_synthetic_worker_manifest.py'
      - '.github/workflows/v4-research-artifact-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-artifact-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-python-artifact-inference:
    name: Synthetic trained CatBoost/LightGBM FastAPI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: intelligence/pyproject.toml
      - name: Install pinned model and API dependencies
        working-directory: intelligence
        run: pip install -e '.[dev]'
      - name: Lint actual inference and tests
        working-directory: intelligence
        run: ruff check src/aitrading_intelligence/research_artifact_inference.py tests/test_research_artifact_inference.py
      - name: Train tiny synthetic artifacts and exercise actual FastAPI scoring
        working-directory: intelligence
        run: pytest -q tests/test_research_artifact_inference.py

  java-worker-contract:
    name: Java canonical hashing, authentication and no-retry orchestration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Java synthetic Python wire golden, negative auth and roster tests
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=ResearchArtifactInferenceClientTest,ResearchInferenceDispatchServiceTest,ResearchRosterDispatchServiceTest
          test

  java-to-real-python-http:
    name: Java HTTP and Spring/PostgreSQL roster to running Python (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: intelligence/pyproject.toml
      - name: Install real Python trained-artifact worker
        working-directory: intelligence
        run: pip install -e '.[dev]'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Train ephemeral synthetic artifacts and run Java-to-Python HTTP
        env:
          ATS_V4_REAL_HTTP_SMOKE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          worker_pid=""
          cleanup() {
            if [[ -n "$worker_pid" ]]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            rm -rf "$temporary"
          }
          trap cleanup EXIT

          chmod 700 "$temporary"
          python intelligence/scripts/build_v4_synthetic_worker_manifest.py "$temporary"
          export AI_RESEARCH_MODEL_MANIFEST="$temporary/manifest.json"
          export AI_RESEARCH_WORKER_TOKEN="ci-local-synthetic-$(openssl rand -hex 32)"
          export ATS_V4_RESEARCH_SMOKE_TOKEN="$AI_RESEARCH_WORKER_TOKEN"
          export ATS_V4_RESEARCH_SMOKE_MANIFEST="$AI_RESEARCH_MODEL_MANIFEST"
          export ATS_V4_RESEARCH_SMOKE_BASE_URL="http://127.0.0.1:18721"

          python -m uvicorn aitrading_intelligence.app:app \
            --host 127.0.0.1 --port 18721 --no-access-log \
            > "$temporary/worker.log" 2>&1 &
          worker_pid=$!
          healthy=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 1 \
              http://127.0.0.1:18721/health > /dev/null; then
              healthy=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if [[ "$healthy" != 1 ]]; then
            echo "Runner-local Python trained-artifact worker failed startup"
            exit 1
          fi
          cd backend
          mvn --batch-mode --no-transfer-progress \
            -Dtest=ResearchArtifactLiveWorkerSmokeTest test

          # V67 extends the same real worker with an isolated ephemeral
          # PostgreSQL instance. Only synthetic V56–V63 evidence is inserted.
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-client
          fi
          sudo systemctl start postgresql
          if ! sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='aitrading'" | grep -qx 1; then
            sudo -u postgres psql -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE aitrading LOGIN PASSWORD 'aitrading';"
          else
            sudo -u postgres psql -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE aitrading WITH LOGIN PASSWORD 'aitrading';"
          fi
          sudo -u postgres dropdb --if-exists aitrading_v4_realworker
          sudo -u postgres createdb --owner=aitrading aitrading_v4_realworker
          export ATS_TEST_POSTGRES_JDBC_URL="jdbc:postgresql://127.0.0.1:5432/aitrading_v4_realworker"
          export ATS_TEST_POSTGRES_USERNAME=aitrading
          export ATS_TEST_POSTGRES_PASSWORD=aitrading
          mvn --batch-mode --no-transfer-progress \
            -Dtest=ResearchRealWorkerFullRosterIT test

# The loopback integration uses real Java HTTP and a real Python process on
# one CI runner with synthetic lab data. It is not a deployed production
# service, independent licensed Indian-market feed, broker or LIVE acceptance.
