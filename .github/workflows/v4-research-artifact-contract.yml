name: V4 research artifact Java-Python contract (synthetic, not runtime acceptance)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/main/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/main/java/in/aitradingsystem/api/Research*'
      - 'backend/src/main/resources/db/migration/V6*'
      - 'backend/src/test/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/test/java/in/aitradingsystem/api/Research*'
      - 'intelligence/src/aitrading_intelligence/**'
      - 'intelligence/tests/**'
      - 'intelligence/scripts/create_v4_http_smoke_artifacts.py'
      - 'intelligence/pyproject.toml'
      - '.github/workflows/v4-research-artifact-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'backend/src/main/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/main/java/in/aitradingsystem/api/Research*'
      - 'backend/src/main/resources/db/migration/V6*'
      - 'backend/src/test/java/in/aitradingsystem/intelligence/**'
      - 'backend/src/test/java/in/aitradingsystem/api/Research*'
      - 'intelligence/src/aitrading_intelligence/**'
      - 'intelligence/tests/**'
      - 'intelligence/scripts/create_v4_http_smoke_artifacts.py'
      - 'intelligence/pyproject.toml'
      - '.github/workflows/v4-research-artifact-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-artifact-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-python-artifact-inference:
    name: Synthetic trained CatBoost/LightGBM FastAPI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: intelligence/pyproject.toml
      - name: Install pinned model and API dependencies
        working-directory: intelligence
        run: pip install -e '.[dev]'
      - name: Lint actual inference and tests
        working-directory: intelligence
        run: ruff check src/aitrading_intelligence/research_artifact_inference.py tests/test_research_artifact_inference.py scripts/create_v4_http_smoke_artifacts.py
      - name: Train tiny synthetic artifacts and exercise actual FastAPI scoring
        working-directory: intelligence
        run: pytest -q tests/test_research_artifact_inference.py

  java-worker-contract:
    name: Java canonical hashing, authentication and no-retry orchestration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Java synthetic Python wire golden, negative auth and roster tests
        working-directory: backend
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=ResearchArtifactInferenceClientTest,ResearchInferenceDispatchServiceTest,ResearchRosterDispatchServiceTest
          test


  real-java-python-loopback-http:
    name: Actual Java HttpClient to Python uvicorn synthetic artifact scoring
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: intelligence/pyproject.toml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install real CatBoost/LightGBM and FastAPI worker
        working-directory: intelligence
        run: pip install -e '.[dev]'

      - name: Train ephemeral allowlisted artifacts and test real Java-to-Python HTTP
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/v4-worker-http-smoke"
          mkdir -p "$workdir"
          worker_pid=""
          cleanup() {
            if [[ -n "$worker_pid" ]]; then
              kill "$worker_pid" 2>/dev/null || true
              wait "$worker_pid" 2>/dev/null || true
            fi
            rm -rf -- "$workdir"
          }
          trap cleanup EXIT
          cd intelligence
          python scripts/create_v4_http_smoke_artifacts.py "$workdir"
          export AI_RESEARCH_MODEL_MANIFEST="$workdir/manifest.json"
          export AI_RESEARCH_WORKER_TOKEN
          AI_RESEARCH_WORKER_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$AI_RESEARCH_WORKER_TOKEN"
          python -m uvicorn aitrading_intelligence.app:app \
            --host 127.0.0.1 --port 18771 --no-access-log \
            >"$workdir/worker.log" 2>&1 &
          worker_pid="$!"
          ready=0
          for attempt in $(seq 1 90); do
            if curl --noproxy '*' --max-time 1 -fsS \
                http://127.0.0.1:18771/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [[ "$ready" != 1 ]]; then
            echo "Python research worker never became healthy"
            cat "$workdir/worker.log"
            exit 1
          fi
          export V4_WORKER_HTTP_SMOKE=true
          export V4_WORKER_HTTP_URL="http://127.0.0.1:18771"
          export V4_WORKER_HTTP_TOKEN="$AI_RESEARCH_WORKER_TOKEN"
          export V4_WORKER_HTTP_MANIFEST="$AI_RESEARCH_MODEL_MANIFEST"
          cd ../backend
          mvn --batch-mode --no-transfer-progress \
            -Dtest=ResearchArtifactWorkerLiveHttpTest test

# Loopback only. Neither this smoke nor the independent unit contract job
# certifies licensed Indian-market inputs, deployed/managed Python services,
# registered Java V56 source custody, PAPER economic acceptance or LIVE trading.

# These jobs now include a genuine local HTTP exchange between the production
# Java adapter and a short-lived Python worker using synthetic trained weights.
# They still provide no remote deployment, licensed feed or LIVE acceptance.
