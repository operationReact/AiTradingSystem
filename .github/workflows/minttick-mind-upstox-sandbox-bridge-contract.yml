name: Mintick Mind to Upstox Sandbox signal contract (no broker)
on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/minttick_mind_upstox_sandbox_bridge.py'
      - 'scripts/tests/test_minttick_mind_upstox_sandbox_bridge.py'
      - '.github/workflows/minttick-mind-upstox-sandbox-bridge-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/minttick_mind_upstox_sandbox_bridge.py'
      - 'scripts/tests/test_minttick_mind_upstox_sandbox_bridge.py'
      - '.github/workflows/minttick-mind-upstox-sandbox-bridge-contract.yml'
permissions:
  contents: read
jobs:
  no-network-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit-test isolated Mind research -> sandbox signal mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/minttick_mind_upstox_sandbox_bridge.py
          python3 -m unittest discover -s scripts/tests -p 'test_minttick_mind_upstox_sandbox_bridge.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_upstox_fno_sandbox*.py' -v
