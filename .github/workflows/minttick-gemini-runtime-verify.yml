name: MintTick Gemini one-call runtime verification

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-gemini-runtime-verify.yml'
      - 'infra/ec2-paper/gemini_runtime_verify.py'
      - 'infra/ec2-paper/requests/gemini-runtime-verify.json'
      - 'scripts/tests/test_gemini_runtime_verify.py'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/gemini-runtime-verify.json'

permissions:
  contents: read

concurrency:
  group: minttick-gemini-runtime-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact one-call request and sanitized report logic
        run: python3 -m unittest discover -s scripts/tests -p test_gemini_runtime_verify.py -v

  verify:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: aitrading-paper-ec2-manual-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact one-file diagnostic request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "operationReact/AiTradingSystem"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/ec2-paper/requests/gemini-runtime-verify.json'
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'infra/ec2-paper')
          from gemini_runtime_verify import REQUEST, expected_request
          assert not REQUEST.is_symlink() and REQUEST.is_file() and REQUEST.stat().st_size < 1500
          assert json.loads(REQUEST.read_text()) == expected_request()
          PY
      - name: Assume existing single-host SSM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-gemini-runtime-${{ github.run_id }}
          role-duration-seconds: 900
      - name: Make exactly one synthetic Gemini request from existing backend host
        env:
          AWS_REGION: ap-south-1
        run: python3 infra/ec2-paper/gemini_runtime_verify.py runner
      - name: Retain sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-runtime-verify
          path: gemini-runtime-verify.json
          if-no-files-found: ignore
          retention-days: 14
