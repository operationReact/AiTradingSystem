name: MintTick F&O PAPER room and off-hours cycle acceptance (one-shot)
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno-paper-verification-room-once.yml'
permissions:
  contents: read
jobs:
  virtual-paper-acceptance:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      VERIFY_USERNAME: ${{ secrets.MINDTICK_VERIFY_USERNAME }}
      VERIFY_PASSWORD: ${{ secrets.MINDTICK_VERIFY_PASSWORD }}
      VERIFY_NEW_PASSWORD: ${{ secrets.MINDTICK_VERIFY_NEW_PASSWORD }}
      VERIFY_CLIENT_ID: ${{ vars.MINDTICK_VERIFY_COGNITO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Guard exact one-time verification code and workflow changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
              text=True).splitlines())
          expected={
            'scripts/mind/bootstrap_fno_paper_verify_room.py',
            'scripts/mind/test_bootstrap_fno_paper_verify_room.py',
            '.github/workflows/minttick-fno-paper-verification-room-once.yml',
          }
          assert paths==expected, "PAPER acceptance workflow requires exact reviewed one-shot commit"
          PY
      - name: Verify no-network virtual account safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mind/bootstrap_fno_paper_verify_room.py
          python3 -m unittest discover -s scripts/mind -p 'test_bootstrap_fno_paper_verify_room.py' -v
      - name: Acquire short-lived token for dedicated verification customer
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$VERIFY_USERNAME"
          test -n "$VERIFY_PASSWORD"
          test -n "$VERIFY_CLIENT_ID"
          umask 077
          printf '%s' "$VERIFY_PASSWORD" > "$RUNNER_TEMP/verify_password"
          printf '%s' "$VERIFY_NEW_PASSWORD" > "$RUNNER_TEMP/verify_new_password"
          python3 scripts/mind/mint_verify_token.py "$VERIFY_CLIENT_ID" "$VERIFY_USERNAME" \
            "$RUNNER_TEMP/verify_password" "$RUNNER_TEMP/verify_new_password" \
            "$RUNNER_TEMP/verify_fno_paper_access"
          rm -f "$RUNNER_TEMP/verify_password" "$RUNNER_TEMP/verify_new_password"
          test -s "$RUNNER_TEMP/verify_fno_paper_access"
          echo "MIND_FNO_PAPER_ACCEPTANCE_AUTH:VERIFICATION_CUSTOMER_ONLY"
      - name: One virtual F&O room and off-hours PAPER no-order cycle
        shell: bash
        run: |
          set -euo pipefail
          set +x
          trap 'rm -f "$RUNNER_TEMP/verify_fno_paper_access"' EXIT
          python3 scripts/mind/bootstrap_fno_paper_verify_room.py \
            "$RUNNER_TEMP/verify_fno_paper_access" --closed-market-paper-cycle
          echo "MIND_FNO_PAPER_REAL_MONEY_ORDERS:ZERO"
          echo "MIND_FNO_PAPER_STRATEGY_E2E:NOT_YET_PROVEN"
