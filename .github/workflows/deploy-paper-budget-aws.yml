name: Validate or deploy PAPER Flutter Web app to budget EC2

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Validate only, or deploy the PAPER environment after the production hard gate is satisfied"
        required: true
        default: "validate-only"
        type: choice
        options:
          - "validate-only"
          - "deploy-paper"
      confirm_paper_only:
        description: "Confirm this workflow remains PAPER-only"
        required: true
        type: choice
        options:
          - "yes-paper-only"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-paper-budget-ec2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: ai-trading-system-backend
  ECR_FRONTEND: ai-trading-system-frontend

jobs:
  validate:
    name: Validate backend and build production Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm PAPER-only intent
        run: test "${{ inputs.confirm_paper_only }}" = "yes-paper-only"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Build production Flutter Web
        working-directory: apps/trading_client
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=/api
      - name: Validate Flutter Web container definition
        run: |
          test -f apps/trading_client/Dockerfile
          test -f apps/trading_client/deploy/nginx.conf
          docker build -t ai-trading-system-flutter-web:validation apps/trading_client
          docker run -d --rm --name ai-trading-system-flutter-web-validation -p 18080:8080 ai-trading-system-flutter-web:validation
          trap 'docker stop ai-trading-system-flutter-web-validation >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:18080/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null

  deploy:
    name: Build ARM64 images and deploy PAPER via SSM
    if: ${{ inputs.action == 'deploy-paper' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enforce production delivery hard gate
        run: python3 scripts/check_flutter_delivery.py --require-complete
      - name: Fail closed on unapproved AWS deployment target
        env:
          CONFIGURED_REGION: ${{ vars.AWS_REGION }}
          CONFIGURED_ROLE: ${{ vars.AWS_ROLE_ARN }}
          WORKFLOW_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/dev" || { echo "::error::Deployment allowed only from dev"; exit 1; }
          test "${{ inputs.confirm_paper_only }}" = "yes-paper-only" || { echo "::error::PAPER-only confirmation missing"; exit 1; }
          test "$CONFIGURED_REGION" = "us-east-1" || { echo "::error::AWS_REGION must be us-east-1"; exit 1; }
          test "$WORKFLOW_REGION" = "$CONFIGURED_REGION" || { echo "::error::Workflow region differs from verified OIDC region"; exit 1; }
          test "$CONFIGURED_ROLE" = "arn:aws:iam::816344830716:role/aitradingsystem-github-deploy" || { echo "::error::Unexpected AWS role"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Build Flutter Web deployment assets
        working-directory: apps/trading_client
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=/api
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-paper-budget-${{ github.run_id }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend ARM64 image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker buildx build --platform linux/arm64 --push -f backend/Dockerfile -t "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG" backend
      - name: Build and push Flutter Web ARM64 image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker buildx build --platform linux/arm64 --push -f apps/trading_client/Dockerfile -t "$REGISTRY/$ECR_FRONTEND:$IMAGE_TAG" apps/trading_client
      - name: Deploy through AWS Systems Manager
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$AWS_INSTANCE_ID" || (echo "Set repository variable AWS_INSTANCE_ID from Terraform output." && exit 1)
          COMMAND_TEXT="for attempt in $(seq 1 60); do test -f /var/lib/ai-trading-bootstrap-complete && break; sleep 10; done; test -f /var/lib/ai-trading-bootstrap-complete && sudo /opt/ai-trading/deploy.sh $IMAGE_TAG"
          COMMAND_JSON="$(jq -n --arg command "$COMMAND_TEXT" '{commands: [$command]}')"
          COMMAND_ID="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$COMMAND_JSON" --comment "Deploy PAPER-only AiTradingSystem Flutter Web commit $IMAGE_TAG" --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$AWS_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$AWS_INSTANCE_ID" --query '{Status:Status,Output:StandardErrorContent,Details:StatusDetails}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM deployment command."
          exit 1
      - name: Verify public health endpoint
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://maargglobal.com/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Health endpoint did not become healthy. Inspect SSM output and container logs."
          exit 1
