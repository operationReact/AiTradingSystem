name: Deploy paper trading app to budget EC2

on:
  workflow_dispatch:
    inputs:
      confirm_paper_only:
        description: "Confirm this deployment remains PAPER-only"
        required: true
        type: choice
        options:
          - "yes-paper-only"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-paper-budget-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  ECR_BACKEND: ai-trading-system-backend
  ECR_FRONTEND: ai-trading-system-frontend

jobs:
  validate:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  deploy:
    name: Build ARM64 images and deploy via SSM
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-paper-budget-${{ github.run_id }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend ARM64 image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 --push -f backend/Dockerfile -t "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG" backend
      - name: Build and push frontend ARM64 image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/arm64 --push --build-arg VITE_API_BASE_URL=/api -f frontend/Dockerfile -t "$REGISTRY/$ECR_FRONTEND:$IMAGE_TAG" frontend
      - name: Deploy through AWS Systems Manager
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$AWS_INSTANCE_ID" || (echo "Set repository variable AWS_INSTANCE_ID from Terraform output." && exit 1)
          test -n "${{ vars.AWS_ROLE_ARN }}" || (echo "Set repository variable AWS_ROLE_ARN from Terraform output." && exit 1)
          COMMAND_TEXT="for attempt in $(seq 1 60); do test -f /var/lib/ai-trading-bootstrap-complete && break; sleep 10; done; test -f /var/lib/ai-trading-bootstrap-complete && sudo /opt/ai-trading/deploy.sh $IMAGE_TAG"
          COMMAND_JSON="$(jq -n --arg command "$COMMAND_TEXT" '{commands: [$command]}')"
          COMMAND_ID="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$AWS_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$COMMAND_JSON" --comment "Deploy PAPER-only AiTradingSystem commit $IMAGE_TAG" --query 'Command.CommandId' --output text)"
          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$AWS_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$AWS_INSTANCE_ID" --query '{Status:Status,Output:StandardErrorContent,Details:StatusDetails}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM deployment command."
          exit 1
      - name: Verify public health endpoint
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://maargglobal.com/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Health endpoint did not become healthy. Inspect SSM output and container logs."
          exit 1
