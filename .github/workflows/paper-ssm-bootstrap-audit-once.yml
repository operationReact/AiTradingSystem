name: PAPER EC2 - one-time sanitized SSM bootstrap diagnostics (no mutations)

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/paper-ssm-bootstrap-audit-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          role-session-name: paper-bootstrap-audit-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ap-south-1
      - name: Diagnose exact running ARM64 host by read-only SSM command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys,time
          sys.path.insert(0,'infra/ec2-paper')
          import verify_ssm_release as gate
          gate.verify_aws()

          # Fixed allowlisted commands; output contains only PASS/FAIL markers.
          # No environment variables, secret values, system logs or metadata.
          checks = [
            ("root", 'test "$(id -u)" -eq 0'),
            ("arm64", 'test "$(uname -m)" = "aarch64"'),
            ("cloud_init", 'cloud-init status --wait >/dev/null 2>&1'),
            ("docker_service", 'test "$(systemctl is-active docker)" = "active"'),
            ("ssm_service", 'test "$(systemctl is-active amazon-ssm-agent)" = "active"'),
            ("docker_daemon", 'docker info --format "{{.ServerVersion}}" >/dev/null 2>&1'),
            ("docker_compose", 'docker compose version >/dev/null 2>&1'),
            ("aws_cli", 'aws --version >/dev/null 2>&1'),
            ("deploy_directory", 'test -d /opt/aitradingsystem-paper && test ! -L /opt/aitradingsystem-paper'),
            ("runtime_secrets_file", 'test -f /opt/aitradingsystem-paper/runtime.env && test ! -L /opt/aitradingsystem-paper/runtime.env'),
            ("secret_mode", 'test "$(stat -c %a /opt/aitradingsystem-paper/runtime.env 2>/dev/null)" = "600"'),
            ("database_password_present", 'grep -Eq "^POSTGRES_PASSWORD=[0-9a-f]{64}$" /opt/aitradingsystem-paper/runtime.env'),
            ("api_key_present", 'grep -Eq "^APP_API_KEY=[0-9a-f]{64}$" /opt/aitradingsystem-paper/runtime.env'),
            ("free_disk_6g", 'test "$(df -Pk / | awk \'NR==2 {print $4}\')" -gt 6291456'),
          ]
          commands=['#!/usr/bin/env bash','set -u','bad=0']
          for name, test in checks:
            commands.append(f'if {test}; then echo CHECK_{name}:PASS; else echo CHECK_{name}:FAIL; bad=1; fi')
          commands.append('exit "$bad"')
          import json
          issued=gate.aws_json("ssm","send-command","--document-name","AWS-RunShellScript",
                              "--instance-ids",gate.INSTANCE,"--timeout-seconds","300",
                              "--comment","Sanitized PAPER EC2 bootstrap status checks only",
                              "--parameters",json.dumps({"commands":commands}))
          command_id=issued.get("Command",{}).get("CommandId")
          if not command_id:
            raise SystemExit("SSM diagnostic command not accepted")
          for attempt in range(42):
            time.sleep(5)
            try:
              result=gate.aws_json("ssm","get-command-invocation","--command-id",command_id,
                                   "--instance-id",gate.INSTANCE)
            except gate.Rejected:
              if attempt<5: continue
              raise
            if result.get("Status") in ("Success","Failed","Cancelled","TimedOut"):
              lines=result.get("StandardOutputContent","").splitlines()
              markers=[line for line in lines if line.startswith("CHECK_") and (line.endswith(":PASS") or line.endswith(":FAIL"))]
              for marker in markers: print(marker,flush=True)
              print("SSM diagnostic result:",result.get("Status"),"exit",result.get("ResponseCode"),flush=True)
              if result.get("Status")!="Success" or any(m.endswith(":FAIL") for m in markers):
                raise SystemExit("One or more host bootstrap checks failed; no EC2 changes made")
              print("Exact EC2 read-only bootstrap readiness diagnostics passed")
              break
          else:
            raise SystemExit("SSM diagnostic timed out")
          PY
# No software installs, no IAM writes, no security-group updates, no secrets in logs.
