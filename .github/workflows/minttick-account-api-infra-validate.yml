name: MintTick account API - isolated infrastructure validation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/minttick-account-api/**'
      - '.github/workflows/minttick-account-api-infra-validate.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/minttick-account-api/**'
      - '.github/workflows/minttick-account-api-infra-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Verify infrastructure without AWS access or paid resources
        working-directory: infra/minttick-account-api
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          bash -n bootstrap.sh
          grep -q 'PROVISION_MINTTICK_ACCOUNT_DEV' variables.tf
          grep -q 'prevent_destroy = true' main.tf
