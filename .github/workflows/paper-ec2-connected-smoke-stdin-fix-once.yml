name: PAPER EC2 - strict connected PAPER smoke with isolated script stdin

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/paper-ec2-connected-smoke-stdin-fix-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          role-session-name: paper-connected-stdin-fix-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ap-south-1
      - name: Read-only deployed PAPER app, Flyway and local network acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,re,sys,time
          sys.path.insert(0,'infra/ec2-paper')
          import verify_ssm_release as gate
          gate.verify_aws()
          script=r"""#!/usr/bin/env bash
          set -u
          root=/opt/aitradingsystem-paper
          if test -f "$root/.env" && test -f "$root/paper-compose.yml"; then
            echo AUDIT_DEPLOYMENT_FILES:PASS
          else echo AUDIT_DEPLOYMENT_FILES:FAIL; fi
          cd "$root" || exit 2
          if docker compose --env-file .env -f paper-compose.yml ps --status running --services | grep -Fx postgres >/dev/null; then echo AUDIT_POSTGRES_RUNNING:PASS; else echo AUDIT_POSTGRES_RUNNING:FAIL; fi
          if docker compose --env-file .env -f paper-compose.yml ps --status running --services | grep -Fx backend >/dev/null; then echo AUDIT_BACKEND_RUNNING:PASS; else echo AUDIT_BACKEND_RUNNING:FAIL; fi
          if docker compose --env-file .env -f paper-compose.yml ps --status running --services | grep -Fx web >/dev/null; then echo AUDIT_FLUTTER_RUNNING:PASS; else echo AUDIT_FLUTTER_RUNNING:FAIL; fi
          if docker compose --env-file .env -f paper-compose.yml exec -T postgres pg_isready -U aitrading -d aitrading </dev/null >/dev/null 2>&1; then echo AUDIT_POSTGRES_READY:PASS; else echo AUDIT_POSTGRES_READY:FAIL; fi
          if docker compose --env-file .env -f paper-compose.yml exec -T postgres psql -U aitrading -d aitrading -Atc "SELECT COUNT(*) FROM flyway_schema_history" </dev/null >/dev/null 2>&1; then echo AUDIT_FLYWAY_MIGRATIONS:PASS; else echo AUDIT_FLYWAY_MIGRATIONS:FAIL; fi
          if curl -fsS --max-time 8 http://127.0.0.1:8080/api/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("status")=="UP" and x.get("mode")=="PAPER"' >/dev/null 2>&1; then echo AUDIT_API_PAPER_HEALTH:PASS; else echo AUDIT_API_PAPER_HEALTH:FAIL; fi
          if curl -fsS --max-time 8 http://127.0.0.1:8088/health >/dev/null 2>&1; then echo AUDIT_WEB_HEALTH:PASS; else echo AUDIT_WEB_HEALTH:FAIL; fi
          if curl -fsS --max-time 8 http://127.0.0.1:8088/api/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("status")=="UP" and x.get("mode")=="PAPER"' >/dev/null 2>&1; then echo AUDIT_WEB_PROXY_PAPER:PASS; else echo AUDIT_WEB_PROXY_PAPER:FAIL; fi
          if docker compose --env-file .env -f paper-compose.yml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert s["backend"]["environment"]["TRADING_MODE"]=="PAPER"; assert not s["postgres"].get("ports"); assert all(p.get("host_ip")=="127.0.0.1" for n in ("backend","web") for p in s[n].get("ports",[]))' >/dev/null 2>&1; then echo AUDIT_LOCALHOST_ONLY:PASS; else echo AUDIT_LOCALHOST_ONLY:FAIL; fi
          """
          encoded=base64.b64encode(script.encode()).decode()
          command=f"set -eu; f=$(mktemp); trap 'rm -f -- \"$f\"' EXIT; printf '%s' '{encoded}' | base64 -d > \"$f\"; bash \"$f\""
          r=gate.aws_json('ssm','send-command',
             '--document-name','AWS-RunShellScript','--instance-ids',gate.INSTANCE,
             '--timeout-seconds','300',
             '--comment','Read-only exact PAPER Java/Postgres/Flutter connected smoke',
             '--parameters',json.dumps({'commands':[command]}))
          command_id=r.get('Command',{}).get('CommandId')
          if not command_id: raise SystemExit('SSM read-only smoke not submitted')
          for attempt in range(50):
            time.sleep(5)
            try:
              result=gate.aws_json('ssm','get-command-invocation','--command-id',command_id,'--instance-id',gate.INSTANCE)
            except gate.Rejected:
              if attempt<5: continue
              raise
            if result.get('Status') in ('Success','Failed','Cancelled','TimedOut'):
              checks=[line for line in result.get('StandardOutputContent','').splitlines()
                      if re.fullmatch('AUDIT_[A-Z_]+:(?:PASS|FAIL)',line)]
              for line in checks: print(line,flush=True)
              print('SSM audit exit status:',result.get('Status'),result.get('ResponseCode'),flush=True)
              if len(checks)!=10 or any(x.endswith(':FAIL') for x in checks):
                raise SystemExit('Deployed PAPER connected smoke failed one or more strict checks')
              if result.get('Status')!='Success':
                raise SystemExit('SSM read-only application audit failed')
              print('PASS: exact PAPER EC2 PostgreSQL Flyway Spring API and Flutter Web verified locally')
              break
          else: raise SystemExit('PAPER SSM health audit timed out')
          PY
# No read of secrets, new AWS resources, SSH or public endpoints.
