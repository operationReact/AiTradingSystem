name: MintTick - read-only deployed Upstox F&O HTTP smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno-live-http-smoke.yml'
      - 'infra/ec2-paper/fno_v3_http_smoke.py'
      - 'scripts/tests/test_fno_v3_http_smoke.py'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/fno-v3-http-smoke.json'

permissions:
  contents: read

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fixed read-only F&O HTTP surface and parser
        run: |
          set -euo pipefail
          python3 -m py_compile infra/ec2-paper/fno_v3_http_smoke.py
          python3 -m unittest discover -s scripts/tests -p 'test_fno_v3_http_smoke.py' -v
          python3 - <<'PY'
          from pathlib import Path
          s=Path('infra/ec2-paper/fno_v3_http_smoke.py').read_text()
          assert 2000<len(s)<12000
          assert s.count('http_get("/api/customer/markets/fno/capability")')==1
          assert s.count('http_get("/api/admin/market-data/upstox-analytics/fno/live/status", key)')==1
          for prohibited in ('--with-decryption', 'placeOrder', 'submitOrder',
                             'delete-order', 'market/quotes', 'UPDATE customer_',
                             'DELETE FROM customer_', 'print(key)',
                             'POST",', 'method="POST"'):
              assert prohibited not in s
          PY

  probe:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact approved one-file read-only HTTP request
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/ec2-paper/requests/fno-v3-http-smoke.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('infra/ec2-paper/requests/fno-v3-http-smoke.json')
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<1024
          assert json.loads(p.read_text()) == {
            'application':'MintTick', 'region':'ap-south-1',
            'aws_account':'098859530205', 'instance_id':'i-09c01b470fb39b85a',
            'operation':'read-only-fno-v3-http-smoke'
          }
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: fno-v3-readonly-http
      - name: Execute fixed GET-only localhost API smoke via exact host
        run: |
          set -euo pipefail
          python3 infra/ec2-paper/fno_v3_http_smoke.py runner
