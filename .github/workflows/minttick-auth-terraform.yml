name: MintTick Cognito customer authentication - validate and deploy

on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/minttick-auth/**'
      - '.github/workflows/minttick-auth-terraform.yml'
  push:
    branches: [dev]
    paths:
      - 'infra/minttick-auth/requests/deploy.json'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Preview Terraform or apply approved dev Cognito resources'
        required: true
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: minttick-auth-terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Validate isolated identity infrastructure without AWS access
        working-directory: infra/minttick-auth
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  plan-or-apply:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      EXPECTED_ACCOUNT: "098859530205"
      TF_IN_AUTOMATION: "true"
      MINTTICK_AUTH_ROLE: arn:aws:iam::098859530205:role/minttick-auth-github-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm dedicated limited identity role, region and branch
        run: |
          set -euo pipefail
          test "$MINTTICK_AUTH_ROLE" = "arn:aws:iam::098859530205:role/minttick-auth-github-deploy"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$AWS_REGION" = "ap-south-1"
      - name: Authenticate an exact one-shot reviewed dev apply request
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'infra/minttick-auth/requests/deploy.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('infra/minttick-auth/requests/deploy.json').read_text())
          expected = {
              'application': 'MintTick',
              'environment': 'dev',
              'aws_account': '098859530205',
              'region': 'ap-south-1',
              'operation': 'apply',
              'authorization': 'USER_APPROVED_COGNITO_ESSENTIALS_2026-11-07',
          }
          if obj != expected:
              raise SystemExit('Refusing unexpected or modified identity provisioning request')
          print('Validated explicit narrowly scoped MintTick Cognito dev apply')
          PY
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/minttick-auth-github-deploy
          aws-region: ap-south-1
          role-session-name: minttick-auth-${{ github.run_id }}
      - name: Reject wrong AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
      - name: Initialize encrypted remote Terraform state with lockfile
        working-directory: infra/minttick-auth
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false
      - name: Preview identity changes
        working-directory: infra/minttick-auth
        run: |
          set -euo pipefail
          terraform validate
          terraform plan -input=false -var="environment=dev" -out="$RUNNER_TEMP/minttick-auth.tfplan"
          terraform show -no-color "$RUNNER_TEMP/minttick-auth.tfplan"
      - name: Apply only when operation=apply
        if: github.event_name == 'push' || inputs.operation == 'apply'
        working-directory: infra/minttick-auth
        run: |
          set -euo pipefail
          terraform apply -input=false "$RUNNER_TEMP/minttick-auth.tfplan"
          terraform output cognito_region
          terraform output cognito_user_pool_id
          terraform output cognito_client_id
          terraform output cognito_issuer
      - name: Remove sensitive Terraform plan from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/minttick-auth.tfplan"
