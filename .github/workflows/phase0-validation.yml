name: Phase 0 - Baseline validation

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Java 21, runner-local PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Prepare runner-local PostgreSQL databases
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-client
          fi
          sudo systemctl start postgresql
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='aitrading'" | grep -qx 1; then
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE aitrading LOGIN PASSWORD 'aitrading';"
          else
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE aitrading WITH LOGIN PASSWORD 'aitrading';"
          fi
          for db in aitrading_test aitrading_phase8_exit; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb --owner=aitrading "$db"
            pg_isready -h 127.0.0.1 -p 5432 -d "$db"
          done

      - name: Run backend unit and integration tests
        working-directory: backend
        env:
          ATS_TEST_POSTGRES_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/aitrading_test
          ATS_PHASE8_EXIT_POSTGRES_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/aitrading_phase8_exit
          ATS_TEST_POSTGRES_USERNAME: aitrading
          ATS_TEST_POSTGRES_PASSWORD: aitrading
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload backend failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-failure-reports
          path: |
            backend/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  legacy-frontend-build:
    name: Legacy React reference build (non-release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate legacy mobile metadata
        working-directory: frontend
        run: npm run validate:mobile

      - name: Build legacy reference assets
        working-directory: frontend
        run: npm run build

  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -diff -recursive
      - name: Initialize providers without configuring remote state
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Validate infrastructure
        working-directory: infra/terraform
        run: terraform validate

  container-image-build:
    name: Build production Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ai-trading-system-backend:ci backend
      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Build Flutter web release assets
        working-directory: apps/trading_client
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=https://example.invalid
      - name: Package Flutter web production image
        run: docker build -f apps/trading_client/Dockerfile -t ai-trading-system-frontend:ci apps/trading_client

  budget-terraform-validation:
    name: Budget Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check budget Terraform formatting
        working-directory: infra/terraform-budget
        run: terraform fmt -check -diff -recursive
      - name: Initialize providers without remote state
        working-directory: infra/terraform-budget
        run: terraform init -backend=false
      - name: Validate budget stack
        working-directory: infra/terraform-budget
        run: terraform validate
