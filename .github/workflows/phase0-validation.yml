name: Phase 0 - Baseline validation

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Java 21, PostgreSQL/Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend unit and integration tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  legacy-frontend-build:
    name: Legacy React reference build (non-release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate legacy mobile metadata
        working-directory: frontend
        run: npm run validate:mobile

      - name: Build legacy reference assets
        working-directory: frontend
        run: npm run build

  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -diff -recursive
      - name: Initialize providers without configuring remote state
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Validate infrastructure
        working-directory: infra/terraform
        run: terraform validate

  container-image-build:
    name: Build production Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ai-trading-system-backend:ci backend
      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Build Flutter web release assets
        working-directory: apps/trading_client
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=https://example.invalid
      - name: Package Flutter web production image
        run: docker build -f apps/trading_client/Dockerfile -t ai-trading-system-frontend:ci apps/trading_client

  budget-terraform-validation:
    name: Budget Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check budget Terraform formatting
        working-directory: infra/terraform-budget
        run: terraform fmt -check -diff -recursive
      - name: Initialize providers without remote state
        working-directory: infra/terraform-budget
        run: terraform init -backend=false
      - name: Validate budget stack
        working-directory: infra/terraform-budget
        run: terraform validate
