name: MintTick - read-only PAPER F&O HTTP500 schema diagnosis
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-fno-room-http500-diagnose.yml'
      - 'infra/ec2-paper/probe_fno_room_http500.py'
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/fno-room-http500.json'
permissions:
  contents: read
concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce read-only fixed status probe
        run: |
          set -euo pipefail
          python3 -m py_compile infra/ec2-paper/probe_fno_room_http500.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('infra/ec2-paper/probe_fno_room_http500.py').read_text()
          assert len(s) < 9000
          for required in ['to_regclass', 'flyway_schema_history', 'customer_paper_fno_order',
                           'customer_paper_fno_position', 'FNO_ERROR_CLASS:',
                           'FNO_RELEASE_SHA:']:
              assert required in s
          for forbidden in ['--with-decryption', 'get-parameter', 'placeOrder',
                            'submitOrder', 'print(proc.stderr)', 'print(proc.stdout)',
                            'os.system(', 'shell=True', 'docker compose up',
                            'docker restart', 'UPDATE customer_', 'DELETE FROM customer_']:
              assert forbidden not in s
          PY
  diagnose:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require exact approved single-file request
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "infra/ec2-paper/requests/fno-room-http500.json"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('infra/ec2-paper/requests/fno-room-http500.json')
          assert p.is_file() and not p.is_symlink() and p.stat().st_size<1024
          assert json.loads(p.read_text()) == {
            "application":"MintTick", "environment":"PAPER",
            "operation":"read-only-fno-room-http500-diagnose",
            "region":"ap-south-1", "aws_account":"098859530205",
            "instance_id":"i-09c01b470fb39b85a"
          }
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          aws-region: ap-south-1
          role-session-name: minttick-fno-http500-readonly
      - name: Check AWS account and execute non-mutating host probe
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "098859530205"
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          script=Path('infra/ec2-paper/probe_fno_room_http500.py').read_bytes()
          command="printf '%s' '"+base64.b64encode(script).decode()+"' | base64 -d | python3 -"
          p=Path(os.environ['RUNNER_TEMP'])/'fno-diag-params.json'
          p.write_text(json.dumps({'commands':[command]}))
          p.chmod(0o600)
          PY
          cid="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids i-09c01b470fb39b85a --timeout-seconds 180 --parameters "file://$RUNNER_TEMP/fno-diag-params.json" --comment 'MintTick F&O read-only DB schema and sanitized runtime diagnostics' --query Command.CommandId --output text)"
          rm -f "$RUNNER_TEMP/fno-diag-params.json"
          for attempt in $(seq 1 35); do
            aws ssm get-command-invocation --command-id "$cid" --instance-id i-09c01b470fb39b85a --output json > "$RUNNER_TEMP/fno-diag-result.json" 2>/dev/null || true
            result="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          try:
            data=json.loads((Path(os.environ['RUNNER_TEMP'])/'fno-diag-result.json').read_text())
          except (OSError, ValueError):
            print("PENDING")
            raise SystemExit
          tables=["CUSTOMER_PAPER_FNO_POSITION","CUSTOMER_PAPER_FNO_ORDER",
                  "CUSTOMER_PAPER_ACCOUNT","CUSTOMER_TRADING_ROOM","FLYWAY_SCHEMA_HISTORY"]
          allow={"FNO_POSTGRES":{"RUNNING","UNAVAILABLE"},
                 "FNO_BACKEND":{"RUNNING","UNAVAILABLE"},
                 "FNO_MIGRATION_92":{"APPLIED","NOT_APPLIED","UNAVAILABLE"},
                 "FNO_MIGRATION_94":{"APPLIED","NOT_APPLIED","UNAVAILABLE"},
                 "FNO_ERROR_CLASS":{"FNO_TABLE_MISSING","FNO_TABLE_PERMISSION",
                    "FNO_COLUMN_MISMATCH","FNO_SQL_EXCEPTION","UPSTOX_RUNTIME_ERROR",
                    "FNO_RUNTIME_ERROR","NO_CLASSIFIED_ERROR","UNAVAILABLE"}}
          for name in tables:
            allow["FNO_TABLE_"+name]={"PRESENT","MISSING","UNAVAILABLE"}
          for name in ["MINTTICK_UPSTOX_FNO_PAPER_ENABLED",
                       "MINTTICK_UPSTOX_FNO_V3_FEED_ENABLED",
                       "MINTTICK_UPSTOX_FNO_DISPLAY_RIGHTS_VERIFIED",
                       "MINTTICK_UPSTOX_FNO_PAPER_USAGE_RIGHTS_VERIFIED",
                       "MINTTICK_UPSTOX_ANALYTICS_ENABLED"]:
            allow["FNO_CONFIG_"+name]={"ENABLED","DISABLED","UNKNOWN"}
            allow["FNO_EFFECTIVE_"+name]={"ENABLED","DISABLED","UNKNOWN"}
          found={}
          for line in data.get("StandardOutputContent","").splitlines():
            key,separator,value=line.partition(": ")
            if not separator: continue
            if key=="FNO_RELEASE_SHA" and (value=="UNAVAILABLE" or re.fullmatch("[a-f0-9]{40}",value)):
              found[key]=value
            elif key in allow and value in allow[key]:
              found[key]=value
          for key in sorted(found):
            print(key+": "+found[key])
          state=data.get("Status")
          if state=="Success" and len(found)==len(allow)+1:
            print("PASS")
          elif state in ("Failed","TimedOut","Cancelled","Success"):
            print("FAILED")
          else:
            print("PENDING")
          PY
            )"
            if [[ "$result" == *$'\nPASS' ]]; then
              printf '%s\n' "$result"
              exit 0
            fi
            if [[ "$result" == *$'\nFAILED' ]]; then
              printf '%s\n' "$result"
              exit 2
            fi
            sleep 4
          done
          echo "Read-only F&O status probe timed out" >&2
          exit 2
