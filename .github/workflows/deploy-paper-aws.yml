name: Deploy paper trading app to AWS

on:
  workflow_dispatch:
    inputs:
      confirm_paper_only:
        description: "Confirm this deployment remains PAPER-only"
        required: true
        type: choice
        options:
          - "yes-paper-only"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-paper-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  ECR_BACKEND: ai-trading-system-backend
  ECR_FRONTEND: ai-trading-system-frontend
  ECS_CLUSTER: ai-trading-system
  ECS_BACKEND_SERVICE: ai-trading-system-backend
  ECS_FRONTEND_SERVICE: ai-trading-system-frontend
  BACKEND_TASK_FAMILY: ai-trading-system-backend
  FRONTEND_TASK_FAMILY: ai-trading-system-frontend

jobs:
  validate:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Flutter product delivery hard gate
        run: python3 scripts/check_flutter_delivery.py --require-complete
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  deploy:
    name: Publish images and update ECS services
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Flutter product delivery hard gate
        run: python3 scripts/check_flutter_delivery.py --require-complete
      - name: Fail closed on unapproved AWS deployment target
        env:
          CONFIGURED_REGION: ${{ vars.AWS_REGION }}
          CONFIGURED_ROLE: ${{ vars.AWS_ROLE_ARN }}
          WORKFLOW_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/dev" || { echo "::error::Deployment allowed only from dev"; exit 1; }
          test "$CONFIGURED_REGION" = "us-east-1" || { echo "::error::AWS_REGION must be us-east-1"; exit 1; }
          test "$WORKFLOW_REGION" = "$CONFIGURED_REGION" || { echo "::error::Workflow region differs from verified OIDC region; reconcile stack first"; exit 1; }
          test "$CONFIGURED_ROLE" = "arn:aws:iam::816344830716:role/aitradingsystem-github-deploy" || { echo "::error::Unexpected AWS role"; exit 1; }
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-paper-deploy-${{ github.run_id }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG" backend
          docker push "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG"
      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f frontend/Dockerfile --build-arg VITE_API_BASE_URL=/api -t "$REGISTRY/$ECR_FRONTEND:$IMAGE_TAG" frontend
          docker push "$REGISTRY/$ECR_FRONTEND:$IMAGE_TAG"
      - name: Register backend task definition with this commit image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$BACKEND_TASK_FAMILY" --query taskDefinition > /tmp/backend-task.json
          jq --arg image "$REGISTRY/$ECR_BACKEND:$IMAGE_TAG" '
            .containerDefinitions |= map(if .name == "backend" then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' /tmp/backend-task.json > /tmp/backend-task-new.json
          aws ecs register-task-definition --cli-input-json file:///tmp/backend-task-new.json > /tmp/backend-registered.json
      - name: Register frontend task definition with this commit image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$FRONTEND_TASK_FAMILY" --query taskDefinition > /tmp/frontend-task.json
          jq --arg image "$REGISTRY/$ECR_FRONTEND:$IMAGE_TAG" '
            .containerDefinitions |= map(if .name == "frontend" then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' /tmp/frontend-task.json > /tmp/frontend-task-new.json
          aws ecs register-task-definition --cli-input-json file:///tmp/frontend-task-new.json > /tmp/frontend-registered.json
      - name: Deploy both ECS services in PAPER mode
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_BACKEND_SERVICE" --task-definition "$(jq -r '.taskDefinition.taskDefinitionArn' /tmp/backend-registered.json)" --desired-count 1
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_FRONTEND_SERVICE" --task-definition "$(jq -r '.taskDefinition.taskDefinitionArn' /tmp/frontend-registered.json)" --desired-count 1
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"
      - name: Verify public health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "https://maargglobal.com/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Health endpoint did not become healthy. Inspect ECS service events and CloudWatch logs."
          exit 1
