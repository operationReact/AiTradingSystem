name: MintTick - read-only authenticated Markets contract validation

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/minttick-market-contract-validation.yml'
      - 'infra/ec2-paper/verify_customer_markets.py'

permissions:
  contents: read

jobs:
  validator-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate standalone read-only customer API acceptance tool
        run: |
          python3 -m py_compile infra/ec2-paper/verify_customer_markets.py
          python3 infra/ec2-paper/verify_customer_markets.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          s = Path('infra/ec2-paper/verify_customer_markets.py').read_text()
          for prohibited in ['placeOrder', '--with-decryption', 'print(token)', 'print(price)', 'POST', 'PUT']:
              assert prohibited not in s
          PY
