name: PAPER EC2 - verify manual IAM and read-only status

# One-time activation check when this file is merged to the default branch.
# Deliberately not workflow_dispatch: use the normal Start/Stop/Status workflow
# for future operator actions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-ec2-manual-readonly-smoke.yml'

permissions:
  contents: read
  id-token: write

# Serialize with operator requests, but never cancel or mutate an instance.
concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT: "098859530205"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assume only dedicated main-branch PAPER EC2 manual lifecycle role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-manual-control
          role-session-name: paper-manual-status-smoke-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ap-south-1

      - name: Verify role identity, actual EC2 state and enabled daily stop (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"infra/ec2-paper")
          import control_paper_host as ctl

          ctl.verify_account()
          identity=ctl.aws_json("sts","get-caller-identity")
          arn=identity.get("Arn","")
          if not arn.startswith("arn:aws:sts::098859530205:assumed-role/aitrading-paper-ec2-manual-control/"):
              raise SystemExit("Unexpected IAM role identity; no control action attempted")
          state=ctl.describe()
          ctl.verify_schedule()
          if state!="stopped":
              raise SystemExit("Manual role works, but EC2 not in expected stopped baseline; no AWS mutation attempted")
          print("SUCCESS: Main OIDC lifecycle IAM role active; EC2 is stopped; 22 IST exact stop schedule enabled")
          print("Read-only audit complete; no StartInstances/StopInstances requests made")
          PY

# No EC2 start, stop, create, terminate, IAM writes, Terraform, or trading.
