name: Python XGBoost bounded research benchmark

on:
  pull_request:
    paths:
      - 'intelligence/**'
      - '.github/workflows/python-xgboost.yml'
  push:
    branches: [dev]
    paths:
      - 'intelligence/**'
      - '.github/workflows/python-xgboost.yml'

permissions:
  contents: read

jobs:
  xgboost-cpu-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            intelligence/pyproject.toml
            intelligence/requirements-xgboost-cpu.txt
      - name: Install Python intelligence and optional CPU XGBoost
        working-directory: intelligence
        run: |
          pip install -e '.[dev]'
          pip install -r requirements-xgboost-cpu.txt
      - name: Verify expected XGBoost version
        working-directory: intelligence
        run: >-
          python -c "import xgboost; assert xgboost.__version__ == '3.2.0'"
      - name: Lint research source and regression tests
        working-directory: intelligence
        run: ruff check src tests
      - name: Validate bounded Indian-market XGBoost research benchmark
        working-directory: intelligence
        run: pytest -q tests/test_xgboost_benchmark.py
