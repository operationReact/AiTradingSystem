name: V90 disposable synthetic research worker Docker runtime

on:
  pull_request:
    branches: [dev]
    paths:
      - 'intelligence/Dockerfile'
      - 'intelligence/Dockerfile.research-release'
      - 'intelligence/Dockerfile.research-release.dockerignore'
      - 'intelligence/src/aitrading_intelligence/research_image_context.py'
      - 'intelligence/src/aitrading_intelligence/research_release_bundle.py'
      - 'intelligence/src/aitrading_intelligence/research_startup_gate.py'
      - 'intelligence/src/aitrading_intelligence/research_artifact_inference.py'
      - 'intelligence/src/aitrading_intelligence/app.py'
      - 'intelligence/tests/ci_research_release_container_smoke.py'
      - 'intelligence/pyproject.toml'
      - 'scripts/tests/test_v4_synthetic_release_container_contract.py'
      - '.github/workflows/v4-synthetic-research-container-smoke.yml'
  push:
    branches: [dev]
    paths:
      - 'intelligence/Dockerfile'
      - 'intelligence/Dockerfile.research-release'
      - 'intelligence/Dockerfile.research-release.dockerignore'
      - 'intelligence/src/aitrading_intelligence/research_image_context.py'
      - 'intelligence/src/aitrading_intelligence/research_release_bundle.py'
      - 'intelligence/src/aitrading_intelligence/research_startup_gate.py'
      - 'intelligence/src/aitrading_intelligence/research_artifact_inference.py'
      - 'intelligence/src/aitrading_intelligence/app.py'
      - 'intelligence/tests/ci_research_release_container_smoke.py'
      - 'intelligence/pyproject.toml'
      - 'scripts/tests/test_v4_synthetic_release_container_contract.py'
      - '.github/workflows/v4-synthetic-research-container-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v90-disposable-research-docker
  cancel-in-progress: false

jobs:
  synthetic-release-image-runtime:
    name: Build actual synthetic model image and probe isolated runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: intelligence/pyproject.toml
      - name: Enforce no-AWS image smoke scope before installing ML dependencies
        run: python3 -m unittest discover -v -s scripts/tests -p test_v4_synthetic_release_container_contract.py

      - name: Install test-only scientific models and verifier
        run: pip install -e 'intelligence[dev]'

      - name: Build disposable image from Git HEAD, test strict boot and loopback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'operationReact/AiTradingSystem'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          image="v90-synthetic-research:$GITHUB_SHA"
          work="$RUNNER_TEMP/v90-synthetic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container_id=""
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          test ! -e "$work"

          # Test-only weights and committed sources; no production/model approval.
          python3 intelligence/tests/ci_research_release_container_smoke.py prepare \
            --repository-root "$GITHUB_WORKSPACE" \
            --code-sha "$GITHUB_SHA" --destination "$work"
          python3 -m aitrading_intelligence.research_image_context verify \
            --context "$work/private-build-context" --code-sha "$GITHUB_SHA"

          # Public Python/PyPI dependencies may be downloaded DURING build.
          # Never publish this image, sign production releases or send weights.
          docker build --no-cache \
            --file "$work/private-build-context/Dockerfile.research-release" \
            --build-arg "RESEARCH_SOURCE_SHA=$GITHUB_SHA" \
            --tag "$image" "$work/private-build-context"

          # Require the application's V78 rejection (2), not daemon/timeout failure.
          set +e
          denial="$(timeout 35s docker run --rm --network none \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev "$image" 2>&1)"
          denial_rc=$?
          set -e
          test "$denial_rc" -eq 2
          [[ "$denial" == *'V78 worker bootstrap BLOCKED (sanitized)'* ]]

          # Generated disposable token, never a real worker or broker secret.
          synthetic_token="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$synthetic_token"
          container_id="$(docker run -d --rm --network none \
            --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --env "AI_RESEARCH_WORKER_TOKEN=$synthetic_token" \
            "$image")"
          unset synthetic_token
          python3 intelligence/tests/ci_research_release_container_smoke.py probe \
            --container-id "$container_id"

          echo 'V90 synthetic image and loopback readiness/inference passed; release NOT authorized'

# No AWS permissions, OIDC, image registry login/push, artifact upload,
# external runtime network, deployed research worker, brokerage or capital.
