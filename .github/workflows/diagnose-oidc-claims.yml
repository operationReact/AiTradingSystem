name: Diagnose GitHub OIDC claims (no persistent AWS access)

on:
  push:
    branches: [dev]
    paths:
      - 'infra/oidc-diagnostic.request'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Show non-sensitive OIDC identity and signing-key diagnostics
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request

          def decode_segment(segment):
              return json.loads(base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          req = urllib.request.Request(url + sep + "audience=sts.amazonaws.com", headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(req, timeout=20) as resp:
              token = json.load(resp)["value"]

          header_segment, claims_segment, _ = token.split(".")
          header = decode_segment(header_segment)
          claims = decode_segment(claims_segment)

          print("alg: " + str(header.get("alg", "(not present)")))
          print("kid: " + str(header.get("kid", "(not present)")))
          print("x5t: " + str(header.get("x5t", "(not present)")))
          for field in ("iss", "aud", "sub", "repository", "ref", "event_name", "workflow_ref", "job_workflow_ref"):
              print(field + ": " + str(claims.get(field, "(not present)")))

          issuer = claims["iss"].rstrip("/")
          with urllib.request.urlopen(issuer + "/.well-known/openid-configuration", timeout=20) as resp:
              discovery = json.load(resp)
          jwks_uri = discovery["jwks_uri"]
          with urllib.request.urlopen(jwks_uri, timeout=20) as resp:
              jwks = json.load(resp)

          kid = header.get("kid")
          matching = [key for key in jwks.get("keys", []) if key.get("kid") == kid]
          print("discovery_issuer: " + str(discovery.get("issuer")))
          print("jwks_uri: " + str(jwks_uri))
          print("jwks_key_count: " + str(len(jwks.get("keys", []))))
          print("signing_kid_present_in_jwks: " + str(bool(matching)).lower())
          if matching:
              key = matching[0]
              print("matching_key_kty: " + str(key.get("kty")))
              print("matching_key_use: " + str(key.get("use")))
              print("matching_key_alg: " + str(key.get("alg")))
          else:
              raise SystemExit("GitHub OIDC signing key is not present in its published JWKS")
          PY

      - name: Test direct STS validation across endpoints without logging credentials
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN" || { echo "AWS_ROLE_ARN repository variable missing"; exit 1; }

          python3 - <<'PY'
          import os, json, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          req = urllib.request.Request(url + sep + "audience=sts.amazonaws.com", headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(req, timeout=20) as resp:
              token = json.load(resp)["value"]
          with open("/tmp/github-oidc-token", "w") as f:
              f.write(token)
          os.chmod("/tmp/github-oidc-token", 0o600)
          PY

          test_sts() {
            label="$1"
            endpoint="$2"
            region="$3"
            rm -f /tmp/sts-out.json /tmp/sts-err.txt
            set +e
            aws sts assume-role-with-web-identity \
              --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "oidc-diag-${GITHUB_RUN_ID}" \
              --web-identity-token "$(cat /tmp/github-oidc-token)" \
              --duration-seconds 900 \
              --endpoint-url "$endpoint" \
              --region "$region" \
              --output json >/tmp/sts-out.json 2>/tmp/sts-err.txt
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              arn="$(jq -r '.AssumedRoleUser.Arn // "(missing)"' /tmp/sts-out.json)"
              echo "$label: SUCCESS ($arn)"
            else
              msg="$(tr '\n' ' ' </tmp/sts-err.txt | sed -E 's/[[:space:]]+/ /g')"
              echo "$label: FAILED rc=$rc :: $msg"
            fi
          }

          test_sts "ap-south-2 regional STS" "https://sts.ap-south-2.amazonaws.com" "ap-south-2"
          test_sts "global STS" "https://sts.amazonaws.com" "us-east-1"
          test_sts "us-east-1 regional STS" "https://sts.us-east-1.amazonaws.com" "us-east-1"

          rm -f /tmp/github-oidc-token /tmp/sts-out.json /tmp/sts-err.txt
