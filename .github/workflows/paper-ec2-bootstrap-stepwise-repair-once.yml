name: PAPER EC2 - one-time stepwise Docker bootstrap repair via SSM

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/paper-ec2-bootstrap-stepwise-repair-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aitrading-paper-ec2-manual-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify fixed root-only bootstrap recovery contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/ec2-paper/bootstrap_repair_v2.sh
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'v5.6.0' infra/ec2-paper/bootstrap_repair_v2.sh
          grep -Fq 'STEP_RUNTIME_SECRETS:PASS' infra/ec2-paper/bootstrap_repair_v2.sh
          ! grep -Eq 'aws ec2|terraform apply|TRADING_MODE=LIVE|sshd|0\.0\.0\.0:8080' infra/ec2-paper/bootstrap_repair_v2.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-ssm-deploy
          role-session-name: paper-stepwise-repair-${{ github.run_id }}
          role-duration-seconds: 2700
          aws-region: ap-south-1

      - name: Repair exact running EC2; print only fixed PASS/FAIL markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,re,sys,time
          from pathlib import Path
          sys.path.insert(0,'infra/ec2-paper')
          import verify_ssm_release as gate
          gate.verify_aws()

          script=Path('infra/ec2-paper/bootstrap_repair_v2.sh').read_bytes()
          if not script.startswith(b'#!/usr/bin/env bash\n') or len(script)>15000:
              raise SystemExit('Invalid reviewed bootstrap; no commands sent')
          encoded=base64.b64encode(script).decode('ascii')
          cmd=f"printf '%s' '{encoded}' | base64 -d | bash"
          issued=gate.aws_json('ssm','send-command',
              '--document-name','AWS-RunShellScript',
              '--instance-ids',gate.INSTANCE,
              '--timeout-seconds','1800',
              '--comment','One-time PAPER safe stepwise Docker/Compose bootstrap repair',
              '--parameters',json.dumps({'commands':[cmd],'executionTimeout':['1800']}))
          command_id=issued.get('Command',{}).get('CommandId')
          if not command_id or not re.fullmatch('[a-f0-9-]{36}',command_id):
              raise SystemExit('No valid SSM command ID returned')
          result=None
          for attempt in range(230):
              time.sleep(7)
              try:
                  result=gate.aws_json('ssm','get-command-invocation',
                          '--command-id',command_id,'--instance-id',gate.INSTANCE)
              except gate.Rejected:
                  if attempt<5: continue
                  raise
              if result.get('Status') in ('Success','Failed','Cancelled','TimedOut','Cancelling'):
                  break
          else:
              raise SystemExit('SSM bootstrap timed out')
          # Remote script prints no secret values, only fixed audit markers.
          markers=[
              x for x in result.get('StandardOutputContent','').splitlines()
              if re.fullmatch('STEP_[A-Z_]+:(?:PASS|FAIL)',x)
          ]
          for marker in markers: print(marker,flush=True)
          if result.get('Status')!='Success' or not any(x=='STEP_BOOTSTRAP_COMPLETE:PASS' for x in markers):
              raise SystemExit('PAPER Docker bootstrap did not complete; no database release attempted')

          gate.verify_aws()
          gate.send_command('preflight')
          print('PASS: Existing EC2 Docker/Compose and local secrets ready for the next PAPER app release')
          PY

# No host replacement, EC2 Start/Stop, new cloud infrastructure, public ports,
# LIVE trading, SSH access or secret disclosure.
