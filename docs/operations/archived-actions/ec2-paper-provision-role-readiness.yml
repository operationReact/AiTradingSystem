name: EC2 PAPER provisioning-role readiness (read-only, no apply)

on:
  # Runs once when this workflow is introduced on dev, and on reviewed edits.
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ec2-paper-provision-role-readiness.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify-provision-role-only:
    if: github.repository == 'operationReact/AiTradingSystem' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AWS_ACCOUNT: "098859530205"
      AWS_REGION: ap-south-1
      STATE_REGION: us-east-1
      STATE_BUCKET: aitrading-paper-tfstate-098859530205-ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable dev-only workload and tagged resource contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "operationReact/AiTradingSystem"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$AWS_ACCOUNT" = "098859530205"
          test "$AWS_REGION" = "ap-south-1"
          test "$STATE_REGION" = "us-east-1"
          python3 -m unittest discover -s scripts/tests -p test_ec2_paper_locked_apply.py -v
          echo "No provisioning request file exists; this workflow performs no AWS writes"

      - name: Prove that the new restricted CloudFormation role can be assumed
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-provision
          role-session-name: paper-provision-role-check-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ap-south-1

      - name: Verify account, existing state bucket and absence of duplicate PAPER compute
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT"
          aws s3api get-bucket-location --bucket "$STATE_BUCKET" \
            --region "$STATE_REGION" --output json > "$RUNNER_TEMP/state-location.json"
          python3 - "$RUNNER_TEMP/state-location.json" <<'PY'
          import json,sys
          location=json.load(open(sys.argv[1], encoding="utf-8")).get("LocationConstraint")
          if location is not None:
              raise SystemExit("Expected existing state bucket in us-east-1")
          print("Existing state bucket location verified; EC2 target remains Mumbai")
          PY
          n="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Application,Values=ai-trading-system \
                      Name=tag:Environment,Values=paper \
            --query 'length(Reservations)' --output text)"
          if test "$n" != "0"; then
            echo "::error::Tagged PAPER EC2 resources already found; review before provisioning"
            exit 1
          fi
          echo "Restricted create-only PAPER OIDC role ASSUMED; account and no-duplicate check PASS"
          echo "No EC2 instance, IAM resource, S3 state, schedule or application created"

# GitHub Actions may assume a create-capable IAM role for identity verification,
# but this workflow contains only STS, S3 location and EC2 Describe operations.
# Paid provisioning requires a separate, reviewed, exact request-only merge.
