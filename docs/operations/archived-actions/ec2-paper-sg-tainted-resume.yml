name: EC2 PAPER audited SG taint reconciliation and final three-resource recovery

on:
  # Only a separately reviewed, request-only PR merged to dev may trigger
  # provisioning. This file is inactive until resume-tainted-sg.json exists.
  push:
    branches: [dev]
    paths:
      - 'infra/ec2-paper/requests/resume-tainted-sg.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: aitrading-paper-ec2-sg-taint-reconciliation
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_ACCOUNT: "098859530205"
      AWS_REGION: ap-south-1
      STATE_REGION: us-east-1
      APPROVAL_REQUEST: infra/ec2-paper/requests/resume-tainted-sg.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A parent commit is required for the exact request-only diff check.
          fetch-depth: 2

      - name: Refuse non-request commits and enforce exact user-approved scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "operationReact/AiTradingSystem"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$AWS_ACCOUNT" = "098859530205"
          test "$AWS_REGION" = "ap-south-1"
          test "$STATE_REGION" = "us-east-1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # A one-file, reviewed recovery PR prevents opportunistic changes
          # to IAM, instance size or network in the triggering commit.
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$APPROVAL_REQUEST"
          python3 infra/ec2-paper/verify_sg_tainted_resume.py request "$APPROVAL_REQUEST"
          echo "Exact one-time PAPER SG taint-reconciliation approval verified; no LIVE access"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Obtain narrow AWS create-only dev GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::098859530205:role/aitrading-paper-ec2-provision
          role-session-name: paper-ec2-create-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ap-south-1

      - name: Refuse cross-account access or pre-existing PAPER deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT"
          existing="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Application,Values=ai-trading-system \
                      Name=tag:Environment,Values=paper \
            --query 'length(Reservations)' --output text)"
          test "$existing" = "0" || {
            echo "::error::PAPER resource already exists; no duplicate provisioning"
            exit 1
          }
          echo "AWS identity and single PAPER deployment guard PASS"

      - name: Verify exact real SG with no inbound and only default IPv4 egress
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT"
          aws ec2 describe-security-groups --region "$AWS_REGION" \
            --group-ids sg-087969a194d7586ba \
            --query 'SecurityGroups[0]' --output json > "$RUNNER_TEMP/paper-exact-sg.json"
          python3 - "$RUNNER_TEMP/paper-exact-sg.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1], encoding="utf-8"))
          tags={t["Key"]:t["Value"] for t in s.get("Tags",[])}
          rules=s.get("IpPermissionsEgress")
          if (s.get("GroupId") != "sg-087969a194d7586ba"
              or s.get("VpcId") != "vpc-04712728d857bb782"
              or not s.get("GroupName","").startswith("aitrading-paper-no-inbound-")
              or tags.get("Application") != "ai-trading-system"
              or tags.get("Environment") != "paper"
              or tags.get("Name") != "aitradingsystem-paper-ec2"
              or s.get("IpPermissions") != []
              or not isinstance(rules,list) or len(rules) != 1):
              raise SystemExit("existing SG ID/VPC/tags or no-ingress policy mismatch")
          rule=rules[0]
          ipv4=rule.get("IpRanges",[])
          if (rule.get("IpProtocol") != "-1"
              or len(ipv4) != 1 or ipv4[0].get("CidrIp") != "0.0.0.0/0"
              or rule.get("Ipv6Ranges")
              or rule.get("PrefixListIds")
              or rule.get("UserIdGroupPairs")):
              raise SystemExit("SG default egress does not match intended PAPER outbound")
          print("Real PAPER SG identity, zero ingress and intended single IPv4 egress VERIFIED")
          PY

      - name: Reconcile exact tainted SG marker, then plan only three remaining resources
        working-directory: infra/ec2-paper
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/aitrading-paper-sg-resume-$GITHUB_RUN_ID"
          mkdir -m 0700 "$work"
          echo "PLAN_WORKDIR=$work" >> "$GITHUB_ENV"
          terraform fmt -check
          terraform init -input=false -no-color -backend-config=backend.hcl
          terraform validate -no-color
          terraform state list -no-color > "$work/state-addresses.txt"
          python3 verify_sg_tainted_resume.py state "$work/state-addresses.txt"
          # First plan is strictly a read-and-validate operation; NEVER apply
          # the SG replacement that Terraform proposes solely due to taint.
          terraform plan -input=false -no-color -lock=true -lock-timeout=2m -refresh=true \
            -var="approve_paid_provision=PROVISION_PAPER_EC2_4GB" \
            -var="instance_type=t4g.medium" \
            -var="root_volume_gib=35" \
            -var="daily_stop_hour_ist=22" \
            -var="daily_stop_enabled=true" \
            -out="$work/tainted-review.tfplan"
          terraform show -json "$work/tainted-review.tfplan" > "$work/tainted-review.json"
          python3 verify_sg_tainted_resume.py tainted "$work/tainted-review.json"
          # Clear ONLY Terraform's SG taint marker, not an AWS resource. The
          # exact real SG was independently checked for no ingress and intended egress.
          terraform untaint -lock=true -lock-timeout=2m 'aws_security_group.paper[0]'
          echo "Audited SG state taint reconciled without any AWS resource replacement"
          # Require the new, refreshed, locked plan to contain exactly three
          # CREATE-only managed actions and TEN existing NO-OP actions.
          terraform plan -input=false -no-color -lock=true -lock-timeout=2m -refresh=true \
            -var="approve_paid_provision=PROVISION_PAPER_EC2_4GB" \
            -var="instance_type=t4g.medium" \
            -var="root_volume_gib=35" \
            -var="daily_stop_hour_ist=22" \
            -var="daily_stop_enabled=true" \
            -out="$work/approved.tfplan"
          terraform show -json "$work/approved.tfplan" > "$work/approved-plan.json"
          python3 verify_sg_tainted_resume.py final "$work/approved-plan.json"
          echo "Exactly three safe missing resources planned; apply only this saved binary"

      - name: Apply same reviewed Terraform plan to isolated remote state
        working-directory: infra/ec2-paper
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PLAN_WORKDIR/approved.tfplan"
          test -f "$PLAN_WORKDIR/approved-plan.json"
          python3 verify_sg_tainted_resume.py final "$PLAN_WORKDIR/approved-plan.json"
          echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"
          terraform apply -input=false -no-color -lock=true -lock-timeout=2m \
            "$PLAN_WORKDIR/approved.tfplan"
          echo "PAPER partial recovery applied; no app/DB containers or LIVE orders deployed"

      - name: Verify exact running ARM64 instance and 22 IST automatic stop
        working-directory: infra/ec2-paper
        shell: bash
        run: |
          set -euo pipefail
          terraform output -json > "$PLAN_WORKDIR/outputs.json"
          python3 - "$PLAN_WORKDIR/outputs.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1], encoding="utf-8"))
          iid=x.get("paper_instance_id",{}).get("value")
          sched=x.get("paper_auto_stop_name",{}).get("value")
          if not isinstance(iid,str) or not iid.startswith("i-"):
              raise SystemExit("missing or invalid EC2 instance output")
          if sched != "aitrading-paper-nightly-stop":
              raise SystemExit("missing expected nightly stop schedule output")
          print("Terraform returned exact PAPER EC2 instance and stop schedule outputs")
          PY
          instance_id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["paper_instance_id"]["value"])' "$PLAN_WORKDIR/outputs.json")"
          aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$instance_id" \
            --query 'Reservations[0].Instances[0]' --output json > "$PLAN_WORKDIR/instance.json"
          python3 - "$PLAN_WORKDIR/instance.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          tags={t["Key"]:t["Value"] for t in x.get("Tags",[])}
          if (x.get("InstanceType")!="t4g.medium"
              or x.get("MetadataOptions",{}).get("HttpTokens")!="required"
              or x.get("State",{}).get("Name") not in ("pending","running","stopping","stopped")
              or tags.get("Application")!="ai-trading-system"
              or tags.get("Environment")!="paper"):
              raise SystemExit("actual EC2 4GB/PAPER/IMDSv2 verification BLOCKED")
          print("Actual AWS EC2 PAPER instance/IMDSv2/size verified")
          PY
          aws scheduler get-schedule --region "$AWS_REGION" \
            --name aitrading-paper-nightly-stop \
            --query '{State:State,Expression:ScheduleExpression,Timezone:ScheduleExpressionTimezone}' \
            --output json > "$PLAN_WORKDIR/stop.json"
          python3 - "$PLAN_WORKDIR/stop.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          if x != {"State":"ENABLED","Expression":"cron(0 22 * * ? *)",
                  "Timezone":"Asia/Kolkata"}:
              raise SystemExit("automatic 22 IST stop verification BLOCKED")
          print("EventBridge Scheduler nightly stop at 22:00 IST is ENABLED")
          PY

      - name: Stop new PAPER host if today's 22 IST shutdown window has passed
        shell: bash
        run: |
          set -euo pipefail
          # If first provision finishes after tonight's scheduled stop, the
          # next daily stop is tomorrow. Avoid almost 24h of idle EC2 billing.
          hour="$(TZ=Asia/Kolkata date +%H)"
          if (( 10#$hour >= 22 )); then
            test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT"
            instance_id="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["paper_instance_id"]["value"])' "$PLAN_WORKDIR/outputs.json")"
            instance_state="$(aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$instance_id" --query 'Reservations[0].Instances[0].State.Name' --output text)"
            if test "$instance_state" = "running" || test "$instance_state" = "pending"; then
              aws ec2 stop-instances --region "$AWS_REGION" --instance-ids "$instance_id" >/dev/null
              echo "New PAPER host stopped after 22:00 IST; restart on demand"
            else
              echo "New PAPER host already in state $instance_state; no stop required"
            fi
          else
            echo "Before 22:00 IST; enabled nightly scheduler will stop the PAPER instance"
          fi

      - name: Stop exact newly tagged PAPER instance if provisioning partially fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          # Only stop if the apply step was actually entered. Earlier IAM or
          # preflight failures must not touch existing instances in this account.
          if test "${DEPLOY_STARTED:-}" != "true"; then
            echo "Apply never started: no running PAPER compute to stop"
            exit 0
          fi
          if test "$(aws sts get-caller-identity --query Account --output text)" != "$AWS_ACCOUNT"; then
            echo "::error::Account mismatch: cannot safely run cost shutdown"
            exit 1
          fi
          ids="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Application,Values=ai-trading-system \
                      Name=tag:Environment,Values=paper \
                      Name=tag:Name,Values=aitradingsystem-paper-ec2 \
                      Name=instance-state-name,Values=pending,running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          for id in $ids; do
            if ! aws ec2 stop-instances --region "$AWS_REGION" --instance-ids "$id" >/dev/null; then
              echo "::warning::Automatic STOP failed: inspect actual PAPER EC2 billing immediately"
            else
              echo "Stopped exact project-tagged PAPER host after partial provisioning failure"
            fi
          done
          echo "::warning::If Terraform apply failed, reconcile remote state and any partial AWS resources before retrying"

      - name: Remove runner-local binary plan files and ephemeral observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${PLAN_WORKDIR:-}" && test -d "$PLAN_WORKDIR"; then
            rm -rf -- "$PLAN_WORKDIR"
          fi

# Never upload a Terraform plan, state, EC2 credentials or private parameters.
# No LIVE trades, public HTTP ports, RDS, NAT, ALB, ECR, AWS keys or broker tokens.
